<script>
  var state = {
    env: window.SIGMAFLOW_ENV === 'test' ? 'test' : 'prod',
    board: null,
    columnMeta: null,
    filters: {
      assignee: '',
      tag: '',
      size: ''
    }
  };

  var defaultColumns = [
    { status: 'backlog', label: 'Backlog', count: 0, points: 0 },
    { status: 'in_progress', label: 'In corso', count: 0, points: 0 },
    { status: 'stand_by', label: 'Stand-by', count: 0, points: 0 },
    { status: 'in_review', label: 'In review', count: 0, points: 0 },
    { status: 'done', label: 'Fatto', count: 0, points: 0 }
  ];

  document.addEventListener('DOMContentLoaded', function() {
    bindEnvironmentBadge();
    bindNavigation();
    bindFilters();
    bindJobForm();
    loadBoard();
    loadMetrics();
    window.setInterval(loadBoard, 60000);
  });

  function callApi(action, payload) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success === false) {
            reject(new Error((response && response.error) || 'Errore sconosciuto'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(reject)
        .api(action, Object.assign({}, payload || {}, { env: state.env }));
    });
  }

  function bindEnvironmentBadge() {
    var badge = document.getElementById('environment-badge');
    if (!badge) {
      return;
    }
    badge.textContent = state.env === 'test' ? 'TEST' : 'PROD';
    badge.className = 'environment-badge environment-' + state.env;
    badge.title = state.env === 'test'
      ? 'Ambiente TEST: scrive su SigmaFlow Database - TEST'
      : 'Ambiente PROD: scrive sul database operativo';
  }

  function bindNavigation() {
    document.querySelectorAll('.nav-button').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelectorAll('.nav-button').forEach(function(item) {
          item.classList.remove('active');
        });
        button.classList.add('active');
        document.getElementById('view-board').hidden = button.dataset.view !== 'board';
        document.getElementById('view-dashboard').hidden = button.dataset.view !== 'dashboard';
        if (button.dataset.view === 'dashboard') {
          loadMetrics();
        }
      });
    });
  }

  function bindFilters() {
    [
      ['filter-assignee', 'assignee'],
      ['filter-tag', 'tag'],
      ['filter-size', 'size']
    ].forEach(function(pair) {
      document.getElementById(pair[0]).addEventListener('input', function(event) {
        state.filters[pair[1]] = event.target.value.toLowerCase();
        renderBoard();
      });
    });
  }

  function bindJobForm() {
    var button = document.getElementById('add-job-button');
    var cancel = document.getElementById('cancel-job-button');
    var form = document.getElementById('job-form');
    button.addEventListener('click', function() {
      form.hidden = false;
      form.elements.title.focus();
    });
    cancel.addEventListener('click', function() {
      form.reset();
      form.hidden = true;
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      var data = Object.fromEntries(new FormData(form).entries());
      callApi('addJob', data).then(function() {
        form.reset();
        form.hidden = true;
        loadBoard();
      }).catch(showError);
    });
  }

  function loadBoard() {
    callApi('getBoard').then(function(data) {
      state.board = data.columns;
      state.columnMeta = data.column_meta;
      renderBoard();
    }).catch(showError);
  }

  function renderBoard() {
    var root = document.getElementById('kanban-board');
    root.innerHTML = '';

    getColumns().forEach(function(column) {
      var jobs = ((state.board && state.board[column.status]) || []).filter(matchesFilters);
      var points = jobs.reduce(function(sum, job) {
        return sum + Number(job.size_points || 0);
      }, 0);
      var columnEl = document.createElement('section');
      columnEl.className = 'column';
      columnEl.dataset.status = column.status;
      columnEl.innerHTML = [
        '<div class="column-header">',
        '<div>',
        '<h2 class="column-title"></h2>',
        '<div class="column-stats"></div>',
        '</div>',
        '<button type="button" class="rename-column-button" title="Rinomina colonna">Rinomina</button>',
        '</div>'
      ].join('');
      columnEl.querySelector('.column-title').textContent = column.label;
      columnEl.querySelector('.column-stats').textContent = jobs.length + ' job · ' + points + ' pt';
      columnEl.querySelector('.rename-column-button').addEventListener('click', function() {
        renameColumn(column);
      });
      columnEl.addEventListener('dragover', function(event) {
        event.preventDefault();
      });
      columnEl.addEventListener('drop', function(event) {
        event.preventDefault();
        columnEl.classList.remove('drop-target');
        moveJob(event.dataTransfer.getData('text/plain'), column.status);
      });
      columnEl.addEventListener('dragenter', function() {
        columnEl.classList.add('drop-target');
      });
      columnEl.addEventListener('dragleave', function(event) {
        if (!columnEl.contains(event.relatedTarget)) {
          columnEl.classList.remove('drop-target');
        }
      });

      jobs.forEach(function(job) {
        columnEl.appendChild(renderCard(job));
      });
      root.appendChild(columnEl);
    });
  }

  function renderCard(job) {
    var card = document.createElement('article');
    card.className = 'card';
    card.draggable = true;
    card.addEventListener('dragstart', function(event) {
      event.dataTransfer.setData('text/plain', job.job_id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });

    var reworkBadge = Number(job.visit_number || 1) > 1
      ? '<span class="badge rework">v' + job.visit_number + '</span>'
      : '<span class="badge">v1</span>';

    card.innerHTML = [
      '<div class="card-title"></div>',
      '<div class="badges">',
      '<span class="badge">' + escapeHtml(job.tag || 'senza tag') + '</span>',
      '<span class="badge">' + escapeHtml(job.assignee || 'non assegnato') + '</span>',
      '<span class="badge">' + escapeHtml((job.size_class || 'M') + ' · ' + (job.size_points || 8) + ' pt') + '</span>',
      reworkBadge,
      '</div>',
      '<div class="card-actions">',
      '<button type="button" class="delete-card-button">Elimina</button>',
      '</div>'
    ].join('');
    card.querySelector('.card-title').textContent = job.title || '(senza titolo)';
    card.querySelector('.delete-card-button').addEventListener('click', function() {
      deleteJob(job);
    });
    return card;
  }

  function moveJob(jobId, status) {
    if (!jobId) {
      return;
    }
    var previousBoard = cloneBoard();
    if (moveJobLocally(jobId, status)) {
      renderBoard();
    }
    callApi('moveJob', { job_id: jobId, status: status }).then(loadBoard).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function renameColumn(column) {
    var next = prompt('Nuovo nome colonna', column.label);
    if (next === null) {
      return;
    }
    next = next.trim();
    if (!next) {
      showError(new Error('Nome colonna vuoto'));
      return;
    }

    callApi('updateColumnLabel', { status: column.status, label: next }).then(loadBoard).catch(showError);
  }

  function deleteJob(job) {
    if (!confirm('Eliminare "' + (job.title || job.job_id) + '"?')) {
      return;
    }

    var previousBoard = cloneBoard();
    removeJobLocally(job.job_id);
    renderBoard();
    callApi('deleteJob', { job_id: job.job_id }).then(loadBoard).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function cloneBoard() {
    return JSON.parse(JSON.stringify(state.board || {}));
  }

  function getColumns() {
    return state.columnMeta && state.columnMeta.length ? state.columnMeta : defaultColumns;
  }

  function moveJobLocally(jobId, status) {
    var moved = null;
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        if (job.job_id === jobId) {
          moved = job;
          return false;
        }
        return true;
      });
    });
    if (!moved) {
      return false;
    }
    moved.status = status;
    if (!state.board[status]) {
      state.board[status] = [];
    }
    state.board[status].push(moved);
    return true;
  }

  function removeJobLocally(jobId) {
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        return job.job_id !== jobId;
      });
    });
  }

  function matchesFilters(job) {
    var assignee = String(job.assignee || '').toLowerCase();
    var tag = String(job.tag || '').toLowerCase();
    var size = String(job.size_class || '').toLowerCase();
    return (!state.filters.assignee || assignee.indexOf(state.filters.assignee) !== -1)
      && (!state.filters.tag || tag.indexOf(state.filters.tag) !== -1)
      && (!state.filters.size || size === state.filters.size);
  }

  function loadMetrics() {
    callApi('getMetrics').then(renderMetrics).catch(showError);
  }

  function renderMetrics(metrics) {
    var stability = metrics.stability || {};
    var stateEl = document.getElementById('system-state');
    stateEl.className = 'state-badge state-' + stability.system_state;
    stateEl.textContent = stability.system_state || '-';
    document.getElementById('rho-effective').textContent = 'rho effettivo: ' + valueOrDash(metrics.rework && metrics.rework.rho_effective);
    document.getElementById('rho-marker').style.left = Math.min(100, Math.max(0, ((metrics.rework && metrics.rework.rho_effective) || 0) * 100)) + '%';

    renderDl('empirical-metrics', {
      'Finestra': metrics.window_days + ' giorni',
      'Job osservati': metrics.n_jobs_observed,
      'lambda / giorno': metrics.lambda,
      'mu / giorno': metrics.mu,
      'E[S] giorni': metrics.E_S,
      'Cs2': metrics.Cs2
    });

    renderDl('rework-metrics', {
      'p1': metrics.rework && metrics.rework.p1,
      'E[K]': metrics.rework && metrics.rework.E_K,
      'lambda eff. / giorno': metrics.rework && metrics.rework.lambda_effective,
      'Wq rework giorni': metrics.rework && metrics.rework.Wq
    });

    renderQueueTable(metrics);
  }

  function renderDl(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    Object.keys(values).forEach(function(label) {
      root.insertAdjacentHTML('beforeend', '<dt>' + label + '</dt><dd>' + valueOrDash(values[label]) + '</dd>');
    });
  }

  function renderQueueTable(metrics) {
    var rows = [
      ['M/M/1', metrics.MM1],
      ['M/G/1', metrics.MG1],
      ['Rework', { Wq: metrics.rework && metrics.rework.Wq, W: null, Lq: null, L: null }]
    ];
    var html = '<thead><tr><th>Modello</th><th>Wq giorni</th><th>W giorni</th><th>Lq</th><th>L</th></tr></thead><tbody>';
    rows.forEach(function(row) {
      html += '<tr><th>' + row[0] + '</th><td>' + valueOrDash(row[1].Wq) + '</td><td>' + valueOrDash(row[1].W) + '</td><td>' + valueOrDash(row[1].Lq) + '</td><td>' + valueOrDash(row[1].L) + '</td></tr>';
    });
    document.getElementById('queue-table').innerHTML = html + '</tbody>';
  }

  function valueOrDash(value) {
    return value === null || value === undefined || value === '' ? '-' : value;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
    });
  }

  function showError(error) {
    alert(error.message || error);
  }
</script>
