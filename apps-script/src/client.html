<script>
  var state = {
    env: window.SIGMAFLOW_ENV === 'test' ? 'test' : 'prod',
    board: {},
    jobs: [],
    columnMeta: [],
    priorityClasses: {},
    options: { assignees: [], ambassadors: [], tags: [], sizes: ['XS', 'S', 'M', 'L', 'XL'] },
    filters: { assignees: {}, tags: {}, sizes: {}, priority: '' },
    activeJob: null,
    activeColumnId: null,
    columnSettings: null,
    sortModes: {},
    pendingWrites: 0,
    touchJobId: null,
    touchGhost: null,
    touchTimer: null,
    touchStart: null,
    suppressCardClick: false,
    metricsLoaded: false,
    archivioLoaded: false,
    cestinoLoaded: false
  };

  var defaultColumns = [
    { id: 'notes', status: 'notes', label: 'NOTE', role: 'neutral', color: '#E8E8E8', count: 0, points: 0 },
    { id: 'backlog', status: 'backlog', label: 'BACKLOG', role: 'backlog', color: '#C8D8E8', count: 0, points: 0 },
    { id: 'todo', status: 'todo', label: 'TO DO', role: 'wip', color: '#A8C4E0', count: 0, points: 0 },
    { id: 'wip', status: 'wip', label: 'WIP', role: 'wip', color: '#5B9BD5', count: 0, points: 0 },
    { id: 'wait_client', status: 'wait_client', label: 'ATTESA CLIENTE', role: 'stand_by', color: '#FFD966', count: 0, points: 0 },
    { id: 'wait_authority', status: 'wait_authority', label: 'ATTESA ENTI', role: 'stand_by', color: '#F4B942', count: 0, points: 0 },
    { id: 'wait_internal', status: 'wait_internal', label: 'ATTESA MT/GC', role: 'stand_by', color: '#E8A020', count: 0, points: 0 },
    { id: 'done', status: 'done', label: 'DA INVIARE / DA FATTURARE', role: 'done', color: '#70AD47', count: 0, points: 0 }
  ];

  var roleLabels = {
    backlog: 'Ingresso',
    wip: 'WIP',
    stand_by: 'Stand-by',
    done: 'Concluso',
    neutral: 'Neutra'
  };

  var sizePoints = { XS: 3, S: 5, M: 8, L: 13, XL: 20 };

  document.addEventListener('DOMContentLoaded', function() {
    bindEnvironmentBadge();
    bindNavigation();
    bindToolbar();
    bindModal();
    bindCestinoToolbar();
    loadBoard();
    bindVisibilityPolling_();
  });

  // Il polling a 45s serviva a tenere la board aggiornata anche a tab
  // in background, ma cosi' facendo continua a rileggere jobs+visite e
  // a ridisegnare anche quando nessuno la sta guardando: piu' sessioni
  // restano aperte in background, piu' cresce il carico sul backend
  // senza alcun beneficio reale. Sospeso quando la tab non e' visibile,
  // ripreso al ritorno in foreground con un refresh immediato (non solo
  // la ripartenza del timer, altrimenti si aspetterebbero altri 45s
  // prima di vedere dati aggiornati dopo un cambio tab).
  var boardPollTimer_ = null;

  function bindVisibilityPolling_() {
    startBoardPolling_();
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        loadBoard(false);
        startBoardPolling_();
      } else {
        stopBoardPolling_();
      }
    });
  }

  function startBoardPolling_() {
    if (boardPollTimer_ || document.visibilityState !== 'visible') {
      return;
    }
    boardPollTimer_ = window.setInterval(function() { loadBoard(false); }, 45000);
  }

  function stopBoardPolling_() {
    window.clearInterval(boardPollTimer_);
    boardPollTimer_ = null;
  }

  function callApi(action, payload) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success === false) {
            reject(new Error((response && response.error) || 'Errore sconosciuto'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(reject)
        .api(action, Object.assign({}, payload || {}, { env: state.env }));
    });
  }

  function bindEnvironmentBadge() {
    var badge = document.getElementById('environment-badge');
    if (!badge) {
      return;
    }
    badge.textContent = state.env === 'test' ? 'TEST' : 'PROD';
    badge.className = 'environment-badge environment-' + state.env;
    badge.title = state.env === 'test'
      ? 'Ambiente TEST: scrive su SigmaFlow Database - TEST'
      : 'Ambiente PROD: scrive sul database operativo';
  }

  function bindNavigation() {
    // Scoperto a .main-nav: i tab del modal card usano la stessa classe
    // .nav-button, e senza questo scope questo handler intercettava anche
    // i loro click, nascondendo view-board (e con esso il modal, che ci
    // vive dentro) ogni volta che si cliccava "Informazioni"/"Cronologia".
    document.querySelectorAll('.main-nav .nav-button').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelectorAll('.main-nav .nav-button').forEach(function(item) {
          item.classList.remove('active');
        });
        button.classList.add('active');
        var view = button.dataset.view;
        document.getElementById('view-board').hidden = view !== 'board';
        document.getElementById('view-dashboard').hidden = view !== 'dashboard';
        document.getElementById('view-archivio').hidden = view !== 'archivio';
        document.getElementById('view-cestino').hidden = view !== 'cestino';
        if (view === 'dashboard') {
          loadMetrics();
        } else if (view === 'archivio') {
          loadArchivio();
        } else if (view === 'cestino') {
          loadCestino();
        }
      });
    });
  }

  function bindToolbar() {
    var seedButton = document.getElementById('seed-test-data-button');
    if (seedButton && state.env === 'test') {
      seedButton.hidden = false;
      seedButton.addEventListener('click', function() {
        if (!confirm('Generare un nuovo dataset dimostrativo nel database TEST?')) { return; }
        callApi('seedTestData', { replace: true }).then(function(data) {
          showMessage('Creati ' + data.jobs + ' job TEST');
          loadBoard(true);
          loadMetrics(true);
        }).catch(showError);
      });
    }
    document.getElementById('add-column-button').addEventListener('click', function() {
      state.columnSettings = { status: '', label: '', color: '#E8E8E8', hidden: false };
      document.getElementById('column-settings-label').value = '';
      document.getElementById('column-settings-color').value = '#E8E8E8';
      document.getElementById('column-settings-role').value = 'neutral';
      document.getElementById('column-settings-visible').checked = true;
      document.getElementById('column-settings-aging-days').value = '';
      fillColumnPositionSelect('');
      document.getElementById('column-settings-modal').showModal();
    });

    document.getElementById('show-hidden-columns-button').addEventListener('click', function() {
      var hidden = getColumns().filter(function(column) { return column.hidden; });
      if (!hidden.length) {
        showMessage('Non ci sono colonne nascoste');
        return;
      }
      // Lasciato su loadBoard(true) apposta, a differenza di
      // saveColumnSettings/moveColumn qui sotto: piu' updateColumn in
      // PARALLELO sullo stesso columns_json rischiano di sovrascriversi
      // a vicenda lato server (letto-modificato-scritto, non atomico) —
      // fidarsi della risposta dell'ultima chiamata risolta potrebbe
      // riflettere uno stato intermedio perso. Un getBoard() dopo che
      // tutte sono finite rilegge lo stato vero, qualunque esso sia.
      Promise.all(hidden.map(function(column) {
        return callApi('updateColumn', { status: column.status, hidden: false });
      })).then(function() { loadBoard(true); }).catch(showError);
    });

    document.getElementById('manage-options-button').addEventListener('click', openOptionsManager);

    document.getElementById('reset-filters-button').addEventListener('click', function() {
      state.filters = { assignees: {}, tags: {}, sizes: {}, priority: '' };
      document.getElementById('filter-priority').value = '';
      renderToolbarFilters();
      renderBoard();
    });

    document.getElementById('filter-priority').addEventListener('change', function(event) {
      state.filters.priority = event.target.value;
      renderBoard();
    });

    document.getElementById('scroll-board-left').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: -560, behavior: 'smooth' });
    });
    document.getElementById('scroll-board-right').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: 560, behavior: 'smooth' });
    });
  }

  function bindModal() {
    var modal = document.getElementById('card-modal');
    modal.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      saveCardFromModal();
    });
    document.getElementById('modal-close-button').addEventListener('click', function() {
      modal.close();
      state.activeJob = null;
      state.activeColumnId = null;
      closeActivityForm_();
    });

    bindActivityForm_();

    ['modal-impact', 'modal-manageability'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', updateLivePriorityBadge);
    });

    document.getElementById('modal-create-button').addEventListener('click', saveCardFromModal);
    document.getElementById('modal-archive-button').addEventListener('click', archiveJobFromModal);
    document.querySelectorAll('.modal-tabs .nav-button').forEach(function(button) {
      button.addEventListener('click', function() { setModalTab_(button.dataset.modalTab); });
    });
    document.getElementById('modal-priority-class').addEventListener('change', updateLivePriorityBadge);
    document.getElementById('modal-assignee').addEventListener('change', handleEditableSelectChange);
    document.getElementById('modal-ambassador').addEventListener('change', handleEditableSelectChange);
    document.getElementById('modal-tag').addEventListener('change', handleEditableSelectChange);

    document.getElementById('column-settings-save').addEventListener('click', saveColumnSettings);
    document.getElementById('column-settings-cancel').addEventListener('click', function() {
      document.getElementById('column-settings-modal').close();
    });
    document.getElementById('options-manager-kind').addEventListener('change', renderOptionsManager);
    document.getElementById('options-manager-add').addEventListener('click', addManagedOption);
    document.getElementById('options-manager-close').addEventListener('click', function() {
      document.getElementById('options-manager-modal').close();
    });
  }

  function loadBoard(force) {
    if (!force && (state.pendingWrites > 0 || document.getElementById('card-modal').open)) {
      return;
    }
    callApi('getBoard').then(function(data) {
      var columns = data.columns || {};
      var jobs = data.jobs || [];
      var columnMeta = data.column_meta || defaultColumns;
      var priorityClasses = data.priority_classes || {};

      // M8 (DESIGN_dashboard.md, §4.2): il polling periodico (ogni 45s,
      // bindVisibilityPolling_) richiama loadBoard(false) anche quando
      // nulla e' cambiato sul server - ridisegnare comunque l'intera board
      // (svuota e ricostruisce tutto il DOM, renderBoard) ad ogni giro
      // costa quanto un caricamento completo, senza alcun beneficio
      // visibile quando i dati sono identici. Confronto testuale del solo
      // stato che guida il disegno (non l'intera risposta, che include
      // anche opzioni/metadati che non cambiano la resa): se identico al
      // giro precedente e non e' un refresh esplicito (force), si salta
      // solo il ridisegno - l'orario "Aggiornato alle" si aggiorna
      // comunque, il poll ha confermato che i dati sono aggiornati.
      var renderSnapshot = JSON.stringify({ columns: columns, jobs: jobs, columnMeta: columnMeta, priorityClasses: priorityClasses });
      var unchanged = !force && renderSnapshot === state.lastRenderSnapshot_;

      state.board = columns;
      state.jobs = jobs;
      state.columnMeta = columnMeta;
      state.priorityClasses = priorityClasses;
      state.options = data.options || state.options;

      if (!unchanged) {
        state.lastRenderSnapshot_ = renderSnapshot;
        renderToolbarFilters();
        renderBoard();
      }
      updateLastUpdated();
    }).catch(showError);
  }

  function updateLastUpdated() {
    var el = document.getElementById('last-updated');
    var now = new Date();
    el.textContent = 'Aggiornato alle ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function renderToolbarFilters() {
    renderFilterPills('assignee-filter-pills', state.options.assignees || [], 'assignees', initialsFor);
    renderFilterPills('tag-filter-pills', state.options.tags || [], 'tags', function(value) { return value; });
    renderSizePills();
    renderPrioritySelect(document.getElementById('filter-priority'), true);
    fillDatalist('assignee-options', state.options.assignees || []);
    fillDatalist('tag-options', state.options.tags || []);
  }

  function renderFilterPills(id, values, filterKey, labelFn) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'filter-pill' + (state.filters[filterKey][value.toLowerCase()] ? ' active' : '');
      button.textContent = labelFn(value);
      button.title = value;
      button.addEventListener('click', function() {
        toggleFilter(filterKey, value);
      });
      root.appendChild(button);
    });
  }

  function renderSizePills() {
    document.querySelectorAll('#size-filter-pills .filter-pill').forEach(function(button) {
      var value = button.dataset.value.toLowerCase();
      button.classList.toggle('active', Boolean(state.filters.sizes[value]));
      button.onclick = function() {
        toggleFilter('sizes', button.dataset.value);
      };
    });
  }

  function toggleFilter(filterKey, value) {
    var normalized = String(value || '').toLowerCase();
    if (state.filters[filterKey][normalized]) {
      delete state.filters[filterKey][normalized];
    } else {
      state.filters[filterKey][normalized] = true;
    }
    renderToolbarFilters();
    renderBoard();
  }

  function fillDatalist(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      root.appendChild(option);
    });
  }

  function renderBoard() {
    var root = document.getElementById('kanban-board');
    root.innerHTML = '';
    var boardFragment = document.createDocumentFragment();

    getColumns().filter(function(column) {
      return !column.hidden;
    }).forEach(function(column, index, visibleColumns) {
      var jobs = (state.board[column.status] || []);
      jobs = sortJobsForColumn(jobs.slice(), column.status);
      var agingCount = countAgingInColumn_(jobs, column);
      var columnEl = document.createElement('section');
      columnEl.className = 'column role-' + (column.role || 'neutral');
      columnEl.style.setProperty('--column-color', column.color || '#E8E8E8');
      columnEl.dataset.status = column.status;
      columnEl.innerHTML = [
        '<div class="column-color-bar"></div>',
        '<div class="column-header">',
        '<div class="column-summary-row">',
        '<span class="column-badge count-badge"></span>',
        '<h2 class="column-title"></h2>',
        '<span class="column-badge points-badge"></span>',
        '</div>',
        '<div class="column-header-actions">',
        '<button type="button" class="move-column-left" title="Sposta colonna a sinistra">&lt;</button>',
        '<button type="button" class="move-column-right" title="Sposta colonna a destra">&gt;</button>',
        '<button type="button" class="sort-priority-button" title="Ordina per priorita">P</button>',
        '<button type="button" class="sort-date-button" title="Ordina per scadenza">D</button>',
        '<button type="button" class="column-menu-button" title="Impostazioni colonna">...</button>',
        '<button type="button" class="open-composer-button" title="Aggiungi card" aria-label="Aggiungi card">+</button>',
        '</div>',
        '<span class="column-badge stale-badge" hidden></span>',
        '</div>',
        '<div class="cards"></div>'
      ].join('');

      columnEl.querySelector('.column-title').textContent = column.label;
      columnEl.querySelector('.count-badge').textContent = jobs.length + ' card';
      columnEl.querySelector('.points-badge').textContent = sumPoints(jobs) + ' pt';
      if (agingCount > 0) {
        var staleBadge = columnEl.querySelector('.stale-badge');
        staleBadge.hidden = false;
        staleBadge.textContent = agingCount + ' >' + column.aging_days + 'g';
      }
      columnEl.querySelector('.column-menu-button').addEventListener('click', function() {
        openColumnMenu(column);
      });
      columnEl.querySelector('.move-column-left').disabled = index === 0;
      columnEl.querySelector('.move-column-right').disabled = index === visibleColumns.length - 1;
      columnEl.querySelector('.move-column-left').addEventListener('click', function() {
        moveColumn(column.status, 'left');
      });
      columnEl.querySelector('.move-column-right').addEventListener('click', function() {
        moveColumn(column.status, 'right');
      });
      columnEl.querySelector('.sort-priority-button').classList.toggle('active', state.sortModes[column.status] === 'priority');
      columnEl.querySelector('.sort-date-button').classList.toggle('active', state.sortModes[column.status] === 'date');
      columnEl.querySelector('.sort-priority-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'priority');
      });
      columnEl.querySelector('.sort-date-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'date');
      });

      bindDropTarget(columnEl, column.status);
      var cardsFragment = document.createDocumentFragment();
      jobs.filter(matchesFilters).forEach(function(job) {
        cardsFragment.appendChild(renderCard(job, column));
      });
      columnEl.querySelector('.cards').appendChild(cardsFragment);
      columnEl.querySelector('.open-composer-button').addEventListener('click', function() {
        openNewJobModal(column.status);
      });
      boardFragment.appendChild(columnEl);
    });
    root.appendChild(boardFragment);
  }

  function renderCard(job, column) {
    var card = document.createElement('article');
    var isLate = job.due_date && new Date(job.due_date + 'T23:59:59') < new Date();
    var isAging = isJobAging_(job, column);
    card.className = 'card' + (isAging ? ' stale-card' : '');
    if (job.card_color) {
      card.classList.add('custom-card-color');
      card.style.setProperty('--card-color', job.card_color);
    }
    card.draggable = true;
    card.dataset.jobId = job.job_id;
    card.innerHTML = [
      '<div class="card-client"></div>',
      '<div class="card-title"></div>',
      '<div class="badges">',
      priorityBadgeHtml(job.priority_class),
      '<span class="badge">' + escapeHtml((job.size_class || 'M') + ' - ' + (job.size_points || sizePoints[job.size_class] || 8) + ' pt') + '</span>',
      '<span class="badge">' + escapeHtml(job.tag || 'senza tag') + '</span>',
      '</div>',
      '<div class="card-footer">',
      '<span class="avatar" title="' + escapeHtml(job.assignee || 'Non assegnato') + '">' + escapeHtml(initialsFor(job.assignee || '')) + '</span>',
      job.ambassador ? '<span class="ambassador" title="Ambasciatore: ' + escapeHtml(job.ambassador) + '">A ' + escapeHtml(initialsFor(job.ambassador)) + '</span>' : '',
      '<span class="due-date' + (isLate ? ' late' : '') + '">' + escapeHtml(formatItalianDate(job.due_date)) + '</span>',
      Number(job.visit_number || 1) > 1 ? '<span class="badge rework">R' + escapeHtml(Number(job.visit_number) - 1) + '</span>' : '',
      job.description ? '<span class="description-icon" title="Descrizione presente">note</span>' : '',
      '</div>',
      '<div class="card-actions">',
      '<button type="button" class="delete-card-button" title="Sposta nel cestino" aria-label="Sposta nel cestino">x</button>',
      '</div>'
    ].join('');
    card.querySelector('.card-title').textContent = job.title || '(senza titolo)';
    card.querySelector('.card-client').textContent = job.client || '';
    card.title = isAging ? 'Fermo da ' + daysSince(job.status_since_ts) + ' giorni' : '';

    card.addEventListener('dragstart', function(event) {
      event.dataTransfer.setData('text/plain', job.job_id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });
    card.addEventListener('touchstart', function(event) {
      startTouchDrag(event, job, card);
    }, { passive: true });
    card.addEventListener('touchmove', moveTouchDrag, { passive: false });
    card.addEventListener('touchend', endTouchDrag);
    card.addEventListener('click', function(event) {
      if (state.suppressCardClick || event.target.closest('button')) {
        return;
      }
      openCardModal(job);
    });
    card.querySelector('.delete-card-button').addEventListener('click', function(event) {
      event.stopPropagation();
      deleteJob(job);
    });
    return card;
  }

  // M0-B: aggiornamento incrementale del DOM per le operazioni che
  // riguardano UN SOLO job (spostamento, salvataggio, eliminazione,
  // aggiunta) — tocca solo il nodo della card interessata e i badge
  // della sua colonna, mai le altre colonne/card. Riusa renderCard (la
  // stessa funzione del redraw completo, nessuna logica duplicata) per
  // costruire il nodo, cosi' listener/marcatura restano identici.
  // Il redraw completo (renderBoard) resta l'unica via per: cambio
  // filtro, colonne (aggiunta/riordino/rimozione), caricamento
  // iniziale/poll, rollback dopo errore — vedi ricognizione in cima al
  // file per l'elenco completo dei chiamanti.

  function findColumnMeta_(status) {
    return getColumns().filter(function(column) { return column.status === status; })[0] || null;
  }

  function findColumnEl_(status) {
    return document.querySelector('#kanban-board .column[data-status="' + status + '"]');
  }

  // Ricalcola conteggio/punti/badge "fermo da" di UNA colonna dal solo
  // state.board locale, senza toccare le card gia' renderizzate al suo
  // interno. Se la colonna non e' (ancora) nel DOM — nascosta, o
  // nessuna board caricata — non fa nulla: il prossimo renderBoard()
  // completo la riallineera' comunque.
  function updateColumnCounters_(status) {
    var columnEl = findColumnEl_(status);
    var column = findColumnMeta_(status);
    if (!columnEl || !column) { return; }
    var jobs = sortJobsForColumn((state.board[status] || []).slice(), status);
    var agingCount = countAgingInColumn_(jobs, column);
    columnEl.querySelector('.count-badge').textContent = jobs.length + ' card';
    columnEl.querySelector('.points-badge').textContent = sumPoints(jobs) + ' pt';
    var staleBadge = columnEl.querySelector('.stale-badge');
    staleBadge.hidden = agingCount <= 0;
    if (agingCount > 0) {
      staleBadge.textContent = agingCount + ' >' + column.aging_days + 'g';
    }
  }

  // Rimuove (se presente) e reinserisce il nodo della card nella sua
  // colonna corrente (job.status), nella posizione corretta per
  // l'ordinamento/i filtri attivi — senza spostare le altre card gia'
  // presenti. Se dopo i filtri la card non deve comparire, resta
  // rimossa (stesso comportamento del redraw completo, che la esclude
  // in partenza).
  function placeCardInColumn_(job) {
    var column = findColumnMeta_(job.status);
    var columnEl = findColumnEl_(job.status);
    if (!column || !columnEl || column.hidden) { return; }
    var cardsRoot = columnEl.querySelector('.cards');
    var existing = cardsRoot.querySelector('.card[data-job-id="' + job.job_id + '"]');
    if (existing) { existing.remove(); }
    if (!matchesFilters(job)) { return; }
    var sortedFiltered = sortJobsForColumn((state.board[job.status] || []).slice(), job.status).filter(matchesFilters);
    var index = sortedFiltered.findIndex(function(item) { return item.job_id === job.job_id; });
    var referenceNode = index >= 0 ? cardsRoot.children[index] : null;
    cardsRoot.insertBefore(renderCard(job, column), referenceNode || null);
  }

  // Rimuove il nodo della card da qualunque colonna si trovi oggi nel
  // DOM (il chiamante puo' non conoscere la colonna, es. dopo una
  // eliminazione con stato locale gia' aggiornato).
  function removeCardEl_(jobId) {
    var existing = document.querySelector('#kanban-board .cards .card[data-job-id="' + jobId + '"]');
    if (existing) { existing.remove(); }
  }

  function priorityBadgeHtml(priorityClass) {
    var key = priorityClass || 'p4_assess';
    var meta = state.priorityClasses[key] || { label: key || 'Priorita', color: '#CCCCCC' };
    return '<span class="priority-badge" style="background:' + escapeHtml(meta.color || '#CCCCCC') + '">' + escapeHtml(meta.label || key) + '</span>';
  }

  function fillSelect(select, values, emptyLabel) {
    select.innerHTML = '<option value="">' + emptyLabel + '</option>';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  function bindDropTarget(columnEl, status) {
    columnEl.addEventListener('dragover', function(event) {
      event.preventDefault();
    });
    columnEl.addEventListener('drop', function(event) {
      event.preventDefault();
      columnEl.classList.remove('drop-target');

  function saveCardFromModal() {
    var saveButton = document.getElementById('modal-create-button');
    if (saveButton.disabled) { return; }
    var title = document.getElementById('modal-title').value.trim();
    if (!title) {
      showError(new Error('Inserisci il titolo del job'));
      return;
    }
    var payload = modalPayload_();
    payload.title = title;
    state.pendingWrites++;
    saveButton.disabled = true;
    saveButton.textContent = 'Salvataggio...';
    var editing = Boolean(state.activeJob);
    prepareCustomOptions_(payload).then(function(prepared) {
      if (editing) {
        prepared.job_id = state.activeJob.job_id;
        return callApi('updateJob', prepared);
      }
      prepared.status = state.activeColumnId;
      return callApi('addJob', prepared);
    }).then(function(data) {
      var savedJob = data.job;
      if (savedJob) {
        updateOptionsFromJob(savedJob);
        if (editing) {
          mergeJobIntoState(savedJob);
        } else {
          addJobIntoState(savedJob);
        }
        // M0-B: solo il nodo di questa card + i badge della sua
        // colonna (stessa colonna in modifica, nuova in creazione),
        // non l'intera board.
        placeCardInColumn_(savedJob);
        updateColumnCounters_(savedJob.status);
      }
      document.getElementById('card-modal').close();
      state.activeJob = null;
      state.activeColumnId = null;
      renderToolbarFilters();
      updateLastUpdated();
    }).catch(showError).finally(function() {
      state.pendingWrites--;
      saveButton.disabled = false;
      saveButton.textContent = state.activeJob ? 'Salva e chiudi' : 'Crea e chiudi';
    });
  }

  function modalPayload_() {
    return {
      client: document.getElementById('modal-client').value,
      description: document.getElementById('modal-description').value,
      assignee: document.getElementById('modal-assignee').value,
      ambassador: document.getElementById('modal-ambassador').value,
      tag: document.getElementById('modal-tag').value,
      size_class: document.getElementById('modal-size').value,
      impact: document.getElementById('modal-impact').value,
      manageability: document.getElementById('modal-manageability').value,
      priority_class: document.getElementById('modal-priority-class').value,
      due_date: document.getElementById('modal-due-date').value,
      invoiced: document.getElementById('modal-invoiced').checked,
      card_color: document.getElementById('modal-card-color').value
    };
  }

  function prepareCustomOptions_(payload) {
    return Promise.resolve().then(function() {
      var requests = [];
      [['assignee', 'assignees'], ['ambassador', 'ambassadors'], ['tag', 'tags']].forEach(function(pair) {
        var field = pair[0];
        var selected = document.getElementById('modal-' + field).value;
        if (selected === '__add__' || selected === 'Altro') {
          var custom = document.getElementById('modal-' + field + '-custom').value.trim();
          if (!custom) { throw new Error('Inserisci il nuovo valore per ' + field); }
          payload[field] = custom;
          requests.push(callApi('updateOptionList', { kind: pair[1], operation: 'add', value: custom }));
        }
      });
      return Promise.all(requests).then(function() { return payload; });
    });
  }

  function updateLivePriorityBadge() {
    var impact = Number(document.getElementById('modal-impact').value || 0);
    var manageability = Number(document.getElementById('modal-manageability').value || 0);
    var score = impact && manageability ? Math.round(Math.sqrt(impact * manageability) * 100) / 100 : 0;
    var automaticPriority = suggestPriorityClassClient(score);
    var priority = document.getElementById('modal-priority-class').value || automaticPriority;
    var meta = state.priorityClasses[priority] || {};
    var automaticMeta = state.priorityClasses[automaticPriority] || {};
    var badge = document.getElementById('modal-priority-badge');
    badge.textContent = (meta.label || priority || '-') + ' - ' + score;
    badge.style.background = meta.color || '#CCCCCC';
    document.getElementById('modal-impact-value').textContent = impact;
    document.getElementById('modal-manageability-value').textContent = manageability;
    var automaticOption = document.querySelector('#modal-priority-class option[value=""]');
    if (automaticOption) {
      automaticOption.textContent = 'Automatico - ' + (automaticMeta.label || automaticPriority || '-');
    }
  }
