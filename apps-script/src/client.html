    document.getElementById('flow-added-cards').textContent = valueOrDash(points.added_cards);
    document.getElementById('flow-added-points').textContent = metricValue(points.added_points, ' pt');
    // R9.2: l'header di colonna dichiara gia' l'unita' ("Lavori/settimana"/
    // "Punti/settimana") - il valore di cella non la ripete.
    document.getElementById('flow-added-rate').textContent = perWeekFromWindowTotal_(points.added_cards, flow.window_days, '');
    document.getElementById('flow-added-points-rate').textContent = perWeekFromWindowTotal_(points.added_points, flow.window_days, '');
    // R6.6, completamento (addendum di collaudo): "Lavori completati"
    // deve leggere flow.completed_initiatives (stessa popolazione -
    // job distinti sulle visite con visitServiceTimeDays_ > 0 - di
    // flow.completed_passages), non piu' points.completed_cards
    // (pipeline diversa, via job.done_ts, nessun filtro sulla durata).
    // I due numeri non sono piu' garantiti coincidere per costruzione.
    document.getElementById('flow-completed-cards').textContent = valueOrDash(flow.completed_initiatives);
    document.getElementById('flow-completed-points').textContent = metricValue(points.completed_points, ' pt');
    document.getElementById('flow-completed-rate').textContent = perWeekValue(flow.completed_per_day, '');
    document.getElementById('flow-completed-points-rate').textContent = perWeekFromWindowTotal_(points.completed_points, flow.window_days, '');
    document.getElementById('flow-window-days').textContent = valueOrDash(flow.window_days);

    // Chiesto da Marco (2026-08-20): "passaggi" non e' un termine
    // chiaro - una visita e' l'unita' reale che il team lavora (un
    // caso con rientri ne genera piu' d'una), "iniziativa"/"punti"
    // sono l'unita' del caso. Rinominato in "visite" ovunque, sempre
    // con l'equivalente stimato in punti (fattore di conversione
    // avg_points_per_initiative, dimensione media dei casi arrivati
    // nel periodo) quando possibile.
    var avgPoints = flow.avg_points_per_initiative;
    // R6.2 (addendum di collaudo): etichetta con team_size esplicito -
    // verificato (PROGRAMMA_STATO.md) che non c'e' nessun disallineamento
    // reale tra questa capacita' e mu*team_size, solo un artefatto di
    // arrotondamento a 2 decimali sui tassi giornalieri prima della
    // conversione settimanale - nessuna formula cambiata.
    var flowExtraDl = {};
    flowExtraDl['Capacita\' disponibile stimata (team, ' + valueOrDash(flow.team_size) + ' persone)'] = perWeekValue(flow.estimated_capacity_per_day, ' passaggi/settimana') + estimatedPointsSuffix_(flow.estimated_capacity_per_day, avgPoints);
    flowExtraDl['Differenza tra entrate e uscite (lavori/settimana)'] = perWeekValue(flow.entry_exit_difference, '/settimana');
    // R6.6, completamento: entrambe le occorrenze di "Lavori completati"
    // leggono flow.completed_initiatives, non points.completed_cards
    // (pipeline sbagliata - vedi sopra).
    flowExtraDl['Lavori completati (periodo)'] = valueOrDash(flow.completed_initiatives);
    flowExtraDl['Passaggi completati (periodo)'] = valueOrDash(flow.completed_passages);
    renderDl('flow-extra-metrics', flowExtraDl);

    var rework = system.reworkMetrics || {};
    // R4 (DESIGN_R_S.md §3.4): scomposizione dei rientri per causa
    // (rework_cause) - quota controllabile (cliente + interno, leva:
    // gating) vs non controllabile (enti).
    var byCause = rework.by_cause || {};
    // R6.3 (addendum di collaudo): il carico va sempre mostrato nel suo
    // contesto - lavoro nuovo e rilavorazione fianco a fianco piu' il
    // totale, mai la rilavorazione isolata.
    renderDl('system-load-metrics', {
      'Carico da lavoro nuovo (a settimana)': perWeekValue(flow.new_work_per_day, ' passaggi/settimana'),
      'Carico da rilavorazione (a settimana)': perWeekValue(rework.additional_passages_from_rework, ' passaggi/settimana'),
      'Carico totale (a settimana)': perWeekValue(rework.total_passages_per_day, ' passaggi/settimana'),
      'Quota di capacita\' occupata dal carico totale': nullablePercent(system.capacityMetrics.effective_load, true)
    });
    // R9.6: "Passaggi totali alla settimana"/"Carico aggiuntivo dalla
    // rilavorazione" rimossi da qui - stesso identico numero gia'
    // mostrato sopra in system-load-metrics ("Carico totale"/"Carico
    // da rilavorazione"), verificato essere lo stesso calcolo
    // (rework.total_passages_per_day/additional_passages_from_rework).
    // R9.8: le rilavorazioni per causa hanno ora un'etichetta propria
    // ciascuna, non una terna posizionale "X / Y / Z".
    var reworkDl = {
      'Lavori che hanno richiesto una rilavorazione': nullablePercent(rework.initiatives_with_rework, true),
      'Rilavorazioni medie quando capitano': estimableValue(rework.average_reentries_when_reworked),
      'Passaggi medi per lavoro': metricValue(rework.average_passages_per_initiative)
    };
    if (byCause.total) {
      reworkDl['Rilavorazioni da cliente'] = valueOrDash(byCause.client);
      reworkDl['Rilavorazioni da enti'] = valueOrDash(byCause.authority);
      reworkDl['Rilavorazioni da decisione interna'] = valueOrDash(byCause.internal);
      reworkDl['Quota controllabile (cliente + interno, leva: gating)'] = nullablePercent(byCause.controllable_share, true);
      reworkDl['Quota di rilavorazioni da enti (non controllabile direttamente)'] = nullablePercent(byCause.external_share, true);
    } else {
      reworkDl['Rilavorazioni per causa'] = 'Dato non ancora stimabile';
    }
    renderDl('system-rework-metrics', reworkDl);

    var time = system.timeMetrics || {};
    renderDl('time-metrics', {
      'Tempo medio di lavorazione': estimableValue(time.average_service_days, ' giorni'),
      // R9.7: il numero (Cv^2) che determina l'etichetta categorica va
      // mostrato nello stesso pannello, non solo nel Quadro avanzato.
      'Variabilita dei tempi': (time.variability_level || 'Dato non ancora stimabile') + (time.variability !== null && time.variability !== undefined ? ' (Cv² = ' + metricValue(time.variability) + ')' : ''),
      'Tempo alto osservato': estimableValue(time.high_observed_days, ' giorni'),
      'Tempo prudenziale consigliato': estimableValue(time.prudent_service_days, ' giorni'),
      'Attesa stimata': estimableValue(time.estimated_wait_days, ' giorni'),
      'Tempo totale stimato': estimableValue(time.estimated_total_days, ' giorni')
    });
    document.getElementById('time-message').textContent = (time.variability_message || '') + ' ' + (time.waiting_message || '');

    // Chiesto da Marco (2026-08-20, punto 3): anche il lavoro presente
    // sempre in punti oltre che in card - workloadMetrics ora porta
    // anche i campi _points (Model.gs, currentWorkload_).
    // R7: "Lavoro presente" (stadi 1-5, mescolava lavoro impegnato e da
    // fatturare) - spaccato in due dl distinti, mai sommati nella
    // stessa card (to-invoice-metrics sotto).
    var workload = system.workloadMetrics || {};
    function cardsAndPoints_(count, points) {
      return valueOrDash(count) + ' (' + metricValue(points, ' pt') + ')';
    }
    // R9.8: le tre righe di attesa per tipo sono componenti di "Lavoro
    // in attesa (totale)" - etichetta rientrata (classe CSS) per
    // segnalarle come sottototale, non otto voci indipendenti sullo
    // stesso piano.
    renderDl('workload-metrics', {
      'Lavoro pronto': cardsAndPoints_(workload.ready, workload.ready_points),
      'In preparazione': cardsAndPoints_(workload.preparing, workload.preparing_points),
      'Lavoro in corso': cardsAndPoints_(workload.in_progress, workload.in_progress_points),
      'Lavoro in attesa (totale)': cardsAndPoints_(workload.blocked, workload.blocked_points),
      'In attesa di cliente': cardsAndPoints_(workload.waiting_client, workload.waiting_client_points),
      'In attesa di enti': cardsAndPoints_(workload.waiting_authority, workload.waiting_authority_points),
      'Fermi per decisione interna': cardsAndPoints_(workload.waiting_internal, workload.waiting_internal_points)
    }, {
      'In attesa di cliente': 'dl-subitem',
      'In attesa di enti': 'dl-subitem',
      'Fermi per decisione interna': 'dl-subitem'
    });
    renderDl('to-invoice-metrics', {
      'Concluso, non ancora fatturato': cardsAndPoints_(workload.can_return, workload.can_return_points)
    });

    var capacity = system.capacityMetrics || {};
    // Chiesto da Marco (2026-08-20): tolta la riga "Capacita teorica
    // giornaliera" quando non configurata (theoretical_capacity_per_day
    // in config) - non aggiungeva informazione, solo rumore.
    // R6.1 (addendum di collaudo): "visite" -> "passaggi" nel glossario
    // ufficiale del cruscotto.
    var capacityDl = {
      'Capacita\' effettiva alla settimana': perWeekValue(capacity.effective_per_day, ' passaggi/settimana') + estimatedPointsSuffix_(capacity.effective_per_day, avgPoints)
    };
    if (capacity.theoretical_per_day !== null) {
      capacityDl['Capacita\' teorica alla settimana'] = perWeekValue(capacity.theoretical_per_day, ' passaggi/settimana') + estimatedPointsSuffix_(capacity.theoretical_per_day, avgPoints);
    }
    capacityDl['Assorbita dai nuovi lavori (alla settimana)'] = perWeekValue(capacity.absorbed_by_new_work, ' passaggi/settimana') + estimatedPointsSuffix_(capacity.absorbed_by_new_work, avgPoints);
    capacityDl['Assorbita dalla rilavorazione (alla settimana)'] = perWeekValue(capacity.absorbed_by_rework, ' passaggi/settimana') + estimatedPointsSuffix_(capacity.absorbed_by_rework, avgPoints);
    capacityDl['Margine residuo (alla settimana)'] = perWeekValue(capacity.residual_per_day, ' passaggi/settimana') + estimatedPointsSuffix_(capacity.residual_per_day, avgPoints);
    // R9.6: "Margine disponibile" (= 1 - carico effettivo) rimosso da
    // qui - stesso fatto gia' mostrato in Vista rapida e come "Quota di
    // capacita' occupata dal carico totale" nel pannello Rilavorazione.
    renderDl('capacity-metrics', capacityDl);

    // R9.6: "Margine rispetto alla saturazione" (= 1 - carico effettivo,
    // stesso numero di "Quota di capacita' occupata dal carico totale"
    // nel pannello Rilavorazione e del numero di Vista rapida) rimosso
    // da qui - resta solo un rimando testuale (vedi anche la nota di
    // pannello in dashboard.html).
    var stability = system.stabilityMetrics || null;
    var stabilityStateLabels = { stable: 'STABILE', stressed: 'SOTTO PRESSIONE', critical: 'CRITICO', unstable: 'INSTABILE' };
    renderDl('stability-metrics', {
      'Fattore di congestione': stability && stability.congestion_factor !== null ? metricValue(stability.congestion_factor) : 'Dato non ancora stimabile',
      'Fattore di variabilita\'': stability ? metricValue(stability.variability_factor) : 'Dato non ancora stimabile',
      'Stato': stability ? (stabilityStateLabels[stability.system_state] || stability.system_state) : 'Dato non ancora stimabile'
    });

    // M5, chiesto da Marco (2026-08-20, punto 4): non solo il totale
    // complessivo, anche occorrenze/media/min/max per tipo - la nuova
    // forma di waitTimeMetrics (Model.gs, waitStats_) porta gia' tutto.
    var waitTime = system.waitTimeMetrics || {};
    renderWaitStatsRow_('wait-client', waitTime.client);
    renderWaitStatsRow_('wait-authority', waitTime.authority);
    renderWaitStatsRow_('wait-internal', waitTime.internal);
    renderWaitStatsRow_('wait-summary', waitTime.summary);

    renderCurrentlyBlocked_(system.currentlyBlocked || []);
    drawWaitTimeTrend_(system.waitTimeTrend || []);

    var latentBacklog = system.latentBacklogMetrics || {};
    renderDl('latent-backlog-metrics', {
      'Periodo analizzato': metricValue(latentBacklog.window_days, ' giorni'),
      'Consegne non ancora chiuse': valueOrDash(latentBacklog.count)
    });

    renderDelayProfile(system.delayProfileMetrics || {});
    renderAdvancedMetrics(metrics);
    var flowWeeklyBuckets = system.flowWeeklyBuckets || [];
    document.getElementById('wip-trend-weeks-note').textContent = flowWeeklyBuckets.length ? (flowWeeklyBuckets.length + ' settimane') : 'dato non ancora disponibile';
    drawWipBandsCharts_(flowWeeklyBuckets, system.wipBands || []);

    renderScenarios(system.scenarioReadiness || {});
    // R9.5: gauge-load/gauge-capacity rimossi (potevano superare il
    // 100% o essere negativi) - sostituiti dal numero di Vista rapida
    // (renderLoadIndicator_, sopra). gauge-rework resta: e' genuinamente
    // 0-100%, un arco lo rappresenta correttamente.
    renderGauge('gauge-rework', system.reworkMetrics.initiatives_with_rework, 0.5, true);
    renderPointsMetrics(system.pointsMetrics || {});
  }

  function renderGauge(id, value, scaleMax, dangerWhenHigh) {
    var root = document.getElementById(id);
    var label = root.querySelector('span');
    if (value === null || value === undefined || value === '') {
      root.className = 'gauge gauge-unknown';
      root.style.removeProperty('--gauge-value');
      label.textContent = 'Dato non stimabile';
      return;
    }
    var ratio = Math.max(0, Math.min(1, Number(value) / scaleMax));
    var risk = dangerWhenHigh ? ratio : 1 - ratio;
    var tone = risk < 0.70 ? 'stable' : (risk < 0.85 ? 'attention' : 'critical');
    root.className = 'gauge gauge-' + tone;
    root.style.setProperty('--gauge-value', Math.round(ratio * 100) + '%');
    label.textContent = Math.round(Number(value) * 100) + '%';
  }

  // R9.5 (addendum di collaudo): sostituisce i gauge ad arco per
  // grandezze che possono superare il 100% o essere negative (carico
  // effettivo puo' arrivare oltre il 100% quando il sistema e'
  // sovraccarico - un arco non lo rappresenta, si blocca visivamente al
  // massimo). Numero grande + colore di direzione, nessuna scala fissa.
  function renderLoadIndicator_(id, value) {
    var el = document.getElementById(id);
    if (value === null || value === undefined || value === '') {
      el.textContent = 'Dato non stimabile';
      el.className = 'load-value load-unknown';
      return;
    }
    var pct = Math.round(Number(value) * 100);
    el.textContent = pct + '%';
    el.className = 'load-value ' + (pct < 70 ? 'load-stable' : pct < 100 ? 'load-attention' : 'load-critical');
  }

  // M9 (DESIGN_dashboard.md, §4.2): 'metrics' e' l'oggetto completo
  // restituito da getMetrics - a differenza di tutto il resto di
  // renderMetrics, che legge solo metrics.systemState, qui si leggono i
  // campi top-level (lambda/mu/rho/MM1/MG1/rework/Cs2/E_S0/E_S1) gia'
  // calcolati da calculateMetrics_ ma mai renderizzati prima di M9
  // (verificato in M3).
  function renderAdvancedMetrics(metrics) {
    // R6.4 (addendum di collaudo): stessa idea del pannello principale,
    // ricalcolata per singolo passaggio invece che per lavoro -
    // popolazione/unita' dichiarate in ogni etichetta, non piu' lasciate
    // indovinare.
    // R9.13: enfasi tipografica per i valori fuori dalla scala 0-100%
    // (rho puo' superare 1 quando il sistema e' sovraccarico) - stesso
    // principio di R9.5 ma per il testo, non per i gauge.
    var rhoLabel = 'Utilizzo (rho)';
    var advancedBaseDl = {
      'Passaggi osservati nel periodo': valueOrDash(metrics.n_jobs_observed),
      'Tasso di arrivo (lambda)': perWeekValue(metrics.lambda, ' passaggi/settimana'),
      'Tasso di servizio per persona (mu)': perWeekValue(metrics.mu, ' passaggi/settimana/operatore')
    };
    advancedBaseDl[rhoLabel] = nullablePercent(metrics.rho, true);
    advancedBaseDl['Tempo medio per passaggio (E[S])'] = estimableValue(metrics.E_S, ' giorni');
    advancedBaseDl['Variabilita\' del servizio (Cv^2)'] = estimableValue(metrics.Cs2);
    advancedBaseDl['Tempo medio primo passaggio (E[S0])'] = estimableValue(metrics.E_S0, ' giorni');
    advancedBaseDl['Tempo medio passaggio di rilavorazione (E[S1])'] = estimableValue(metrics.E_S1, ' giorni');
    renderDl('advanced-base-metrics', advancedBaseDl, outOfScaleClasses_(rhoLabel, metrics.rho));

    // R9.10: se tutti i campi sono "Dato non ancora stimabile", una riga
    // sola invece di 4 ripetute.
    renderQueueMetrics_('advanced-mm1-metrics', metrics.MM1 || {});
    renderQueueMetrics_('advanced-mg1-metrics', metrics.MG1 || {});

    // R3 (DESIGN_R_S.md §3.3)/R6.4 (addendum): questo blocco e' tutto
    // calcolato PER PASSAGGIO (reworkMetrics_, Model.gs), non per lavoro
    // come il pannello principale "Rilavorazione" (reworkShare di
    // buildSystemState_) - le etichette lo dicono esplicitamente per non
    // farle sembrare la stessa grandezza con un numero diverso. E[K] e'
    // stato riscritto da zero (la versione precedente era contraddittoria:
    // "per iniziativa" e "per visita" nella stessa frase).
    var rhoEffLabel = 'Utilizzo effettivo, con rilavorazioni (rho effettivo)';
    var rework = metrics.rework || {};
    var reworkAdvDl = {
      'Quota di passaggi rilavorati (p1)': nullablePercent(rework.p1, true),
      'Rilavorazioni medie per passaggio (r)': estimableValue(rework.r),
      'Passaggi attesi per lavoro (E[K])': estimableValue(rework.E_K),
      'Tasso di arrivo effettivo, con rilavorazioni (lambda effettivo)': perWeekValue(rework.lambda_effective, ' passaggi/settimana')
    };
    reworkAdvDl[rhoEffLabel] = nullablePercent(rework.rho_effective, true);
    renderDl('advanced-rework-metrics', reworkAdvDl, outOfScaleClasses_(rhoEffLabel, rework.rho_effective));
  }

  // R9.13: restituisce { label: 'value-out-of-scale' } quando value e'
  // fuori dall'intervallo 0-1 (rho puo' superare 1 o, in casi degeneri,
  // essere negativo) - da passare come terzo parametro a renderDl.
  function outOfScaleClasses_(label, value) {
    if (value === null || value === undefined) { return null; }
    if (Number(value) > 1 || Number(value) < 0) {
      var classes = {};
      classes[label] = 'value-out-of-scale';
      return classes;
    }
    return null;
  }

  // R9.10: Coda M/M/1 e M/G/1 quando il sistema e' instabile (rho >= 1)
  // mostrano 4 righe tutte "Dato non ancora stimabile" - una riga sola
  // col messaggio e' piu' leggibile di 4 ripetute.
  function renderQueueMetrics_(id, queue) {
    var allNull = queue.Wq === null && queue.W === null && queue.Lq === null && queue.L === null;
    if (allNull) {
      renderDl(id, { 'Coda': 'Dato non ancora stimabile (sistema instabile o dati insufficienti)' });
      return;
    }
    renderDl(id, {
      'Attesa in coda (Wq)': estimableValue(queue.Wq, ' giorni'),
      'Tempo totale nel sistema (W)': estimableValue(queue.W, ' giorni'),
      'Passaggi in coda (Lq)': estimableValue(queue.Lq),
      'Passaggi nel sistema (L)': estimableValue(queue.L)
    });
  }

  // Sostituito il 2026-08-20 (chiesto da Marco: "si puo' fare un
  // istogramma?" - prima era una tabella di percentuali, poco leggibile
  // a colpo d'occhio) con un grafico a barre, stesso stile a canvas
  // gia' usato da drawPointsTimeline.
  // M5, chiesto da Marco (2026-08-20, punto 4): riempie una riga della
  // tabella "Dove si blocca il lavoro" (totale/occorrenze/media/min/max)
  // dallo stats object gia' pronto lato server (waitStats_, Model.gs).
  function renderWaitStatsRow_(prefix, stats) {
    stats = stats || {};
    document.getElementById(prefix + '-total').textContent = metricValue(stats.total_days, ' g');
    document.getElementById(prefix + '-occurrences').textContent = valueOrDash(stats.occurrences);
    document.getElementById(prefix + '-average').textContent = estimableValue(stats.average_days, ' g');
    document.getElementById(prefix + '-min').textContent = estimableValue(stats.min_days, ' g');
    document.getElementById(prefix + '-max').textContent = estimableValue(stats.max_days, ' g');
  }

  // R5 (DESIGN_R_S.md §3.5): lista "Fermi ora" - job attualmente bloccati
  // in una colonna di attesa, gia' ordinati per giorni decrescenti dal
  // server (currentlyBlocked_, Model.gs). S3 (§3.8): se il server ha
  // calcolato le fasce a percentile (campioni storici sufficienti), ogni
  // riga porta anche 'band' ('green'/'yellow'/'red') - se assente,
  // nessun colore (comportamento identico a prima di S3).
  var WAIT_FIELD_LABELS_ = { t_cliente_d: 'Cliente', t_ente_d: 'Enti', t_interno_d: 'Interno' };
  // R6.6 (addendum di collaudo): limitata alle 5 righe piu' urgenti
  // (l'array arriva gia' ordinato per elapsed_days decrescente dal
  // server, currentlyBlocked_ in Model.gs).
  var CURRENTLY_BLOCKED_LIMIT_ = 5;
  function renderCurrentlyBlocked_(items) {
    var body = document.getElementById('currently-blocked-body');
    var empty = document.getElementById('currently-blocked-empty');
    var table = document.getElementById('currently-blocked-table');
    body.innerHTML = '';
    if (!items.length) {
      table.hidden = true;
      empty.hidden = false;
      return;
    }
    table.hidden = false;
    empty.hidden = true;
    items.slice(0, CURRENTLY_BLOCKED_LIMIT_).forEach(function(item) {
      var tr = document.createElement('tr');
      if (item.band) { tr.className = 'blocked-band-' + item.band; }
      // R9.1: unico punto della pagina che scriveva un numero per
      // concatenazione diretta invece di passare da metricValue - per
      // questo mostrava il punto invece della virgola.
      [item.title || item.job_id, item.client, WAIT_FIELD_LABELS_[item.wait_type] || item.wait_type, metricValue(item.elapsed_days, ' g')].forEach(function(value) {
        var td = document.createElement('td');
        td.textContent = valueOrDash(value);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  // R5: trend mensile dell'attesa (waitTimeMonthBuckets_, Model.gs) - tre
  // serie (cliente/enti/interno), stesso stile a linee di
  // drawPointsTimeline ("Carico mensile"), adattato a tre serie invece
  // di una.
  function drawWaitTimeTrend_(rows) {
    var canvas = document.getElementById('wait-time-trend-chart');
    var empty = document.getElementById('wait-time-trend-chart-empty');
    var hasData = rows.some(function(row) {
      return Number(row.client_days || 0) > 0 || Number(row.authority_days || 0) > 0 || Number(row.internal_days || 0) > 0;
    });
    if (!rows.length || !hasData) {
      canvas.hidden = true;
      empty.hidden = false;
      return;
    }
    canvas.hidden = false;
    empty.hidden = true;
    var width = Math.max(560, canvas.parentElement.clientWidth - 32);
    var height = 200;
    var ratio = window.devicePixelRatio || 1;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.clearRect(0, 0, width, height);
    var pad = { left: 42, right: 18, top: 18, bottom: 34 };
    var max = Math.max.apply(null, rows.map(function(row) { return Math.max(row.client_days, row.authority_days, row.internal_days); }).concat([1]));
    ctx.font = '12px Arial';
    ctx.strokeStyle = '#d8dee8';
    ctx.fillStyle = '#627184';
    for (var g = 0; g <= 4; g++) {
      var gy = pad.top + (height - pad.top - pad.bottom) * g / 4;
      ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(width - pad.right, gy); ctx.stroke();
      ctx.fillText(String(Math.round(max * (1 - g / 4))), 4, gy + 4);
    }
    var colors = { client_days: '#2F6B9A', authority_days: '#238636', internal_days: '#B7791F' };
    Object.keys(colors).forEach(function(field) {
      ctx.beginPath();
      ctx.strokeStyle = colors[field];
      ctx.lineWidth = field === 'internal_days' ? 3 : 2;
      rows.forEach(function(row, index) {
        var x = pad.left + (width - pad.left - pad.right) * index / Math.max(1, rows.length - 1);
        var y = height - pad.bottom - (height - pad.top - pad.bottom) * Number(row[field] || 0) / max;
        if (index === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
        if (field === 'internal_days') {
          // R9.4: l'etichetta dell'ultimo mese non deve uscire dal
          // bordo destro del canvas - misura la larghezza reale del
          // testo e sposta la posizione se supererebbe il bordo.
          ctx.fillStyle = '#627184';
          var labelWidth = ctx.measureText(row.label).width;
          var textX = Math.min(x - 18, width - pad.right - labelWidth);
          ctx.fillText(row.label, textX, height - 12);
        }
      });
      ctx.stroke();
    });
  }

  // S2/S3 (corretto in collaudo, addendum): due grafici a dispersione
  // (mai due linee sulle settimane grezze) - "Throughput vs WIP" e
  // "Tempo di ciclo vs WIP", stesso asse X (WIP medio settimanale, in
  // punti). Punti chiari = singole settimane di flowWeeklyBuckets (nessuna
  // linea le collega: il WIP osservato oscilla, non e' monotono nel
  // tempo). Punti scuri, piu' grandi = medie di fascia di wipBands,
  // collegati da una linea in ordine di WIP CRESCENTE, mai in ordine
  // temporale - la tendenza reale si legge li'. Meno di 3 fasce valide ->
  // messaggio invece del grafico (stesso pattern di drawDelayHistogram_).
  var MIN_WIP_BANDS_ = 3;
  function drawWipScatter_(canvasId, emptyId, weeklyBuckets, bands, yField, yLabel) {
    var canvas = document.getElementById(canvasId);
    var empty = document.getElementById(emptyId);
    if (!bands.length || bands.length < MIN_WIP_BANDS_) {
      canvas.hidden = true;
      empty.hidden = false;
      return;
    }
    canvas.hidden = false;
    empty.hidden = true;
    var width = Math.max(420, canvas.parentElement.clientWidth - 32);
    var height = 200;
    var ratio = window.devicePixelRatio || 1;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.clearRect(0, 0, width, height);
    var pad = { left: 40, right: 16, top: 12, bottom: 46 };
    var plotWidth = width - pad.left - pad.right;
    var plotHeight = height - pad.top - pad.bottom;
    var bandField = yField === 'throughput_punti_settimana' ? 'throughput_medio' : 'ct_medio';
    var rawPoints = weeklyBuckets.filter(function(b) { return b[yField] !== null; });
    var maxWip = Math.max.apply(null, rawPoints.map(function(b) { return b.wip_medio; }).concat(bands.map(function(b) { return b.wip_medio; })).concat([1]));
    var maxY = Math.max.apply(null, rawPoints.map(function(b) { return b[yField]; }).concat(bands.map(function(b) { return b[bandField]; })).concat([1]));
    ctx.font = '11px Arial';
    ctx.strokeStyle = '#d8dee8';
    ctx.fillStyle = '#627184';
    // R9.3: tacche numeriche su entrambi gli assi (stesso pattern di
    // drawPointsTimeline/drawWaitTimeTrend_) - tolta la tacca vera, la
    // freccia testuale "->" diventa ridondante.
    for (var gy = 0; gy <= 4; gy++) {
      var yPix = pad.top + plotHeight * gy / 4;
      ctx.beginPath(); ctx.moveTo(pad.left, yPix); ctx.lineTo(width - pad.right, yPix); ctx.stroke();
      ctx.fillText(String(Math.round(maxY * (1 - gy / 4))), 4, yPix + 4);
    }
    for (var gx = 0; gx <= 4; gx++) {
      var xPix = pad.left + plotWidth * gx / 4;
      ctx.fillText(String(Math.round(maxWip * gx / 4)), xPix - 8, height - pad.bottom + 14);
    }
    ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, height - pad.bottom); ctx.lineTo(width - pad.right, height - pad.bottom); ctx.stroke();
    ctx.fillText('Lavoro in corso (pt)', pad.left, height - 8);
    ctx.save();
    ctx.translate(10, height - pad.bottom);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();

    // Punti chiari: le settimane grezze, senza linea.
    ctx.fillStyle = '#c3cddb';
    rawPoints.forEach(function(b) {
      var x = pad.left + plotWidth * (b.wip_medio / maxWip);
      var y = height - pad.bottom - plotHeight * (b[yField] / maxY);
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    // Punti scuri: le medie di fascia (gia' ordinate per WIP crescente da
    // wipBands_), collegate da una linea - MAI in ordine temporale.
    ctx.strokeStyle = '#2F6B9A';
    ctx.lineWidth = 2;
    ctx.beginPath();
    bands.forEach(function(b, index) {
      var x = pad.left + plotWidth * (b.wip_medio / maxWip);
      var y = height - pad.bottom - plotHeight * (b[bandField] / maxY);
      if (index === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    });
    ctx.stroke();
    ctx.fillStyle = '#2F6B9A';
    bands.forEach(function(b) {
      var x = pad.left + plotWidth * (b.wip_medio / maxWip);
      var y = height - pad.bottom - plotHeight * (b[bandField] / maxY);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawWipBandsCharts_(weeklyBuckets, bands) {
    drawWipScatter_('wip-throughput-scatter-chart', 'wip-throughput-scatter-empty', weeklyBuckets, bands, 'throughput_punti_settimana', 'Throughput (pt/settimana)');
    drawWipScatter_('wip-cycle-scatter-chart', 'wip-cycle-scatter-empty', weeklyBuckets, bands, 'ct_medio_giorni', 'Tempo di ciclo (g)');
  }

  function renderDelayProfile(profile) {
    // R6.5 (addendum di collaudo): "Profilo di rientro" -> "Profilo della
    // rilavorazione" (vedi anche il titolo del pannello in dashboard.html).
    renderDl('delay-profile-metrics', {
      'Rilavorazioni osservate (campione)': valueOrDash(profile.sample_size),
      'Quota di passaggi rilavorati (alpha)': estimableValue(profile.alpha),
      '80° percentile del tempo prima della rilavorazione': estimableValue(profile.p80_days, ' giorni')
    });
    drawDelayHistogram_(profile.kernel, profile.bin_days || 7);
  }

  function drawDelayHistogram_(kernel, binDays) {
    var canvas = document.getElementById('delay-profile-chart');
    var empty = document.getElementById('delay-profile-chart-empty');
    if (!kernel) {
      canvas.hidden = true;
      empty.hidden = false;
      empty.textContent = 'Dato non ancora stimabile (servono almeno 5 rilavorazioni osservate)';
      return;
    }
    canvas.hidden = false;
    empty.hidden = true;

    var width = Math.max(420, canvas.parentElement.clientWidth - 32);
    var height = 200;
    var ratio = window.devicePixelRatio || 1;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.clearRect(0, 0, width, height);

    var pad = { left: 34, right: 12, top: 12, bottom: 34 };
    var plotWidth = width - pad.left - pad.right;
    var plotHeight = height - pad.top - pad.bottom;
    var max = Math.max.apply(null, kernel.concat([0.01]));
    var barGap = 6;
    var barWidth = (plotWidth - barGap * (kernel.length - 1)) / kernel.length;

    ctx.font = '11px Arial';
    ctx.strokeStyle = '#d8dee8';
    ctx.fillStyle = '#627184';
    for (var g = 0; g <= 4; g++) {
      var gy = pad.top + plotHeight * g / 4;
      ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(width - pad.right, gy); ctx.stroke();
      ctx.fillText(Math.round(max * (1 - g / 4) * 100) + '%', 2, gy + 4);
    }

    kernel.forEach(function(share, index) {
      var x = pad.left + index * (barWidth + barGap);
      var barHeight = plotHeight * (share / max);
      var y = pad.top + plotHeight - barHeight;
      ctx.fillStyle = '#2F6B9A';
      ctx.fillRect(x, y, barWidth, barHeight);

      ctx.fillStyle = '#627184';
      ctx.textAlign = 'center';
      var label = index < kernel.length - 1
        ? (index * binDays) + '-' + ((index + 1) * binDays - 1) + 'g'
        : (index * binDays) + 'g+';
      ctx.fillText(label, x + barWidth / 2, height - 18);
      if (share > 0) {
        ctx.fillText(formatPercent(share), x + barWidth / 2, Math.max(y - 4, pad.top + 10));
      }
      ctx.textAlign = 'left';
    });
  }

  function renderPointsMetrics(points) {
    document.getElementById('points-committed').textContent = metricValue(points.committed_points, ' pt');
    document.getElementById('points-added').textContent = metricValue(points.added_points, ' pt');
    document.getElementById('points-completed').textContent = metricValue(points.completed_points, ' pt');
    renderBreakdown('points-by-size', points.by_size || [], false);
    renderBreakdown('points-by-assignee', points.by_assignee || [], false);
    renderBreakdown('points-by-column', points.by_column || [], true);
    drawPointsTimeline(points.timeline || []);
    renderMonthlyLoad(points.timeline || []);
  }

  function renderMonthlyLoad(rows) {
    var root = document.getElementById('monthly-load-body');
    root.innerHTML = '';
    rows.forEach(function(row) {
      var tr = document.createElement('tr');
      [row.label, row.entered_cards, row.completed_cards, row.entered_points, row.completed_points, row.net_points, row.open_points].forEach(function(value) {
        var td = document.createElement('td');
        td.textContent = valueOrDash(value);
        tr.appendChild(td);
      });
      root.appendChild(tr);
    });
  }

  // "values" e' un ARRAY (ordinato lato server), non un oggetto: l'ordine
  // delle chiavi di un oggetto non e' garantito nell'attraversare il
  // confine google.script.run, quello degli elementi di un array si'.
  // Per questo si costruisce il <dl> direttamente qui invece di passare
  // da renderDl (pensata per oggetti letterali client-side, dove
  // l'ordine non e' un problema).
  function renderBreakdown(id, rows, useLabel) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    var list = rows || [];
    if (!list.length) {
      var dt = document.createElement('dt');
      dt.textContent = 'Nessun dato';
      var dd = document.createElement('dd');
      dd.textContent = '-';
      root.appendChild(dt);
      root.appendChild(dd);
      return;
    }
    list.forEach(function(item) {
      var label = useLabel ? (item.label || item.key) : item.key;
      var dt = document.createElement('dt');
      dt.textContent = label;
      var dd = document.createElement('dd');
      // R9.11 (glossario R6): "card" -> "lavori" - non riguarda la
      // board vera (li' resta il nome dell'oggetto UI).
      dd.textContent = valueOrDash(item.points) + ' pt - ' + valueOrDash(item.cards) + ' lavori';
      root.appendChild(dt);
      root.appendChild(dd);
    });
  }

  function drawPointsTimeline(rows) {
    var canvas = document.getElementById('points-timeline-chart');
    var empty = document.getElementById('points-chart-empty');
    var hasData = rows.some(function(row) {
      return Number(row.entered_points || 0) > 0 || Number(row.completed_points || 0) > 0 || Number(row.open_points || 0) > 0;
    });
    if (!rows.length || !hasData) {
      canvas.hidden = true;
      empty.hidden = false;
      return;
    }
    canvas.hidden = false;
    empty.hidden = true;
    var width = Math.max(560, canvas.parentElement.clientWidth - 32);
    var height = 240;
    var ratio = window.devicePixelRatio || 1;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    var pad = { left: 42, right: 18, top: 18, bottom: 34 };
    var max = Math.max.apply(null, rows.map(function(row) { return Math.max(row.entered_points, row.completed_points, row.open_points); }).concat([1]));
    ctx.font = '12px Arial';
    ctx.strokeStyle = '#d8dee8';
    ctx.fillStyle = '#627184';
    for (var g = 0; g <= 4; g++) {
      var gy = pad.top + (height - pad.top - pad.bottom) * g / 4;
      ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(width - pad.right, gy); ctx.stroke();
      ctx.fillText(String(Math.round(max * (1 - g / 4))), 4, gy + 4);
    }
    var colors = { entered_points: '#2F6B9A', completed_points: '#238636', open_points: '#B7791F' };
    Object.keys(colors).forEach(function(field) {
      ctx.beginPath();
      ctx.strokeStyle = colors[field];
      ctx.lineWidth = field === 'open_points' ? 3 : 2;
      rows.forEach(function(row, index) {
        var x = pad.left + (width - pad.left - pad.right) * index / Math.max(1, rows.length - 1);
        var y = height - pad.bottom - (height - pad.top - pad.bottom) * Number(row[field] || 0) / max;
        if (index === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
        if (field === 'open_points') {
          // R9.4: stessa correzione di drawWaitTimeTrend_ - l'etichetta
          // dell'ultimo mese non deve uscire dal bordo destro.
          ctx.fillStyle = '#627184';
          var labelWidth = ctx.measureText(row.label).width;
          var textX = Math.min(x - 18, width - pad.right - labelWidth);
          ctx.fillText(row.label, textX, height - 12);
        }
      });
      ctx.stroke();
    });
  }

  // R9.8/R9.13: 'classesByLabel' opzionale (label -> nome classe CSS) -
  // per raggruppare visivamente dei sottototali (indentazione) o dare
  // enfasi a valori fuori scala, senza cambiare la forma dei dati che
  // arrivano dal server.
  function renderDl(id, values, classesByLabel) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    Object.keys(values).forEach(function(label) {
      var dt = document.createElement('dt');
      var dd = document.createElement('dd');
      dt.textContent = label;
      dd.textContent = valueOrDash(values[label]);
      var cls = classesByLabel && classesByLabel[label];
      if (cls) {
        dt.className = cls;
        dd.className = cls;
      }
      root.appendChild(dt);
      root.appendChild(dd);
    });
  }

  function renderScenarios(readiness) {
    var root = document.getElementById('scenario-list');
    root.innerHTML = '';
    var scenarios = readiness.scenarios || {};
    Object.keys(scenarios).forEach(function(key) {
      // R9.9: stile distinto (tratteggiato/grigio) da una card di dati
      // reali - queste non sono ancora attive.
      var item = document.createElement('div');
      item.className = 'scenario-item scenario-item-inactive';
      item.innerHTML = '<strong>' + escapeHtml(scenarios[key].label || key) + '</strong><span>Non ancora attivo</span>';
      root.appendChild(item);
    });
    document.getElementById('scenario-message').textContent = readiness.message || 'La simulazione futura non e ancora attiva.';
  }

  function sumPoints(jobs) {
    return jobs.reduce(function(sum, job) {
      return sum + Number(job.size_points || 0);
    }, 0);
  }

  function daysSince(iso) {
    if (!iso) {
      return 0;
    }
    return Math.floor((new Date().getTime() - new Date(iso).getTime()) / 864e5);
  }

  // M0-C: regola "aging" unificata (prima duplicata fra il ciclo
  // colonne di renderBoard, renderCard e updateColumnCounters_ di
  // M0-B — stessa soglia fissa "role==='stand_by' && >5 giorni"
  // ripetuta tre volte). aging_days e' opzionale per colonna
  // (columns_json, non piu' legato al ruolo): assente/vuoto = nessuna
  // evidenziazione per quella colonna, qualunque sia il ruolo.
  // status_since_ts (M0-C, non piu' start_ts/arrival_ts): da quando la
  // card e' entrata nella colonna ATTUALE, non nel sistema o in
  // lavorazione.
  function isJobAging_(job, column) {
    return Boolean(column && column.aging_days) && daysSince(job.status_since_ts) > Number(column.aging_days);
  }

  function countAgingInColumn_(jobs, column) {
    return jobs.filter(function(job) { return isJobAging_(job, column); }).length;
  }

  function initialsFor(value) {
    value = String(value || '').trim();
    if (!value) {
      return 'NA';
    }
    return value.split(/[ .@_-]+/).filter(Boolean).slice(0, 2).map(function(part) {
      return part.charAt(0).toUpperCase();
    }).join('') || 'NA';
  }

  function formatItalianDate(value) {
    if (!value) {
      return '';
    }
    var parts = String(value).slice(0, 10).split('-');
    return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : value;
  }

  function suggestPriorityClassClient(score) {
    var keys = priorityClassKeys_();
    for (var i = 0; i < keys.length; i++) {
      var item = state.priorityClasses[keys[i]];
      if (Number(score) < Number(item.score_max || 99)) {
        return keys[i];
      }
    }
    return 'p3_critical';
  }

  function priorityClassKeys_() {
    return Object.keys(state.priorityClasses).sort(function(a, b) {
      return Number(state.priorityClasses[a].score_max || 99) - Number(state.priorityClasses[b].score_max || 99);
    });
  }

  function coerceBool(value) {
    return value === true || value === 'TRUE' || value === 'true';
  }

  function valueOrDash(value) {
    return value === null || value === undefined || value === '' ? '-' : value;
  }

  function formatPercent(value) {
    if (value === null || value === undefined || value === '') {
      return '-';
    }
    return Math.round(Number(value) * 100) + '%';
  }

  function nullablePercent(value, allowZero) {
    if (value === null || value === undefined || value === '') {
      return 'Dato non ancora stimabile';
    }
    if (!allowZero && Number(value) === 0) {
      return 'Dato non ancora stimabile';
    }
    return Math.round(Number(value) * 100) + '%';
  }

  function estimableValue(value, suffix) {
    if (value === null || value === undefined || value === '') {
      return 'Dato non ancora stimabile';
    }
    return metricValue(value, suffix);
  }

  function metricValue(value, suffix) {
    if (value === null || value === undefined || value === '') {
      return 'Dato non ancora stimabile';
    }
    return String(value).replace('.', ',') + (suffix || '');
  }

  // Chiesto da Marco (2026-08-20): i tassi "al giorno" sono spesso
  // frazioni difficili da leggere a colpo d'occhio (es. "0,42/giorno") -
  // convertiti in "alla settimana" (x7) ovunque nella dashboard, dato
  // gia' calcolato/arrotondato al giorno lato server (Model.gs, formule
  // di teoria delle code legate tra loro) - la conversione resta solo
  // di presentazione, nessun ricalcolo server.
  function perWeekValue(value, suffix) {
    if (value === null || value === undefined || value === '') {
      return 'Dato non ancora stimabile';
    }
    return metricValue(Math.round(Number(value) * 700) / 100, suffix);
  }

  // Chiesto da Marco (2026-08-20, punto 3: "molto piu' aggressivo" nel
  // dare sempre anche i punti oltre alle iniziative): 'total' e' gia'
  // un totale sull'intera finestra (windowDays) - qui solo la
  // conversione a un tasso settimanale, nessun nuovo dato dal server.
  // R2 (DESIGN_R_S.md §3.2): generalizzata per accettare il suffisso -
  // riusata anche per la riga "Aggiunte" (card/settimana), non solo pt.
  function perWeekFromWindowTotal_(total, windowDays, suffix) {
    if (total === null || total === undefined || !windowDays) {
      return 'Dato non ancora stimabile';
    }
    return metricValue(Math.round(Number(total) / windowDays * 7 * 100) / 100, suffix);
  }

  // Stima i punti/settimana equivalenti di un tasso espresso in
  // visite/giorno, moltiplicando per la dimensione media dei casi
  // (avgPointsPerInitiative, da Model.gs) - sempre marcata "stimati"
  // dal chiamante, mai un valore esatto come quello in punti osservati
  // direttamente. Restituisce una stringa vuota (non "Dato non ancora
  // stimabile", per non duplicare il messaggio gia' mostrato dal valore
  // principale a cui questa stringa si affianca) se non calcolabile.
  function estimatedPointsSuffix_(ratePerDay, avgPointsPerInitiative) {
    if (ratePerDay === null || ratePerDay === undefined || avgPointsPerInitiative === null || avgPointsPerInitiative === undefined) {
      return '';
    }
    var perWeek = Math.round(Number(ratePerDay) * 7 * Number(avgPointsPerInitiative) * 10) / 10;
    return ' (~' + String(perWeek).replace('.', ',') + ' pt/settimana stimati)';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
    });
  }

  function showError(error) {
    var toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      document.body.appendChild(toast);
    }
    toast.className = 'toast visible';
    toast.textContent = error.message || error;
    window.setTimeout(function() {
      toast.classList.remove('visible');
    }, 4200);
  }

  function showMessage(message) {
    var toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      document.body.appendChild(toast);
    }
    toast.className = 'toast toast-info visible';
    toast.textContent = message;
    window.setTimeout(function() {
      toast.classList.remove('visible');
    }, 2800);
  }
</script>
