<script>
  var state = {
    env: window.SIGMAFLOW_ENV === 'test' ? 'test' : 'prod',
    board: {},
    jobs: [],
    columnMeta: [],
    priorityClasses: {},
    options: { assignees: [], tags: [], sizes: ['XS', 'S', 'M', 'L', 'XL'] },
    filters: { assignees: {}, tags: {}, sizes: {}, priority: '' },
    activeJob: null,
    activeColumnId: null,
    columnSettings: null,
    sortModes: {},
    pendingWrites: 0,
    prioritySaveTimer: null,
    touchJobId: null,
    touchGhost: null
  };

  var defaultColumns = [
    { id: 'notes', status: 'notes', label: 'NOTE', role: 'neutral', color: '#E8E8E8', count: 0, points: 0 },
    { id: 'backlog', status: 'backlog', label: 'BACKLOG', role: 'backlog', color: '#C8D8E8', count: 0, points: 0 },
    { id: 'todo', status: 'todo', label: 'TO DO', role: 'wip', color: '#A8C4E0', count: 0, points: 0 },
    { id: 'wip', status: 'wip', label: 'WIP', role: 'wip', color: '#5B9BD5', count: 0, points: 0 },
    { id: 'wait_client', status: 'wait_client', label: 'ATTESA CLIENTE', role: 'stand_by', color: '#FFD966', count: 0, points: 0 },
    { id: 'wait_authority', status: 'wait_authority', label: 'ATTESA ENTI', role: 'stand_by', color: '#F4B942', count: 0, points: 0 },
    { id: 'wait_internal', status: 'wait_internal', label: 'ATTESA MT/GC', role: 'stand_by', color: '#E8A020', count: 0, points: 0 },
    { id: 'done', status: 'done', label: 'DA INVIARE / DA FATTURARE', role: 'done', color: '#70AD47', count: 0, points: 0 }
  ];

  var roleLabels = {
    backlog: 'Ingresso',
    wip: 'WIP',
    stand_by: 'Stand-by',
    done: 'Concluso',
    neutral: 'Neutra'
  };

  var sizePoints = { XS: 3, S: 5, M: 8, L: 13, XL: 20 };

  document.addEventListener('DOMContentLoaded', function() {
    bindEnvironmentBadge();
    bindNavigation();
    bindToolbar();
    bindModal();
    loadBoard();
    loadMetrics();
    window.setInterval(function() { loadBoard(false); }, 45000);
  });

  function callApi(action, payload) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success === false) {
            reject(new Error((response && response.error) || 'Errore sconosciuto'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(reject)
        .api(action, Object.assign({}, payload || {}, { env: state.env }));
    });
  }

  function bindEnvironmentBadge() {
    var badge = document.getElementById('environment-badge');
    if (!badge) {
      return;
    }
    badge.textContent = state.env === 'test' ? 'TEST' : 'PROD';
    badge.className = 'environment-badge environment-' + state.env;
    badge.title = state.env === 'test'
      ? 'Ambiente TEST: scrive su SigmaFlow Database - TEST'
      : 'Ambiente PROD: scrive sul database operativo';
  }

  function bindNavigation() {
    document.querySelectorAll('.nav-button').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelectorAll('.nav-button').forEach(function(item) {
          item.classList.remove('active');
        });
        button.classList.add('active');
        document.getElementById('view-board').hidden = button.dataset.view !== 'board';
        document.getElementById('view-dashboard').hidden = button.dataset.view !== 'dashboard';
        if (button.dataset.view === 'dashboard') {
          loadMetrics();
        }
      });
    });
  }

  function bindToolbar() {
    document.getElementById('add-column-button').addEventListener('click', function() {
      state.columnSettings = { status: '', label: '', color: '#E8E8E8', hidden: false };
      document.getElementById('column-settings-label').value = '';
      document.getElementById('column-settings-color').value = '#E8E8E8';
      document.getElementById('column-settings-visible').checked = true;
      document.getElementById('column-settings-modal').showModal();
    });

    document.getElementById('show-hidden-columns-button').addEventListener('click', function() {
      var hidden = getColumns().filter(function(column) { return column.hidden; });
      if (!hidden.length) {
        showMessage('Non ci sono colonne nascoste');
        return;
      }
      Promise.all(hidden.map(function(column) {
        return callApi('updateColumn', { status: column.status, hidden: false });
      })).then(function() { loadBoard(true); }).catch(showError);
    });

    document.getElementById('reset-filters-button').addEventListener('click', function() {
      state.filters = { assignees: {}, tags: {}, sizes: {}, priority: '' };
      document.getElementById('filter-priority').value = '';
      renderToolbarFilters();
      renderBoard();
    });

    document.getElementById('filter-priority').addEventListener('change', function(event) {
      state.filters.priority = event.target.value;
      renderBoard();
    });

    document.getElementById('scroll-board-left').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: -560, behavior: 'smooth' });
    });
    document.getElementById('scroll-board-right').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: 560, behavior: 'smooth' });
    });
  }

  function bindModal() {
    var modal = document.getElementById('card-modal');
    document.getElementById('modal-close-button').addEventListener('click', function() {
      modal.close();
      state.activeJob = null;
      state.activeColumnId = null;
    });

    ['modal-title', 'modal-client', 'modal-description'].forEach(function(id) {
      document.getElementById(id).addEventListener('blur', saveModalField);
    });

    [
      'modal-assignee',
      'modal-tag',
      'modal-size',
      'modal-priority-class',
      'modal-due-date',
      'modal-invoiced'
    ].forEach(function(id) {
      document.getElementById(id).addEventListener('change', saveModalField);
    });

    ['modal-impact', 'modal-manageability'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', updateLivePriorityBadge);
      document.getElementById(id).addEventListener('change', savePriorityInputs);
    });

    document.getElementById('modal-create-button').addEventListener('click', createJobFromModal);
    document.getElementById('modal-priority-class').addEventListener('change', updateLivePriorityBadge);

    document.getElementById('column-settings-save').addEventListener('click', saveColumnSettings);
    document.getElementById('column-settings-cancel').addEventListener('click', function() {
      document.getElementById('column-settings-modal').close();
    });
  }

  function loadBoard(force) {
    if (!force && (state.pendingWrites > 0 || document.getElementById('card-modal').open)) {
      return;
    }
    callApi('getBoard').then(function(data) {
      state.board = data.columns || {};
      state.jobs = data.jobs || [];
      state.columnMeta = data.column_meta || defaultColumns;
      state.priorityClasses = data.priority_classes || {};
      state.options = data.options || state.options;
      renderToolbarFilters();
      renderBoard();
      updateLastUpdated();
    }).catch(showError);
  }

  function updateLastUpdated() {
    var el = document.getElementById('last-updated');
    var now = new Date();
    el.textContent = 'Aggiornato alle ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function renderToolbarFilters() {
    renderFilterPills('assignee-filter-pills', state.options.assignees || [], 'assignees', initialsFor);
    renderFilterPills('tag-filter-pills', state.options.tags || [], 'tags', function(value) { return value; });
    renderSizePills();
    renderPrioritySelect(document.getElementById('filter-priority'), true);
    fillDatalist('assignee-options', state.options.assignees || []);
    fillDatalist('tag-options', state.options.tags || []);
  }

  function renderFilterPills(id, values, filterKey, labelFn) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'filter-pill' + (state.filters[filterKey][value.toLowerCase()] ? ' active' : '');
      button.textContent = labelFn(value);
      button.title = value;
      button.addEventListener('click', function() {
        toggleFilter(filterKey, value);
      });
      root.appendChild(button);
    });
  }

  function renderSizePills() {
    document.querySelectorAll('#size-filter-pills .filter-pill').forEach(function(button) {
      var value = button.dataset.value.toLowerCase();
      button.classList.toggle('active', Boolean(state.filters.sizes[value]));
      button.onclick = function() {
        toggleFilter('sizes', button.dataset.value);
      };
    });
  }

  function toggleFilter(filterKey, value) {
    var normalized = String(value || '').toLowerCase();
    if (state.filters[filterKey][normalized]) {
      delete state.filters[filterKey][normalized];
    } else {
      state.filters[filterKey][normalized] = true;
    }
    renderToolbarFilters();
    renderBoard();
  }

  function fillDatalist(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      root.appendChild(option);
    });
  }

  function renderBoard() {
    var root = document.getElementById('kanban-board');
    root.innerHTML = '';

    getColumns().filter(function(column) {
      return !column.hidden;
    }).forEach(function(column, index, visibleColumns) {
      var jobs = (state.board[column.status] || []);
      jobs = sortJobsForColumn(jobs.slice(), column.status);
      var staleCount = jobs.filter(function(job) {
        return column.role === 'stand_by' && daysSince(job.start_ts || job.arrival_ts) > 5;
      }).length;
      var columnEl = document.createElement('section');
      columnEl.className = 'column role-' + (column.role || 'neutral');
      columnEl.style.setProperty('--column-color', column.color || '#E8E8E8');
      columnEl.dataset.status = column.status;
      columnEl.innerHTML = [
        '<div class="column-color-bar"></div>',
        '<div class="column-header">',
        '<div>',
        '<h2 class="column-title"></h2>',
        '<div class="column-badges">',
        '<span class="column-badge count-badge"></span>',
        '<span class="column-badge points-badge"></span>',
        '<span class="column-badge stale-badge" hidden></span>',
        '</div>',
        '</div>',
        '<div class="column-header-actions">',
        '<button type="button" class="move-column-left" title="Sposta colonna a sinistra">&lt;</button>',
        '<button type="button" class="move-column-right" title="Sposta colonna a destra">&gt;</button>',
        '<button type="button" class="sort-priority-button" title="Ordina per priorita">P</button>',
        '<button type="button" class="sort-date-button" title="Ordina per scadenza">D</button>',
        '<button type="button" class="column-menu-button" title="Impostazioni colonna">...</button>',
        '</div>',
        '</div>',
        '<div class="cards"></div>',
        '<button type="button" class="open-composer-button">Aggiungi</button>'
      ].join('');

      columnEl.querySelector('.column-title').textContent = column.label;
      columnEl.querySelector('.count-badge').textContent = jobs.length + ' card';
      columnEl.querySelector('.points-badge').textContent = sumPoints(jobs) + ' pt';
      if (staleCount > 0) {
        var staleBadge = columnEl.querySelector('.stale-badge');
        staleBadge.hidden = false;
        staleBadge.textContent = staleCount + ' >5g';
      }
      columnEl.querySelector('.column-menu-button').addEventListener('click', function() {
        openColumnMenu(column);
      });
      columnEl.querySelector('.move-column-left').disabled = index === 0;
      columnEl.querySelector('.move-column-right').disabled = index === visibleColumns.length - 1;
      columnEl.querySelector('.move-column-left').addEventListener('click', function() {
        moveColumn(column.status, 'left');
      });
      columnEl.querySelector('.move-column-right').addEventListener('click', function() {
        moveColumn(column.status, 'right');
      });
      columnEl.querySelector('.sort-priority-button').classList.toggle('active', state.sortModes[column.status] === 'priority');
      columnEl.querySelector('.sort-date-button').classList.toggle('active', state.sortModes[column.status] === 'date');
      columnEl.querySelector('.sort-priority-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'priority');
      });
      columnEl.querySelector('.sort-date-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'date');
      });

      bindDropTarget(columnEl, column.status);
      jobs.forEach(function(job) {
        columnEl.querySelector('.cards').appendChild(renderCard(job, column));
      });
      columnEl.querySelector('.open-composer-button').addEventListener('click', function() {
        openNewJobModal(column.status);
      });
      root.appendChild(columnEl);
    });
  }

  function renderCard(job, column) {
    var card = document.createElement('article');
    var matches = matchesFilters(job);
    var isLate = job.due_date && new Date(job.due_date + 'T23:59:59') < new Date();
    var isStale = column.role === 'stand_by' && daysSince(job.start_ts || job.arrival_ts) > 5;
    card.className = 'card' + (matches ? '' : ' filtered-out') + (isStale ? ' stale-card' : '');
    card.draggable = true;
    card.dataset.jobId = job.job_id;
    card.innerHTML = [
      '<div class="card-title"></div>',
      '<div class="card-client"></div>',
      '<div class="badges">',
      priorityBadgeHtml(job.priority_class),
      '<span class="badge">' + escapeHtml((job.size_class || 'M') + ' - ' + (job.size_points || sizePoints[job.size_class] || 8) + ' pt') + '</span>',
      '<span class="badge">' + escapeHtml(job.tag || 'senza tag') + '</span>',
      '</div>',
      '<div class="card-footer">',
      '<span class="avatar" title="' + escapeHtml(job.assignee || 'Non assegnato') + '">' + escapeHtml(initialsFor(job.assignee || '')) + '</span>',
      '<span class="due-date' + (isLate ? ' late' : '') + '">' + escapeHtml(formatItalianDate(job.due_date)) + '</span>',
      Number(job.visit_number || 1) > 1 ? '<span class="badge rework">R' + escapeHtml(Number(job.visit_number) - 1) + '</span>' : '',
      job.description ? '<span class="description-icon" title="Descrizione presente">note</span>' : '',
      '</div>',
      '<div class="card-actions">',
      '<button type="button" class="delete-card-button">Elimina</button>',
      '</div>'
    ].join('');
    card.querySelector('.card-title').textContent = job.title || '(senza titolo)';
    card.querySelector('.card-client').textContent = job.client || '';
    card.title = isStale ? 'Fermo da ' + daysSince(job.start_ts || job.arrival_ts) + ' giorni' : '';

    card.addEventListener('dragstart', function(event) {
      event.dataTransfer.setData('text/plain', job.job_id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });
    card.addEventListener('touchstart', function(event) {
      startTouchDrag(event, job, card);
    }, { passive: true });
    card.addEventListener('touchmove', moveTouchDrag, { passive: false });
    card.addEventListener('touchend', endTouchDrag);
    card.addEventListener('click', function(event) {
      if (event.target.closest('button')) {
        return;
      }
      openCardModal(job);
    });
    card.querySelector('.delete-card-button').addEventListener('click', function(event) {
      event.stopPropagation();
      deleteJob(job);
    });
    return card;
  }

  function priorityBadgeHtml(priorityClass) {
    var key = priorityClass || 'p4_assess';
    var meta = state.priorityClasses[key] || { label: key || 'Priorita', color: '#CCCCCC' };
    return '<span class="priority-badge" style="background:' + escapeHtml(meta.color || '#CCCCCC') + '">' + escapeHtml(meta.label || key) + '</span>';
  }

  function fillSelect(select, values, emptyLabel) {
    select.innerHTML = '<option value="">' + emptyLabel + '</option>';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  function bindDropTarget(columnEl, status) {
    columnEl.addEventListener('dragover', function(event) {
      event.preventDefault();
    });
    columnEl.addEventListener('drop', function(event) {
      event.preventDefault();
      columnEl.classList.remove('drop-target');
      moveJob(event.dataTransfer.getData('text/plain'), status);
    });
    columnEl.addEventListener('dragenter', function() {
      columnEl.classList.add('drop-target');
    });
    columnEl.addEventListener('dragleave', function(event) {
      if (!columnEl.contains(event.relatedTarget)) {
        columnEl.classList.remove('drop-target');
      }
    });
  }

  function openColumnMenu(column) {
    state.columnSettings = column;
    document.getElementById('column-settings-label').value = column.label || '';
    document.getElementById('column-settings-color').value = column.color || '#E8E8E8';
    document.getElementById('column-settings-visible').checked = !column.hidden;
    document.getElementById('column-settings-modal').showModal();
  }

  function saveColumnSettings() {
    if (!state.columnSettings) {
      return;
    }
    var payload = {
      label: document.getElementById('column-settings-label').value.trim(),
      color: document.getElementById('column-settings-color').value,
      hidden: !document.getElementById('column-settings-visible').checked
    };
    if (!payload.label) {
      showError(new Error('Inserisci il nome della colonna'));
      return;
    }
    var action = state.columnSettings.status ? 'updateColumn' : 'addColumn';
    if (state.columnSettings.status) {
      payload.status = state.columnSettings.status;
    } else {
      payload.role = 'neutral';
    }
    callApi(action, payload).then(function() {
      document.getElementById('column-settings-modal').close();
      state.columnSettings = null;
      loadBoard(true);
    }).catch(showError);
  }

  function openCardModal(job) {
    state.activeJob = job;
    state.activeColumnId = job.status;
    fillModalSelects();
    document.getElementById('modal-title').value = job.title || '';
    document.getElementById('modal-client').value = job.client || '';
    document.getElementById('modal-description').value = job.description || '';
    document.getElementById('modal-assignee').value = job.assignee || '';
    document.getElementById('modal-tag').value = job.tag || '';
    document.getElementById('modal-size').value = job.size_class || 'M';
    document.getElementById('modal-priority-class').value = coerceBool(job.priority_class_manual) ? (job.priority_class || '') : '';
    document.getElementById('modal-impact').value = job.impact || 1;
    document.getElementById('modal-manageability').value = job.manageability || 1;
    document.getElementById('modal-due-date').value = job.due_date || '';
    document.getElementById('modal-invoiced').checked = coerceBool(job.invoiced);
    document.getElementById('modal-create-button').hidden = true;
    updateLivePriorityBadge();
    renderReworkHistory(job);
    document.getElementById('card-modal').showModal();
  }

  function openNewJobModal(columnId) {
    state.activeJob = null;
    state.activeColumnId = columnId;
    fillModalSelects();
    document.getElementById('modal-title').value = '';
    document.getElementById('modal-client').value = '';
    document.getElementById('modal-description').value = '';
    document.getElementById('modal-assignee').value = '';
    document.getElementById('modal-tag').value = '';
    document.getElementById('modal-size').value = 'M';
    document.getElementById('modal-priority-class').value = '';
    document.getElementById('modal-impact').value = 1;
    document.getElementById('modal-manageability').value = 1;
    document.getElementById('modal-due-date').value = '';
    document.getElementById('modal-invoiced').checked = false;
    document.getElementById('modal-rework-history').hidden = true;
    document.getElementById('modal-create-button').hidden = false;
    updateLivePriorityBadge();
    document.getElementById('card-modal').showModal();
    document.getElementById('modal-title').focus();
  }

  function fillModalSelects() {
    fillSelect(document.getElementById('modal-assignee'), state.options.assignees || [], 'Non assegnato');
    fillSelect(document.getElementById('modal-tag'), state.options.tags || [], 'Senza tag');
    renderPrioritySelect(document.getElementById('modal-priority-class'), true);
  }

  function renderPrioritySelect(select, includeEmpty) {
    var previous = select.value;
    var emptyLabel = select.id === 'modal-priority-class' ? 'Automatico' : 'Tutte';
    select.innerHTML = includeEmpty ? '<option value="">' + emptyLabel + '</option>' : '';
    Object.keys(state.priorityClasses).forEach(function(key) {
      var option = document.createElement('option');
      option.value = key;
      option.textContent = state.priorityClasses[key].label || key;
      select.appendChild(option);
    });
    select.value = previous;
  }

  function saveModalField(event) {
    if (!state.activeJob) {
      return;
    }
    var field = event.target.name;
    var payload = { job_id: state.activeJob.job_id };
    payload[field] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
    state.activeJob = Object.assign({}, state.activeJob, payload);
    mergeJobIntoState(state.activeJob);
    renderBoard();
    state.pendingWrites++;
    callApi('updateJob', payload).then(function(data) {
      state.activeJob = data.job || state.activeJob;
      mergeJobIntoState(state.activeJob);
      renderBoard();
    }).catch(showError).finally(function() {
      state.pendingWrites--;
    });
  }

  function savePriorityInputs() {
    updateLivePriorityBadge();
    if (!state.activeJob) {
      return;
    }
    window.clearTimeout(state.prioritySaveTimer);
    state.prioritySaveTimer = window.setTimeout(function() {
      var payload = {
        job_id: state.activeJob.job_id,
        impact: document.getElementById('modal-impact').value,
        manageability: document.getElementById('modal-manageability').value,
        priority_class: document.getElementById('modal-priority-class').value
      };
      state.pendingWrites++;
      callApi('updateJob', payload).then(function(data) {
        state.activeJob = data.job || state.activeJob;
        mergeJobIntoState(state.activeJob);
        renderBoard();
        updateLivePriorityBadge();
      }).catch(showError).finally(function() {
        state.pendingWrites--;
      });
    }, 180);
  }

  function createJobFromModal() {
    var title = document.getElementById('modal-title').value.trim();
    if (!title) {
      showError(new Error('Inserisci il titolo del job'));
      return;
    }
    var payload = modalPayload_();
    payload.title = title;
    payload.status = state.activeColumnId;
    state.pendingWrites++;
    callApi('addJob', payload).then(function() {
      document.getElementById('card-modal').close();
      state.activeColumnId = null;
      loadBoard(true);
    }).catch(showError).finally(function() {
      state.pendingWrites--;
    });
  }

  function modalPayload_() {
    return {
      client: document.getElementById('modal-client').value,
      description: document.getElementById('modal-description').value,
      assignee: document.getElementById('modal-assignee').value,
      tag: document.getElementById('modal-tag').value,
      size_class: document.getElementById('modal-size').value,
      impact: document.getElementById('modal-impact').value,
      manageability: document.getElementById('modal-manageability').value,
      priority_class: document.getElementById('modal-priority-class').value,
      due_date: document.getElementById('modal-due-date').value,
      invoiced: document.getElementById('modal-invoiced').checked
    };
  }

  function updateLivePriorityBadge() {
    var impact = Number(document.getElementById('modal-impact').value || 0);
    var manageability = Number(document.getElementById('modal-manageability').value || 0);
    var score = impact && manageability ? Math.round(Math.sqrt(impact * manageability) * 100) / 100 : 0;
    var priority = document.getElementById('modal-priority-class').value || suggestPriorityClassClient(score);
    var meta = state.priorityClasses[priority] || {};
    var badge = document.getElementById('modal-priority-badge');
    badge.textContent = (meta.label || priority || '-') + ' - ' + score;
    badge.style.background = meta.color || '#CCCCCC';
    document.getElementById('modal-impact-value').textContent = impact;
    document.getElementById('modal-manageability-value').textContent = manageability;
  }

  function renderReworkHistory(job) {
    var root = document.getElementById('modal-rework-history');
    if (!coerceBool(job.is_rework) && Number(job.visit_number || 1) <= 1) {
      root.hidden = true;
      root.innerHTML = '';
      return;
    }
    root.hidden = false;
    root.innerHTML = '<h3>Storico rientri</h3><p>Rientro ' + escapeHtml(Math.max(1, Number(job.visit_number || 1) - 1)) + ' - causa: ' + escapeHtml(job.rework_cause || 'manual') + '</p>';
  }

  function moveJob(jobId, status) {
    if (!jobId) {
      return;
    }
    var previousBoard = cloneBoard();
    if (moveJobLocally(jobId, status)) {
      renderBoard();
    }
    callApi('moveJob', { job_id: jobId, status: status }).then(function() { loadBoard(true); }).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function deleteJob(job) {
    if (!confirm('Eliminare "' + (job.title || job.job_id) + '"?')) {
      return;
    }
    var previousBoard = cloneBoard();
    removeJobLocally(job.job_id);
    renderBoard();
    callApi('deleteJob', { job_id: job.job_id }).then(function() { loadBoard(true); }).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function startTouchDrag(event, job, card) {
    state.touchJobId = job.job_id;
    state.touchGhost = card;
    card.classList.add('dragging');
  }

  function moveTouchDrag(event) {
    if (!state.touchJobId) {
      return;
    }
    event.preventDefault();
    var touch = event.touches[0];
    document.querySelectorAll('.column.drop-target').forEach(function(column) {
      column.classList.remove('drop-target');
    });
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var column = target && target.closest('.column');
    if (column) {
      column.classList.add('drop-target');
    }
  }

  function endTouchDrag(event) {
    if (!state.touchJobId) {
      return;
    }
    var touch = event.changedTouches[0];
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var column = target && target.closest('.column');
    if (state.touchGhost) {
      state.touchGhost.classList.remove('dragging');
    }
    document.querySelectorAll('.column.drop-target').forEach(function(item) {
      item.classList.remove('drop-target');
    });
    if (column) {
      moveJob(state.touchJobId, column.dataset.status);
    }
    state.touchJobId = null;
    state.touchGhost = null;
  }

  function cloneBoard() {
    return JSON.parse(JSON.stringify(state.board || {}));
  }

  function getColumns() {
    return state.columnMeta && state.columnMeta.length ? state.columnMeta : defaultColumns;
  }

  function toggleColumnSort(columnId, mode) {
    state.sortModes[columnId] = state.sortModes[columnId] === mode ? '' : mode;
    renderBoard();
  }

  function moveColumn(columnId, direction) {
    callApi('moveColumn', { status: columnId, direction: direction }).then(function() {
      loadBoard(true);
    }).catch(showError);
  }

  function sortJobsForColumn(jobs, columnId) {
    var mode = state.sortModes[columnId];
    if (mode === 'priority') {
      var rank = { p3_critical: 4, p2_urgent: 3, p1_plan: 2, p4_assess: 1 };
      jobs.sort(function(a, b) {
        return (rank[b.priority_class] || 0) - (rank[a.priority_class] || 0)
          || Number(b.priority_score || 0) - Number(a.priority_score || 0);
      });
    } else if (mode === 'date') {
      jobs.sort(function(a, b) {
        if (!a.due_date) { return 1; }
        if (!b.due_date) { return -1; }
        return String(a.due_date).localeCompare(String(b.due_date));
      });
    }
    return jobs;
  }

  function mergeJobIntoState(job) {
    state.jobs = (state.jobs || []).map(function(item) {
      return item.job_id === job.job_id ? job : item;
    });
    Object.keys(state.board || {}).forEach(function(columnId) {
      state.board[columnId] = (state.board[columnId] || []).map(function(item) {
        return item.job_id === job.job_id ? job : item;
      });
    });
  }

  function moveJobLocally(jobId, status) {
    var moved = null;
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        if (job.job_id === jobId) {
          moved = job;
          return false;
        }
        return true;
      });
    });
    if (!moved) {
      return false;
    }
    moved.status = status;
    if (!state.board[status]) {
      state.board[status] = [];
    }
    state.board[status].push(moved);
    return true;
  }

  function removeJobLocally(jobId) {
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        return job.job_id !== jobId;
      });
    });
  }

  function matchesFilters(job) {
    return matchesSetFilter(state.filters.assignees, job.assignee)
      && matchesSetFilter(state.filters.tags, job.tag)
      && matchesSetFilter(state.filters.sizes, job.size_class)
      && (!state.filters.priority || String(job.priority_class || '').toLowerCase() === state.filters.priority.toLowerCase());
  }

  function matchesSetFilter(filter, value) {
    var keys = Object.keys(filter);
    if (!keys.length) {
      return true;
    }
    return Boolean(filter[String(value || '').toLowerCase()]);
  }

  function loadMetrics() {
    callApi('getMetrics').then(renderMetrics).catch(showError);
  }

  function renderMetrics(metrics) {
    var stability = metrics.stability || {};
    var stateEl = document.getElementById('system-state');
    stateEl.className = 'state-badge state-' + stability.system_state;
    var stateLabels = { stable: 'STABILE', stressed: 'SOTTO PRESSIONE', critical: 'CRITICO', unstable: 'SATURO' };
    var explanations = {
      stable: 'Il carico e sostenibile e rimane margine per assorbire nuovi lavori.',
      stressed: 'Il carico sta aumentando: nuovi lavori possono allungare i tempi di attesa.',
      critical: 'Il gruppo e vicino alla saturazione. Conviene ridurre i lavori aperti o aumentare la capacita.',
      unstable: 'Il carico supera la capacita disponibile. Serve un intervento organizzativo.'
    };
    stateEl.textContent = stateLabels[stability.system_state] || '-';
    document.getElementById('rho-effective').textContent = 'Carico stimato: ' + formatPercent(metrics.rework && metrics.rework.rho_effective);
    document.getElementById('system-explanation').textContent = explanations[stability.system_state] || '';
    document.getElementById('rho-marker').style.left = Math.min(100, Math.max(0, ((metrics.rework && metrics.rework.rho_effective) || 0) * 100)) + '%';

    renderDl('empirical-metrics', {
      'Periodo analizzato': metrics.window_days + ' giorni',
      'Job osservati': metrics.n_jobs_observed,
      'Nuovi job al giorno': metrics.lambda,
      'Job completabili al giorno': metrics.mu,
      'Tempo medio di lavorazione': valueOrDash(metrics.E_S) + ' giorni',
      'Variabilita dei tempi': metrics.Cs2
    });

    renderDl('rework-metrics', {
      'Job con almeno un rientro': formatPercent(metrics.rework && metrics.rework.p1),
      'Passaggi medi per iniziativa': metrics.rework && metrics.rework.E_K,
      'Carico totale al giorno': metrics.rework && metrics.rework.lambda_effective,
      'Attesa stimata con rientri': valueOrDash(metrics.rework && metrics.rework.Wq) + ' giorni'
    });

    renderQueueTable(metrics);
  }

  function renderDl(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    Object.keys(values).forEach(function(label) {
      root.insertAdjacentHTML('beforeend', '<dt>' + label + '</dt><dd>' + valueOrDash(values[label]) + '</dd>');
    });
  }

  function renderQueueTable(metrics) {
    var rows = [
      ['Stima base', metrics.MM1],
      ['Stima con tempi variabili', metrics.MG1],
      ['Stima con rientri', { Wq: metrics.rework && metrics.rework.Wq, W: null, Lq: null, L: null }]
    ];
    var html = '<thead><tr><th>Stima</th><th>Attesa media</th><th>Tempo totale</th><th>Job in attesa</th><th>Job nel sistema</th></tr></thead><tbody>';
    rows.forEach(function(row) {
      html += '<tr><th>' + row[0] + '</th><td>' + valueOrDash(row[1].Wq) + '</td><td>' + valueOrDash(row[1].W) + '</td><td>' + valueOrDash(row[1].Lq) + '</td><td>' + valueOrDash(row[1].L) + '</td></tr>';
    });
    document.getElementById('queue-table').innerHTML = html + '</tbody>';
  }

  function sumPoints(jobs) {
    return jobs.reduce(function(sum, job) {
      return sum + Number(job.size_points || 0);
    }, 0);
  }

  function daysSince(iso) {
    if (!iso) {
      return 0;
    }
    return Math.floor((new Date().getTime() - new Date(iso).getTime()) / 864e5);
  }

  function initialsFor(value) {
    value = String(value || '').trim();
    if (!value) {
      return 'NA';
    }
    return value.split(/[ .@_-]+/).filter(Boolean).slice(0, 2).map(function(part) {
      return part.charAt(0).toUpperCase();
    }).join('') || 'NA';
  }

  function formatItalianDate(value) {
    if (!value) {
      return '';
    }
    var parts = String(value).slice(0, 10).split('-');
    return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : value;
  }

  function suggestPriorityClassClient(score) {
    var keys = Object.keys(state.priorityClasses);
    for (var i = 0; i < keys.length; i++) {
      var item = state.priorityClasses[keys[i]];
      if (Number(score) < Number(item.score_max || 99)) {
        return keys[i];
      }
    }
    return 'p4_assess';
  }

  function coerceBool(value) {
    return value === true || value === 'TRUE' || value === 'true';
  }

  function valueOrDash(value) {
    return value === null || value === undefined || value === '' ? '-' : value;
  }

  function formatPercent(value) {
    if (value === null || value === undefined || value === '') {
      return '-';
    }
    return Math.round(Number(value) * 100) + '%';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
    });
  }

  function showError(error) {
    var toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      document.body.appendChild(toast);
    }
    toast.className = 'toast visible';
    toast.textContent = error.message || error;
    window.setTimeout(function() {
      toast.classList.remove('visible');
    }, 4200);
  }

  function showMessage(message) {
    var toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      document.body.appendChild(toast);
    }
    toast.className = 'toast toast-info visible';
    toast.textContent = message;
    window.setTimeout(function() {
      toast.classList.remove('visible');
    }, 2800);
  }
</script>
