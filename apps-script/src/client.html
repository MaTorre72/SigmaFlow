<script>
  var state = {
    env: window.SIGMAFLOW_ENV === 'test' ? 'test' : 'prod',
    board: null,
    columnMeta: null,
    options: {
      assignees: [],
      tags: [],
      sizes: ['XS', 'S', 'M', 'L', 'XL']
    },
    filters: {
      assignee: '',
      tag: '',
      size: ''
    }
  };

  var defaultColumns = [
    { id: 'backlog', status: 'backlog', label: 'Backlog', role: 'backlog', count: 0, points: 0 },
    { id: 'in_progress', status: 'in_progress', label: 'In corso', role: 'wip', count: 0, points: 0 },
    { id: 'stand_by', status: 'stand_by', label: 'Stand-by', role: 'stand_by', count: 0, points: 0 },
    { id: 'in_review', status: 'in_review', label: 'In review', role: 'wip', count: 0, points: 0 },
    { id: 'done', status: 'done', label: 'Fatto', role: 'done', count: 0, points: 0 }
  ];

  var roleLabels = {
    backlog: 'Ingresso',
    wip: 'WIP',
    stand_by: 'Stand-by',
    done: 'Concluso',
    neutral: 'Neutra'
  };

  var sizePoints = {
    XS: 3,
    S: 5,
    M: 8,
    L: 13,
    XL: 20
  };

  document.addEventListener('DOMContentLoaded', function() {
    bindEnvironmentBadge();
    bindNavigation();
    bindFilters();
    bindColumnActions();
    loadBoard();
    loadMetrics();
    window.setInterval(loadBoard, 60000);
  });

  function callApi(action, payload) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success === false) {
            reject(new Error((response && response.error) || 'Errore sconosciuto'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(reject)
        .api(action, Object.assign({}, payload || {}, { env: state.env }));
    });
  }

  function bindEnvironmentBadge() {
    var badge = document.getElementById('environment-badge');
    if (!badge) {
      return;
    }
    badge.textContent = state.env === 'test' ? 'TEST' : 'PROD';
    badge.className = 'environment-badge environment-' + state.env;
    badge.title = state.env === 'test'
      ? 'Ambiente TEST: scrive su SigmaFlow Database - TEST'
      : 'Ambiente PROD: scrive sul database operativo';
  }

  function bindNavigation() {
    document.querySelectorAll('.nav-button').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelectorAll('.nav-button').forEach(function(item) {
          item.classList.remove('active');
        });
        button.classList.add('active');
        document.getElementById('view-board').hidden = button.dataset.view !== 'board';
        document.getElementById('view-dashboard').hidden = button.dataset.view !== 'dashboard';
        if (button.dataset.view === 'dashboard') {
          loadMetrics();
        }
      });
    });
  }

  function bindFilters() {
    [
      ['filter-assignee', 'assignee'],
      ['filter-tag', 'tag'],
      ['filter-size', 'size']
    ].forEach(function(pair) {
      document.getElementById(pair[0]).addEventListener('change', function(event) {
        state.filters[pair[1]] = event.target.value.toLowerCase();
        renderBoard();
      });
    });
  }

  function bindColumnActions() {
    document.getElementById('add-column-button').addEventListener('click', function() {
      var label = prompt('Nome nuova colonna');
      if (label === null) {
        return;
      }
      label = label.trim();
      if (!label) {
        showError(new Error('Nome colonna vuoto'));
        return;
      }

      var role = prompt('Ruolo: backlog, wip, stand_by, done, neutral', 'neutral');
      role = role === null ? 'neutral' : role.trim();
      callApi('addColumn', { label: label, role: role || 'neutral' }).then(loadBoard).catch(showError);
    });
  }

  function loadBoard() {
    callApi('getBoard').then(function(data) {
      state.board = data.columns;
      state.columnMeta = data.column_meta;
      state.options = data.options || state.options;
      renderFilters();
      renderBoard();
    }).catch(showError);
  }

  function renderFilters() {
    fillSelect('filter-assignee', state.options.assignees || [], 'Tutti');
    fillSelect('filter-tag', state.options.tags || [], 'Tutti');
    fillDatalist('assignee-options', state.options.assignees || []);
    fillDatalist('tag-options', state.options.tags || []);
  }

  function fillSelect(id, values, emptyLabel) {
    var select = document.getElementById(id);
    var previous = select.value;
    select.innerHTML = '<option value="">' + emptyLabel + '</option>';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
    select.value = previous;
  }

  function fillDatalist(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      root.appendChild(option);
    });
  }

  function renderBoard() {
    var root = document.getElementById('kanban-board');
    root.innerHTML = '';

    getColumns().forEach(function(column, index) {
      var jobs = ((state.board && state.board[column.status]) || []).filter(matchesFilters);
      var points = jobs.reduce(function(sum, job) {
        return sum + Number(job.size_points || 0);
      }, 0);
      var columnEl = document.createElement('section');
      columnEl.className = 'column role-' + (column.role || 'neutral');
      columnEl.dataset.status = column.status;
      columnEl.innerHTML = [
        '<div class="column-header">',
        '<div>',
        '<div class="column-title-row">',
        '<h2 class="column-title"></h2>',
        '<span class="role-pill"></span>',
        '</div>',
        '<div class="column-stats"></div>',
        '</div>',
        '<div class="column-actions">',
        '<button type="button" class="move-left-button" title="Sposta a sinistra">&lt;</button>',
        '<button type="button" class="move-right-button" title="Sposta a destra">&gt;</button>',
        '<button type="button" class="rename-column-button" title="Rinomina colonna">Nome</button>',
        '</div>',
        '</div>',
        '<label class="role-control">Ruolo<select class="role-select"></select></label>',
        '<div class="cards"></div>',
        '<button type="button" class="open-composer-button">+ Scheda</button>',
        '<form class="quick-card-form" hidden></form>'
      ].join('');

      columnEl.querySelector('.column-title').textContent = column.label;
      columnEl.querySelector('.role-pill').textContent = roleLabels[column.role] || roleLabels.neutral;
      columnEl.querySelector('.column-stats').textContent = jobs.length + ' job - ' + points + ' pt';
      renderRoleSelect(columnEl.querySelector('.role-select'), column.role);

      columnEl.querySelector('.move-left-button').disabled = index === 0;
      columnEl.querySelector('.move-right-button').disabled = index === getColumns().length - 1;
      columnEl.querySelector('.move-left-button').addEventListener('click', function() {
        moveColumn(column, 'left');
      });
      columnEl.querySelector('.move-right-button').addEventListener('click', function() {
        moveColumn(column, 'right');
      });
      columnEl.querySelector('.rename-column-button').addEventListener('click', function() {
        renameColumn(column);
      });
      columnEl.querySelector('.role-select').addEventListener('change', function(event) {
        updateColumnRole(column, event.target.value);
      });

      bindDropTarget(columnEl, column.status);

      jobs.forEach(function(job) {
        columnEl.querySelector('.cards').appendChild(renderCard(job));
      });
      renderComposer(columnEl, column);
      root.appendChild(columnEl);
    });
  }

  function renderRoleSelect(select, role) {
    Object.keys(roleLabels).forEach(function(key) {
      var option = document.createElement('option');
      option.value = key;
      option.textContent = roleLabels[key];
      select.appendChild(option);
    });
    select.value = role || 'neutral';
  }

  function bindDropTarget(columnEl, status) {
    columnEl.addEventListener('dragover', function(event) {
      event.preventDefault();
    });
    columnEl.addEventListener('drop', function(event) {
      event.preventDefault();
      columnEl.classList.remove('drop-target');
      moveJob(event.dataTransfer.getData('text/plain'), status);
    });
    columnEl.addEventListener('dragenter', function() {
      columnEl.classList.add('drop-target');
    });
    columnEl.addEventListener('dragleave', function(event) {
      if (!columnEl.contains(event.relatedTarget)) {
        columnEl.classList.remove('drop-target');
      }
    });
  }

  function renderComposer(columnEl, column) {
    var button = columnEl.querySelector('.open-composer-button');
    var form = columnEl.querySelector('.quick-card-form');
    form.innerHTML = [
      '<input name="title" required placeholder="Titolo job">',
      '<div class="composer-grid">',
      '<input name="assignee" list="assignee-options" placeholder="Assegnatario">',
      '<input name="tag" list="tag-options" placeholder="Tag">',
      '<select name="size_class">',
      '<option value="XS">XS (3)</option>',
      '<option value="S">S (5)</option>',
      '<option value="M" selected>M (8)</option>',
      '<option value="L">L (13)</option>',
      '<option value="XL">XL (20)</option>',
      '</select>',
      '</div>',
      '<div class="form-actions">',
      '<button type="submit" class="primary-button">Crea</button>',
      '<button type="button" class="cancel-composer-button">Annulla</button>',
      '</div>'
    ].join('');

    button.addEventListener('click', function() {
      button.hidden = true;
      form.hidden = false;
      form.elements.title.focus();
    });
    form.querySelector('.cancel-composer-button').addEventListener('click', function() {
      form.reset();
      form.hidden = true;
      button.hidden = false;
    });
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      var data = Object.fromEntries(new FormData(form).entries());
      data.status = column.status;
      callApi('addJob', data).then(function() {
        form.reset();
        form.hidden = true;
        button.hidden = false;
        loadBoard();
      }).catch(showError);
    });
  }

  function renderCard(job) {
    var card = document.createElement('article');
    card.className = 'card';
    card.draggable = true;
    card.addEventListener('dragstart', function(event) {
      event.dataTransfer.setData('text/plain', job.job_id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });

    var reworkBadge = Number(job.visit_number || 1) > 1
      ? '<span class="badge rework">v' + job.visit_number + '</span>'
      : '<span class="badge">v1</span>';

    card.innerHTML = [
      '<div class="card-title"></div>',
      '<div class="badges">',
      '<span class="badge">' + escapeHtml(job.tag || 'senza tag') + '</span>',
      '<span class="badge">' + escapeHtml(job.assignee || 'non assegnato') + '</span>',
      '<span class="badge">' + escapeHtml((job.size_class || 'M') + ' - ' + (job.size_points || sizePoints[job.size_class] || 8) + ' pt') + '</span>',
      reworkBadge,
      '</div>',
      '<div class="card-actions">',
      '<button type="button" class="delete-card-button">Elimina</button>',
      '</div>'
    ].join('');
    card.querySelector('.card-title').textContent = job.title || '(senza titolo)';
    card.querySelector('.delete-card-button').addEventListener('click', function() {
      deleteJob(job);
    });
    return card;
  }

  function moveJob(jobId, status) {
    if (!jobId) {
      return;
    }
    var previousBoard = cloneBoard();
    if (moveJobLocally(jobId, status)) {
      renderBoard();
    }
    callApi('moveJob', { job_id: jobId, status: status }).then(loadBoard).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function renameColumn(column) {
    var next = prompt('Nuovo nome colonna', column.label);
    if (next === null) {
      return;
    }
    next = next.trim();
    if (!next) {
      showError(new Error('Nome colonna vuoto'));
      return;
    }

    callApi('updateColumn', { status: column.status, label: next }).then(loadBoard).catch(showError);
  }

  function updateColumnRole(column, role) {
    callApi('updateColumn', { status: column.status, role: role }).then(loadBoard).catch(showError);
  }

  function moveColumn(column, direction) {
    callApi('moveColumn', { status: column.status, direction: direction }).then(loadBoard).catch(showError);
  }

  function deleteJob(job) {
    if (!confirm('Eliminare "' + (job.title || job.job_id) + '"?')) {
      return;
    }

    var previousBoard = cloneBoard();
    removeJobLocally(job.job_id);
    renderBoard();
    callApi('deleteJob', { job_id: job.job_id }).then(loadBoard).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
    });
  }

  function cloneBoard() {
    return JSON.parse(JSON.stringify(state.board || {}));
  }

  function getColumns() {
    return state.columnMeta && state.columnMeta.length ? state.columnMeta : defaultColumns;
  }

  function moveJobLocally(jobId, status) {
    var moved = null;
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        if (job.job_id === jobId) {
          moved = job;
          return false;
        }
        return true;
      });
    });
    if (!moved) {
      return false;
    }
    moved.status = status;
    if (!state.board[status]) {
      state.board[status] = [];
    }
    state.board[status].push(moved);
    return true;
  }

  function removeJobLocally(jobId) {
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        return job.job_id !== jobId;
      });
    });
  }

  function matchesFilters(job) {
    var assignee = String(job.assignee || '').toLowerCase();
    var tag = String(job.tag || '').toLowerCase();
    var size = String(job.size_class || '').toLowerCase();
    return (!state.filters.assignee || assignee === state.filters.assignee)
      && (!state.filters.tag || tag === state.filters.tag)
      && (!state.filters.size || size === state.filters.size);
  }

  function loadMetrics() {
    callApi('getMetrics').then(renderMetrics).catch(showError);
  }

  function renderMetrics(metrics) {
    var stability = metrics.stability || {};
    var stateEl = document.getElementById('system-state');
    stateEl.className = 'state-badge state-' + stability.system_state;
    stateEl.textContent = stability.system_state || '-';
    document.getElementById('rho-effective').textContent = 'rho effettivo: ' + valueOrDash(metrics.rework && metrics.rework.rho_effective);
    document.getElementById('rho-marker').style.left = Math.min(100, Math.max(0, ((metrics.rework && metrics.rework.rho_effective) || 0) * 100)) + '%';

    renderDl('empirical-metrics', {
      'Finestra': metrics.window_days + ' giorni',
      'Job osservati': metrics.n_jobs_observed,
      'lambda / giorno': metrics.lambda,
      'mu / giorno': metrics.mu,
      'E[S] giorni': metrics.E_S,
      'Cs2': metrics.Cs2
    });

    renderDl('rework-metrics', {
      'p1': metrics.rework && metrics.rework.p1,
      'E[K]': metrics.rework && metrics.rework.E_K,
      'lambda eff. / giorno': metrics.rework && metrics.rework.lambda_effective,
      'Wq rework giorni': metrics.rework && metrics.rework.Wq
    });

    renderQueueTable(metrics);
  }

  function renderDl(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    Object.keys(values).forEach(function(label) {
      root.insertAdjacentHTML('beforeend', '<dt>' + label + '</dt><dd>' + valueOrDash(values[label]) + '</dd>');
    });
  }

  function renderQueueTable(metrics) {
    var rows = [
      ['M/M/1', metrics.MM1],
      ['M/G/1', metrics.MG1],
      ['Rework', { Wq: metrics.rework && metrics.rework.Wq, W: null, Lq: null, L: null }]
    ];
    var html = '<thead><tr><th>Modello</th><th>Wq giorni</th><th>W giorni</th><th>Lq</th><th>L</th></tr></thead><tbody>';
    rows.forEach(function(row) {
      html += '<tr><th>' + row[0] + '</th><td>' + valueOrDash(row[1].Wq) + '</td><td>' + valueOrDash(row[1].W) + '</td><td>' + valueOrDash(row[1].Lq) + '</td><td>' + valueOrDash(row[1].L) + '</td></tr>';
    });
    document.getElementById('queue-table').innerHTML = html + '</tbody>';
  }

  function valueOrDash(value) {
    return value === null || value === undefined || value === '' ? '-' : value;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
    });
  }

  function showError(error) {
    alert(error.message || error);
  }
</script>
