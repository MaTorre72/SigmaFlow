<script>
  var state = {
    env: window.SIGMAFLOW_ENV === 'test' ? 'test' : 'prod',
    board: {},
    jobs: [],
    columnMeta: [],
    priorityClasses: {},
    options: { assignees: [], ambassadors: [], tags: [], sizes: ['XS', 'S', 'M', 'L', 'XL'] },
    filters: { assignees: {}, tags: {}, sizes: {}, priority: '' },
    activeJob: null,
    activeColumnId: null,
    columnSettings: null,
    sortModes: {},
    pendingWrites: 0,
    touchJobId: null,
    touchGhost: null,
    touchTimer: null,
    touchStart: null,
    suppressCardClick: false,
    metricsLoaded: false,
    archivioLoaded: false,
    cestinoLoaded: false
  };

  var defaultColumns = [
    { id: 'notes', status: 'notes', label: 'NOTE', role: 'neutral', color: '#E8E8E8', count: 0, points: 0 },
    { id: 'backlog', status: 'backlog', label: 'BACKLOG', role: 'backlog', color: '#C8D8E8', count: 0, points: 0 },
    { id: 'todo', status: 'todo', label: 'TO DO', role: 'wip', color: '#A8C4E0', count: 0, points: 0 },
    { id: 'wip', status: 'wip', label: 'WIP', role: 'wip', color: '#5B9BD5', count: 0, points: 0 },
    { id: 'wait_client', status: 'wait_client', label: 'ATTESA CLIENTE', role: 'stand_by', color: '#FFD966', count: 0, points: 0 },
    { id: 'wait_authority', status: 'wait_authority', label: 'ATTESA ENTI', role: 'stand_by', color: '#F4B942', count: 0, points: 0 },
    { id: 'wait_internal', status: 'wait_internal', label: 'ATTESA MT/GC', role: 'stand_by', color: '#E8A020', count: 0, points: 0 },
    { id: 'done', status: 'done', label: 'DA INVIARE / DA FATTURARE', role: 'done', color: '#70AD47', count: 0, points: 0 }
  ];

  var roleLabels = {
    backlog: 'Ingresso',
    wip: 'WIP',
    stand_by: 'Stand-by',
    done: 'Concluso',
    neutral: 'Neutra'
  };

  var sizePoints = { XS: 3, S: 5, M: 8, L: 13, XL: 20 };

  document.addEventListener('DOMContentLoaded', function() {
    bindEnvironmentBadge();
    bindNavigation();
    bindToolbar();
    bindModal();
    bindCestinoToolbar();
    bindDistributionTabs_();
    loadBoard();
    bindVisibilityPolling_();
  });

  // Consolidamento dashboard (segnalato da Marco, 2026-08-20): le tre
  // tabelle "Distribuzione per taglia/assegnatario/colonna" (stesso
  // pool di punti, tre viste diverse) diventano tab di un solo
  // pannello invece di tre pannelli separati. Bind una sola volta
  // all'avvio (i pannelli .distribution-panel restano nel DOM, si
  // limita a mostrare/nascondere — renderBreakdown, gia' esistente,
  // continua a scrivere il contenuto di ciascuno ad ogni loadMetrics
  // senza sapere quale sia visibile).
  function bindDistributionTabs_() {
    var tabs = document.querySelectorAll('.distribution-tab');
    if (!tabs.length) { return; }
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(other) {
          other.classList.remove('active');
          other.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        document.querySelectorAll('.distribution-panel').forEach(function(panel) {
          panel.hidden = panel.id !== tab.dataset.target;
        });
      });
    });
  }

  // Il polling a 45s serviva a tenere la board aggiornata anche a tab
  // in background, ma cosi' facendo continua a rileggere jobs+visite e
  // a ridisegnare anche quando nessuno la sta guardando: piu' sessioni
  // restano aperte in background, piu' cresce il carico sul backend
  // senza alcun beneficio reale. Sospeso quando la tab non e' visibile,
  // ripreso al ritorno in foreground con un refresh immediato (non solo
  // la ripartenza del timer, altrimenti si aspetterebbero altri 45s
  // prima di vedere dati aggiornati dopo un cambio tab).
  var boardPollTimer_ = null;

  function bindVisibilityPolling_() {
    startBoardPolling_();
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        loadBoard(false);
        startBoardPolling_();
      } else {
        stopBoardPolling_();
      }
    });
  }

  function startBoardPolling_() {
    if (boardPollTimer_ || document.visibilityState !== 'visible') {
      return;
    }
    boardPollTimer_ = window.setInterval(function() { loadBoard(false); }, 45000);
  }

  function stopBoardPolling_() {
    window.clearInterval(boardPollTimer_);
    boardPollTimer_ = null;
  }

  // P6 (DESIGN_lock_ambiente.md, §2.6/§3): specchio client-side di
  // SF_READ_ACTIONS_ (Kanban.gs) - non e' una fonte di verita' condivisa,
  // va tenuto allineato a mano se SF_READ_ACTIONS_ cambia lato server.
  var SF_READ_ACTIONS_CLIENT_ = {
    getBoard: true,
    getActivityLog: true,
    getArchivio: true,
    getCestino: true,
    getMetrics: true
  };

  function callApi(action, payload) {
    // P6: tracciamento centralizzato di state.pendingWrites - prima
    // affidato a incrementi/decrementi manuali sparsi nei singoli
    // chiamanti (es. saveCardFromModal), che lasciavano scoperte tutte
    // le altre azioni di scrittura (deleteJob, archiveJobFromModal,
    // duplicaJob, ripristinaJob, ...): il poll periodico poteva
    // sovrascrivere lo stato locale a meta' di una di quelle scritture.
    // .finally() (non i due handler di google.script.run, che non
    // coprono simmetricamente successo ed errore) copre entrambi i casi.
    var isWrite = !SF_READ_ACTIONS_CLIENT_[action];
    if (isWrite) {
      state.pendingWrites++;
    }
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success === false) {
            reject(new Error((response && response.error) || 'Errore sconosciuto'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(reject)
        .api(action, Object.assign({}, payload || {}, { env: state.env }));
    }).finally(function() {
      if (isWrite) {
        state.pendingWrites--;
      }
    });
  }

  function bindEnvironmentBadge() {
    var badge = document.getElementById('environment-badge');
    if (!badge) {
      return;
    }
    badge.textContent = state.env === 'test' ? 'TEST' : 'PROD';
    badge.className = 'environment-badge environment-' + state.env;
    badge.title = state.env === 'test'
      ? 'Ambiente TEST: scrive su SigmaFlow Database - TEST'
      : 'Ambiente PROD: scrive sul database operativo';
  }

  function bindNavigation() {
    // Scoperto a .main-nav: i tab del modal card usano la stessa classe
    // .nav-button, e senza questo scope questo handler intercettava anche
    // i loro click, nascondendo view-board (e con esso il modal, che ci
    // vive dentro) ogni volta che si cliccava "Informazioni"/"Cronologia".
    document.querySelectorAll('.main-nav .nav-button').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelectorAll('.main-nav .nav-button').forEach(function(item) {
          item.classList.remove('active');
        });
        button.classList.add('active');
        var view = button.dataset.view;
        document.getElementById('view-board').hidden = view !== 'board';
        document.getElementById('view-dashboard').hidden = view !== 'dashboard';
        document.getElementById('view-archivio').hidden = view !== 'archivio';
        document.getElementById('view-cestino').hidden = view !== 'cestino';
        if (view === 'dashboard') {
          loadMetrics();
        } else if (view === 'archivio') {
          // Bugfix 2026-08-25 (segnalato da Marco): Archivio/Cestino
          // sono viste consultate raramente (N4: cache per non
          // ricaricarle ad ogni apertura tab), ma con un job appena
          // archiviato/cestinato la cache diventava visibilmente
          // stantia proprio quando serviva vederla aggiornata. Forzato
          // un refresh ad ogni apertura del tab (non piu' solo alla
          // primissima volta) - resta comunque pigro rispetto al
          // caricamento pagina (nessuna chiamata finche' l'utente non
          // apre il tab almeno una volta).
          loadArchivio(true);
        } else if (view === 'cestino') {
          loadCestino(true);
        }
      });
    });
  }

  function bindToolbar() {
    var seedButton = document.getElementById('seed-test-data-button');
    if (seedButton && state.env === 'test') {
      seedButton.hidden = false;
      seedButton.addEventListener('click', function() {
        if (!confirm('Generare un nuovo dataset dimostrativo nel database TEST?')) { return; }
        callApi('seedTestData', { replace: true }).then(function(data) {
          showMessage('Creati ' + data.jobs + ' job TEST');
          loadBoard(true);
          loadMetrics(true);
        }).catch(showError);
      });
    }
    document.getElementById('add-column-button').addEventListener('click', function() {
      state.columnSettings = { status: '', label: '', color: '#E8E8E8', hidden: false };
      document.getElementById('column-settings-label').value = '';
      document.getElementById('column-settings-color').value = '#E8E8E8';
      document.getElementById('column-settings-role').value = 'neutral';
      document.getElementById('column-settings-visible').checked = true;
      document.getElementById('column-settings-aging-days').value = '';
      fillColumnPositionSelect('');
      document.getElementById('column-settings-modal').showModal();
    });

    document.getElementById('show-hidden-columns-button').addEventListener('click', function() {
      var hidden = getColumns().filter(function(column) { return column.hidden; });
      if (!hidden.length) {
        showMessage('Non ci sono colonne nascoste');
        return;
      }
      // Lasciato su loadBoard(true) apposta, a differenza di
      // saveColumnSettings/moveColumn qui sotto: piu' updateColumn in
      // PARALLELO sullo stesso columns_json rischiano di sovrascriversi
      // a vicenda lato server (letto-modificato-scritto, non atomico) —
      // fidarsi della risposta dell'ultima chiamata risolta potrebbe
      // riflettere uno stato intermedio perso. Un getBoard() dopo che
      // tutte sono finite rilegge lo stato vero, qualunque esso sia.
      Promise.all(hidden.map(function(column) {
        return callApi('updateColumn', { status: column.status, hidden: false });
      })).then(function() { loadBoard(true); }).catch(showError);
    });

    document.getElementById('manage-options-button').addEventListener('click', openOptionsManager);

    document.getElementById('reset-filters-button').addEventListener('click', function() {
      state.filters = { assignees: {}, tags: {}, sizes: {}, priority: '' };
      document.getElementById('filter-priority').value = '';
      renderToolbarFilters();
      renderBoard();
    });

    document.getElementById('filter-priority').addEventListener('change', function(event) {
      state.filters.priority = event.target.value;
      renderBoard();
    });

    document.getElementById('scroll-board-left').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: -560, behavior: 'smooth' });
    });
    document.getElementById('scroll-board-right').addEventListener('click', function() {
      document.getElementById('kanban-board').scrollBy({ left: 560, behavior: 'smooth' });
    });
  }

  function bindModal() {
    var modal = document.getElementById('card-modal');
    modal.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      saveCardFromModal();
    });
    document.getElementById('modal-close-button').addEventListener('click', function() {
      modal.close();
      state.activeJob = null;
      state.activeColumnId = null;
      closeActivityForm_();
    });

    bindActivityForm_();

    ['modal-impact', 'modal-manageability'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', updateLivePriorityBadge);
    });

    document.getElementById('modal-create-button').addEventListener('click', saveCardFromModal);
    document.getElementById('modal-archive-button').addEventListener('click', archiveJobFromModal);
    document.querySelectorAll('.modal-tabs .nav-button').forEach(function(button) {
      button.addEventListener('click', function() { setModalTab_(button.dataset.modalTab); });
    });
    document.getElementById('modal-priority-class').addEventListener('change', updateLivePriorityBadge);
    document.getElementById('modal-assignee').addEventListener('change', handleEditableSelectChange);
    document.getElementById('modal-ambassador').addEventListener('change', handleEditableSelectChange);
    document.getElementById('modal-tag').addEventListener('change', handleEditableSelectChange);

    document.getElementById('column-settings-save').addEventListener('click', saveColumnSettings);
    document.getElementById('column-settings-cancel').addEventListener('click', function() {
      document.getElementById('column-settings-modal').close();
    });
    document.getElementById('options-manager-kind').addEventListener('change', renderOptionsManager);
    document.getElementById('options-manager-add').addEventListener('click', addManagedOption);
    document.getElementById('options-manager-close').addEventListener('click', function() {
      document.getElementById('options-manager-modal').close();
    });
  }

  function loadBoard(force) {
    if (!force && (state.pendingWrites > 0 || document.getElementById('card-modal').open)) {
      return Promise.resolve();
    }
    return callApi('getBoard').then(function(data) {
      var columns = data.columns || {};
      var jobs = data.jobs || [];
      var columnMeta = data.column_meta || defaultColumns;
      var priorityClasses = data.priority_classes || {};

      // M8 (DESIGN_dashboard.md, §4.2): il polling periodico (ogni 45s,
      // bindVisibilityPolling_) richiama loadBoard(false) anche quando
      // nulla e' cambiato sul server - ridisegnare comunque l'intera board
      // (svuota e ricostruisce tutto il DOM, renderBoard) ad ogni giro
      // costa quanto un caricamento completo, senza alcun beneficio
      // visibile quando i dati sono identici. Confronto testuale del solo
      // stato che guida il disegno (non l'intera risposta, che include
      // anche opzioni/metadati che non cambiano la resa): se identico al
      // giro precedente e non e' un refresh esplicito (force), si salta
      // solo il ridisegno - l'orario "Aggiornato alle" si aggiorna
      // comunque, il poll ha confermato che i dati sono aggiornati.
      var renderSnapshot = JSON.stringify({ columns: columns, jobs: jobs, columnMeta: columnMeta, priorityClasses: priorityClasses });
      var unchanged = !force && renderSnapshot === state.lastRenderSnapshot_;

      state.board = columns;
      state.jobs = jobs;
      state.columnMeta = columnMeta;
      state.priorityClasses = priorityClasses;
      state.options = data.options || state.options;

      if (!unchanged) {
        state.lastRenderSnapshot_ = renderSnapshot;
        renderToolbarFilters();
        renderBoard();
      }
      updateLastUpdated();
    }).catch(showError);
  }

  function updateLastUpdated() {
    var el = document.getElementById('last-updated');
    var now = new Date();
    el.textContent = 'Aggiornato alle ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function renderToolbarFilters() {
    renderFilterPills('assignee-filter-pills', state.options.assignees || [], 'assignees', initialsFor);
    renderFilterPills('tag-filter-pills', state.options.tags || [], 'tags', function(value) { return value; });
    renderSizePills();
    renderPrioritySelect(document.getElementById('filter-priority'), true);
    fillDatalist('assignee-options', state.options.assignees || []);
    fillDatalist('tag-options', state.options.tags || []);
  }

  function renderFilterPills(id, values, filterKey, labelFn) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'filter-pill' + (state.filters[filterKey][value.toLowerCase()] ? ' active' : '');
      button.textContent = labelFn(value);
      button.title = value;
      button.addEventListener('click', function() {
        toggleFilter(filterKey, value);
      });
      root.appendChild(button);
    });
  }

  function renderSizePills() {
    document.querySelectorAll('#size-filter-pills .filter-pill').forEach(function(button) {
      var value = button.dataset.value.toLowerCase();
      button.classList.toggle('active', Boolean(state.filters.sizes[value]));
      button.onclick = function() {
        toggleFilter('sizes', button.dataset.value);
      };
    });
  }

  function toggleFilter(filterKey, value) {
    var normalized = String(value || '').toLowerCase();
    if (state.filters[filterKey][normalized]) {
      delete state.filters[filterKey][normalized];
    } else {
      state.filters[filterKey][normalized] = true;
    }
    renderToolbarFilters();
    renderBoard();
  }

  function fillDatalist(id, values) {
    var root = document.getElementById(id);
    root.innerHTML = '';
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      root.appendChild(option);
    });
  }

  function renderBoard() {
    var root = document.getElementById('kanban-board');
    root.innerHTML = '';
    var boardFragment = document.createDocumentFragment();

    getColumns().filter(function(column) {
      return !column.hidden;
    }).forEach(function(column, index, visibleColumns) {
      var jobs = (state.board[column.status] || []);
      jobs = sortJobsForColumn(jobs.slice(), column.status);
      var agingCount = countAgingInColumn_(jobs, column);
      var columnEl = document.createElement('section');
      columnEl.className = 'column role-' + (column.role || 'neutral');
      columnEl.style.setProperty('--column-color', column.color || '#E8E8E8');
      columnEl.dataset.status = column.status;
      columnEl.innerHTML = [
        '<div class="column-color-bar"></div>',
        '<div class="column-header">',
        '<div class="column-summary-row">',
        '<span class="column-badge count-badge"></span>',
        '<h2 class="column-title"></h2>',
        '<span class="column-badge points-badge"></span>',
        '</div>',
        '<div class="column-header-actions">',
        '<button type="button" class="move-column-left" title="Sposta colonna a sinistra">&lt;</button>',
        '<button type="button" class="move-column-right" title="Sposta colonna a destra">&gt;</button>',
        '<button type="button" class="sort-priority-button" title="Ordina per priorita">P</button>',
        '<button type="button" class="sort-date-button" title="Ordina per scadenza">D</button>',
        '<button type="button" class="column-menu-button" title="Impostazioni colonna">...</button>',
        '<button type="button" class="open-composer-button" title="Aggiungi card" aria-label="Aggiungi card">+</button>',
        '</div>',
        '<span class="column-badge stale-badge" hidden></span>',
        '</div>',
        '<div class="cards"></div>'
      ].join('');

      columnEl.querySelector('.column-title').textContent = column.label;
      columnEl.querySelector('.count-badge').textContent = jobs.length + ' card';
      columnEl.querySelector('.points-badge').textContent = sumPoints(jobs) + ' pt';
      if (agingCount > 0) {
        var staleBadge = columnEl.querySelector('.stale-badge');
        staleBadge.hidden = false;
        staleBadge.textContent = agingCount + ' >' + column.aging_days + 'g';
      }
      columnEl.querySelector('.column-menu-button').addEventListener('click', function() {
        openColumnMenu(column);
      });
      columnEl.querySelector('.move-column-left').disabled = index === 0;
      columnEl.querySelector('.move-column-right').disabled = index === visibleColumns.length - 1;
      columnEl.querySelector('.move-column-left').addEventListener('click', function() {
        moveColumn(column.status, 'left');
      });
      columnEl.querySelector('.move-column-right').addEventListener('click', function() {
        moveColumn(column.status, 'right');
      });
      columnEl.querySelector('.sort-priority-button').classList.toggle('active', state.sortModes[column.status] === 'priority');
      columnEl.querySelector('.sort-date-button').classList.toggle('active', state.sortModes[column.status] === 'date');
      columnEl.querySelector('.sort-priority-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'priority');
      });
      columnEl.querySelector('.sort-date-button').addEventListener('click', function() {
        toggleColumnSort(column.status, 'date');
      });

      bindDropTarget(columnEl, column.status);
      var cardsFragment = document.createDocumentFragment();
      jobs.filter(matchesFilters).forEach(function(job) {
        cardsFragment.appendChild(renderCard(job, column));
      });
      columnEl.querySelector('.cards').appendChild(cardsFragment);
      columnEl.querySelector('.open-composer-button').addEventListener('click', function() {
        openNewJobModal(column.status);
      });
      boardFragment.appendChild(columnEl);
    });
    root.appendChild(boardFragment);
  }

  function renderCard(job, column) {
    var card = document.createElement('article');
    var isLate = job.due_date && new Date(job.due_date + 'T23:59:59') < new Date();
    var isAging = isJobAging_(job, column);
    card.className = 'card' + (isAging ? ' stale-card' : '');
    if (job.card_color) {
      card.classList.add('custom-card-color');
      card.style.setProperty('--card-color', job.card_color);
    }
    card.draggable = true;
    card.dataset.jobId = job.job_id;
    card.innerHTML = [
      '<div class="card-client"></div>',
      '<div class="card-title"></div>',
      '<div class="badges">',
      priorityBadgeHtml(job.priority_class),
      '<span class="badge">' + escapeHtml((job.size_class || 'M') + ' - ' + (job.size_points || sizePoints[job.size_class] || 8) + ' pt') + '</span>',
      '<span class="badge">' + escapeHtml(job.tag || 'senza tag') + '</span>',
      '</div>',
      '<div class="card-footer">',
      '<span class="avatar" title="' + escapeHtml(job.assignee || 'Non assegnato') + '">' + escapeHtml(initialsFor(job.assignee || '')) + '</span>',
      job.ambassador ? '<span class="ambassador" title="Ambasciatore: ' + escapeHtml(job.ambassador) + '">A ' + escapeHtml(initialsFor(job.ambassador)) + '</span>' : '',
      '<span class="due-date' + (isLate ? ' late' : '') + '">' + escapeHtml(formatItalianDate(job.due_date)) + '</span>',
      Number(job.visit_number || 1) > 1 ? '<span class="badge rework">R' + escapeHtml(Number(job.visit_number) - 1) + '</span>' : '',
      job.description ? '<span class="description-icon" title="Descrizione presente">note</span>' : '',
      '</div>',
      '<div class="card-actions">',
      '<button type="button" class="delete-card-button" title="Sposta nel cestino" aria-label="Sposta nel cestino">x</button>',
      '</div>'
    ].join('');
    card.querySelector('.card-title').textContent = job.title || '(senza titolo)';
    card.querySelector('.card-client').textContent = job.client || '';
    card.title = isAging ? 'Fermo da ' + daysSince(job.status_since_ts) + ' giorni' : '';

    card.addEventListener('dragstart', function(event) {
      event.dataTransfer.setData('text/plain', job.job_id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });
    card.addEventListener('touchstart', function(event) {
      startTouchDrag(event, job, card);
    }, { passive: true });
    card.addEventListener('touchmove', moveTouchDrag, { passive: false });
    card.addEventListener('touchend', endTouchDrag);
    card.addEventListener('click', function(event) {
      if (state.suppressCardClick || event.target.closest('button')) {
        return;
      }
      openCardModal(job);
    });
    card.querySelector('.delete-card-button').addEventListener('click', function(event) {
      event.stopPropagation();
      deleteJob(job);
    });
    return card;
  }

  // M0-B: aggiornamento incrementale del DOM per le operazioni che
  // riguardano UN SOLO job (spostamento, salvataggio, eliminazione,
  // aggiunta) — tocca solo il nodo della card interessata e i badge
  // della sua colonna, mai le altre colonne/card. Riusa renderCard (la
  // stessa funzione del redraw completo, nessuna logica duplicata) per
  // costruire il nodo, cosi' listener/marcatura restano identici.
  // Il redraw completo (renderBoard) resta l'unica via per: cambio
  // filtro, colonne (aggiunta/riordino/rimozione), caricamento
  // iniziale/poll, rollback dopo errore — vedi ricognizione in cima al
  // file per l'elenco completo dei chiamanti.

  function findColumnMeta_(status) {
    return getColumns().filter(function(column) { return column.status === status; })[0] || null;
  }

  function findColumnEl_(status) {
    return document.querySelector('#kanban-board .column[data-status="' + status + '"]');
  }

  // Ricalcola conteggio/punti/badge "fermo da" di UNA colonna dal solo
  // state.board locale, senza toccare le card gia' renderizzate al suo
  // interno. Se la colonna non e' (ancora) nel DOM — nascosta, o
  // nessuna board caricata — non fa nulla: il prossimo renderBoard()
  // completo la riallineera' comunque.
  function updateColumnCounters_(status) {
    var columnEl = findColumnEl_(status);
    var column = findColumnMeta_(status);
    if (!columnEl || !column) { return; }
    var jobs = sortJobsForColumn((state.board[status] || []).slice(), status);
    var agingCount = countAgingInColumn_(jobs, column);
    columnEl.querySelector('.count-badge').textContent = jobs.length + ' card';
    columnEl.querySelector('.points-badge').textContent = sumPoints(jobs) + ' pt';
    var staleBadge = columnEl.querySelector('.stale-badge');
    staleBadge.hidden = agingCount <= 0;
    if (agingCount > 0) {
      staleBadge.textContent = agingCount + ' >' + column.aging_days + 'g';
    }
  }

  // Rimuove (se presente) e reinserisce il nodo della card nella sua
  // colonna corrente (job.status), nella posizione corretta per
  // l'ordinamento/i filtri attivi — senza spostare le altre card gia'
  // presenti. Se dopo i filtri la card non deve comparire, resta
  // rimossa (stesso comportamento del redraw completo, che la esclude
  // in partenza).
  function placeCardInColumn_(job) {
    var column = findColumnMeta_(job.status);
    var columnEl = findColumnEl_(job.status);
    if (!column || !columnEl || column.hidden) { return; }
    var cardsRoot = columnEl.querySelector('.cards');
    var existing = cardsRoot.querySelector('.card[data-job-id="' + job.job_id + '"]');
    if (existing) { existing.remove(); }
    if (!matchesFilters(job)) { return; }
    var sortedFiltered = sortJobsForColumn((state.board[job.status] || []).slice(), job.status).filter(matchesFilters);
    var index = sortedFiltered.findIndex(function(item) { return item.job_id === job.job_id; });
    var referenceNode = index >= 0 ? cardsRoot.children[index] : null;
    cardsRoot.insertBefore(renderCard(job, column), referenceNode || null);
  }

  function removeCardEl_(jobId) {

  function bindDropTarget(columnEl, status) {

      event.preventDefault();
      columnEl.classList.remove('drop-target');

  function saveCardFromModal() {
    var saveButton = document.getElementById('modal-create-button');
    if (saveButton.disabled) { return; }
    var title = document.getElementById('modal-title').value.trim();
    if (!title) {
      showError(new Error('Inserisci il titolo del job'));
      return;
    }
    var payload = modalPayload_();
    payload.title = title;
    saveButton.disabled = true;
    saveButton.textContent = 'Salvataggio...';
    var editing = Boolean(state.activeJob);
    prepareCustomOptions_(payload).then(function(prepared) {
      if (editing) {
        prepared.job_id = state.activeJob.job_id;
        return callApi('updateJob', prepared);
      }
      prepared.status = state.activeColumnId;
      return callApi('addJob', prepared);
    }).then(function(data) {
      var savedJob = data.job;
      if (savedJob) {
        updateOptionsFromJob(savedJob);
        if (editing) {
          mergeJobIntoState(savedJob);
        } else {
          addJobIntoState(savedJob);
        }
        // M0-B: solo il nodo di questa card + i badge della sua
        // colonna (stessa colonna in modifica, nuova in creazione),
        // non l'intera board.
        placeCardInColumn_(savedJob);
        updateColumnCounters_(savedJob.status);
      }
      document.getElementById('card-modal').close();
      state.activeJob = null;
      state.activeColumnId = null;
      renderToolbarFilters();
      updateLastUpdated();
    }).catch(showError).finally(function() {
      saveButton.disabled = false;
      saveButton.textContent = state.activeJob ? 'Salva e chiudi' : 'Crea e chiudi';

  function prepareCustomOptions_(payload) {
    return Promise.resolve().then(function() {
      var requests = [];
      [['assignee', 'assignees'], ['ambassador', 'ambassadors'], ['tag', 'tags']].forEach(function(pair) {
        var field = pair[0];
        var selected = document.getElementById('modal-' + field).value;
        if (selected === '__add__' || selected === 'Altro') {
          var custom = document.getElementById('modal-' + field + '-custom').value.trim();
          if (!custom) { throw new Error('Inserisci il nuovo valore per ' + field); }
          payload[field] = custom;
          requests.push(callApi('updateOptionList', { kind: pair[1], operation: 'add', value: custom }));
        }
      });
      return Promise.all(requests).then(function() { return payload; });
    });
  }

  function updateLivePriorityBadge() {
    var impact = Number(document.getElementById('modal-impact').value || 0);
    var manageability = Number(document.getElementById('modal-manageability').value || 0);
    // ATTENZIONE: duplica la formula di calcPriorityScore() in Utils.gs
    // (server) solo per l'anteprima dal vivo, prima del salvataggio -
    // se la formula server cambia, allineare anche qui.
    var score = impact && manageability ? Math.round(Math.sqrt(impact * manageability) * 100) / 100 : 0;
    var automaticPriority = suggestPriorityClassClient(score);
    var priority = document.getElementById('modal-priority-class').value || automaticPriority;
    var meta = state.priorityClasses[priority] || {};
    var automaticMeta = state.priorityClasses[automaticPriority] || {};
    var badge = document.getElementById('modal-priority-badge');
    badge.textContent = (meta.label || priority || '-') + ' - ' + score;
    badge.style.background = meta.color || '#CCCCCC';
    document.getElementById('modal-impact-value').textContent = impact;
    document.getElementById('modal-manageability-value').textContent = manageability;
    var automaticOption = document.querySelector('#modal-priority-class option[value=""]');
    if (automaticOption) {
      automaticOption.textContent = 'Automatico - ' + (automaticMeta.label || automaticPriority || '-');
    }
  }

    // Solo un'indicazione informativa: il dettaglio di ogni passaggio

    root.hidden = false;

    var lastCauseLabel = job.rework_cause ? columnLabelById_(job.rework_cause) : '';

  // Anteprima nel tab Informazioni: gli ultimi eventi di Cronologia, in
  // sola lettura (niente modifica/cancellazione — quelle restano nel
  // tab Cronologia). Il campo Descrizione resta le note libere
  // dell'utente, concettualmente separato da questa cronologia reale
  // degli spostamenti.
  var RECENT_ACTIVITY_PREVIEW_COUNT_ = 7;

  function renderRecentActivityPreview_(events) {
    var list = document.getElementById('modal-recent-activity-list');
    var empty = document.getElementById('modal-recent-activity-empty');
    list.innerHTML = '';
    if (!events.length) {
      empty.hidden = false;
      empty.textContent = 'Nessun evento registrato.';
      return;
    }
    empty.hidden = true;
    // M0-A2: stesso verso della tab Cronologia (dal piu' vecchio al piu'
    // recente) — segnalato da Marco come incoerenza tra le due viste.
    // getActivityLog restituisce gia' il log in ordine cronologico
    // crescente: gli ultimi N elementi sono i piu' recenti, l'ordine
    // resta invariato, nessun reverse.
    events.slice(-RECENT_ACTIVITY_PREVIEW_COUNT_).forEach(function(logEvent) {
      var row = document.createElement('div');
      row.className = 'recent-activity-row';
      var ts = document.createElement('span');
      ts.className = 'activity-log-ts';
      ts.textContent = formatEventTimestamp_(logEvent.ts);
      var description = document.createElement('span');
      description.textContent = activityEventDescription_(logEvent);
      row.appendChild(ts);
      row.appendChild(description);
      list.appendChild(row);
    });

  // P4 (DESIGN_lock_ambiente.md §2.4): riepilogo visivo di quanto tempo
  // la card ha passato in ciascuna colonna, su tutta la storia del job
  // (tutti i rientri, non solo la visita aperta) — un segmento aggregato
  // per colonna, non uno per singolo soggiorno (scelta di leggibilita',
  // vedi documento). Legge solo state.activityLog gia' in mano (nessuna
  // nuova chiamata callApi, nessuna nuova lettura Sheets) — stesso dato
  // gia' usato da renderActivityLog_/renderRecentActivityPreview_ sopra.
  var PATH_SUMMARY_FALLBACK_COLOR_ = '#B5B5B5';

  function renderCardPathSummary_(events, job) {
    var root = document.getElementById('modal-path-summary');
    var bar = document.getElementById('modal-path-summary-bar');
    var legend = document.getElementById('modal-path-summary-legend');
    if (!root || !bar || !legend) { return; }

    var moves = (events || []).filter(function(event) { return event.type === 'move'; });
    bar.innerHTML = '';
    legend.innerHTML = '';
    if (!moves.length) {
      root.hidden = true;
      return;
    }

    var now = new Date().getTime();
    var durations = {};
    var firstSeenOrder = [];

    moves.forEach(function(moveEvent, index) {
      var columnId = moveEvent.to;
      var segmentStart = new Date(moveEvent.ts).getTime();
      var segmentEnd;
      if (index < moves.length - 1) {
        segmentEnd = new Date(moves[index + 1].ts).getTime();
      } else {
        // Segmento corrente, ancora in corso: base status_since_ts
        // (M0-C) — stesso campo gia' usato per l'aging della card in
        // board, resta coerente anche se una correzione in Cronologia
        // ha spostato il "da quando" senza aggiungere un nuovo evento.
        // P6 (DESIGN_lock_ambiente.md §2.7): Math.max, non un uso diretto
        // - status_since_ts puo' solo spostare l'inizio in AVANTI
        // rispetto a quello che il log stesso dice essere l'ultimo
        // ingresso in questa colonna (segmentStart, gia' = moveEvent.ts
        // qualche riga sopra), mai indietro. Senza questo, un
        // status_since_ts rimasto disallineato (scritto in modo
        // inaffidabile prima del fix di P5, mai piu' aggiornato per i
        // job gia' esistenti - vedi P7) faceva mostrare durate assurde
        // (es. "WIP: 103g" per una card spostata li' 14 giorni prima -
        // caso reale JOB-20260707-GUKC). Stesso principio di P5 ("la
        // Cronologia comanda"), qui solo sulla visualizzazione: non
        // corregge il dato status_since_ts sul foglio (P7, fuori scope).
        segmentStart = job && job.status_since_ts
          ? Math.max(new Date(job.status_since_ts).getTime(), segmentStart)
          : segmentStart;
        segmentEnd = now;
      }
      var elapsed = Math.max(0, segmentEnd - segmentStart);
      if (!durations.hasOwnProperty(columnId)) {
        durations[columnId] = 0;
        firstSeenOrder.push(columnId);
      }
      durations[columnId] += elapsed;
    });

    var total = firstSeenOrder.reduce(function(sum, id) { return sum + durations[id]; }, 0);
    if (total <= 0) {
      root.hidden = true;
      return;
    }

    // Ordine di visualizzazione: stesso ordine delle colonne in board
    // (coerenza visiva con la board), non ordinamento per durata. Le
    // colonne toccate dal log ma non piu' presenti in state.columnMeta
    // (rinominate/eliminate nel frattempo) restano in coda, nell'ordine
    // in cui compaiono nel log — columnLabelById_ gia' gestisce il
    // fallback su id/'-' per queste.
    var boardOrder = (state.columnMeta || []).slice().sort(function(a, b) {
      return (a.order || 0) - (b.order || 0);
    }).map(function(column) { return column.id; });
    var displayOrder = boardOrder.filter(function(id) { return durations.hasOwnProperty(id); })
      .concat(firstSeenOrder.filter(function(id) { return boardOrder.indexOf(id) === -1; }));

    var currentColumnId = (job && job.status) || moves[moves.length - 1].to;

    root.hidden = false;
    displayOrder.forEach(function(columnId) {
      var ms = durations[columnId];
      var pct = (ms / total) * 100;
      var meta = (state.columnMeta || []).filter(function(column) { return column.id === columnId; })[0];
      var color = meta ? meta.color : PATH_SUMMARY_FALLBACK_COLOR_;
      var label = columnLabelById_(columnId);
      var isCurrent = columnId === currentColumnId;
      var durationLabel = label + ': ' + formatDurationLabel_(ms) + (isCurrent ? ' (in corso)' : '');

      var segment = document.createElement('span');
      segment.className = 'path-summary-segment' + (isCurrent ? ' path-summary-segment-current' : '');
      segment.style.width = pct + '%';
      segment.style.backgroundColor = color;
      segment.title = durationLabel;
      bar.appendChild(segment);

      var legendItem = document.createElement('span');
      legendItem.className = 'path-summary-legend-item';
      var dot = document.createElement('span');
      dot.className = 'path-summary-legend-dot';
      dot.style.backgroundColor = color;
      var text = document.createElement('span');
      text.textContent = durationLabel;
      legendItem.appendChild(dot);
      legendItem.appendChild(text);
      legend.appendChild(legendItem);
    });
  }

  // R8.2 (addendum di collaudo): "Percorso della card" serve per un
  // colpo d'occhio, non per precisione al minuto - solo giorni, al
  // massimo una cifra decimale (non piu' giorni+ore, es. "52g 9h").
  function formatDurationLabel_(ms) {
    var days = ms / 86400000;
    if (days >= 1) {
      return (Math.round(days * 10) / 10) + 'g';
    }
    var hours = ms / 3600000;
    if (hours >= 1) {
      return (Math.round(hours * 10) / 10) + 'h';
    }
    return Math.round(ms / 60000) + 'm';
  }

  var ACTIVITY_TYPE_LABELS_ = { move: 'SPOSTAMENTO', note: 'NOTA', correction: 'CORREZIONE' };
  var STRUCTURAL_FIELD_LABELS_ = {
    arrival_ts: 'Data creazione (arrival_ts)',
    incarico_ts: 'Data incarico (incarico_ts)',
    prep_ts: 'Data inizio preparazione (prep_ts)',
    start_ts: 'Data inizio lavorazione (start_ts)',
    done_ts: 'Data completamento (done_ts)',
    incarico_chiuso_ts: 'Chiusura incarico (incarico_chiuso_ts)'
  };
  var HARD_ERROR_MESSAGES_ = {
    TS_IN_FUTURO: 'La data non puo\' essere nel futuro.',
    COLONNA_NON_TROVATA: 'La colonna selezionata non e\' valida.',
    REASON_OBBLIGATORIA: 'Il motivo della correzione e\' obbligatorio.',
    CAMPO_NON_CORREGGIBILE: 'Il campo selezionato non e\' correggibile da qui.',
    DATA_NON_VALIDA: 'Il nuovo valore non e\' una data valida.',
    RIENTRO_DIRETTO_WIP_NON_CONSENTITO: 'Il rientro diretto da una colonna di attesa o da completato a WIP non e\' consentito. Registra prima lo spostamento in TO DO o in una colonna precedente.'
  };
  var SEQUENCE_WARNING_MESSAGES_ = {
    SEQUENZA_MODIFICATA: function(w) {
      return 'L\'evento del ' + formatEventTimestamp_(w.eventTs) + ' risultera\' provenire da "' +
        columnLabelById_(w.newFrom) + '" invece che da "' + columnLabelById_(w.oldFrom) + '".';
    },
    COLONNA_DOPPIA: function(w) {
      return 'Due soggiorni consecutivi in "' + columnLabelById_(w.colonna) + '" (probabile evento mancante tra i due).';
    },
    ATTESA_SENZA_USCITA: function(w) {
      return 'Rientro in "' + columnLabelById_(w.colonna) + '" senza un\'uscita registrata nel mezzo.';
    }
  };

  function columnLabelById_(id) {
    var column = (state.columnMeta || []).filter(function(item) { return item.id === id; })[0];
    return column ? column.label : (id || '-');
  }

  function formatEventTimestamp_(ts) {
    if (!ts) { return '-'; }
    var date = new Date(ts);
    if (isNaN(date.getTime())) { return ts; }
    var pad = function(n) { return String(n).padStart(2, '0'); };
    return pad(date.getDate()) + '/' + pad(date.getMonth() + 1) + '/' + date.getFullYear() + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  function activityEventDescription_(event) {
    if (event.type === 'move') {
      var move = event.from ? ('da ' + columnLabelById_(event.from) + ' → ' + columnLabelById_(event.to)) : ('→ ' + columnLabelById_(event.to));
      // Bugfix (segnalato da Marco): la nota di uno spostamento veniva
      // salvata e restava leggibile aprendo l'evento in modifica, ma
      // spariva dalla riga della Cronologia — l'unico punto dove la si
      // legge davvero scorrendo lo storico.
      return event.note ? (move + ' — ' + event.note) : move;
    }
    if (event.type === 'correction') {
      var reason = event.reason ? ' — ' + event.reason : '';
      return (STRUCTURAL_FIELD_LABELS_[event.field] || event.field || '') + ': ' + formatEventTimestamp_(event.old) + ' → ' + formatEventTimestamp_(event.new) + reason;
    }
    return event.note || '';
  }

  // M0-A2: unico punto che chiama getActivityLog per la card aperta —
  // prima la Cronologia (al click sul tab) e l'anteprima in
  // Informazioni (all'apertura della card) facevano ciascuna la propria
  // chiamata per lo stesso job_id, raddoppiando un round-trip che su
  // Apps Script costa 1-3s indipendentemente dalla quantita' di dati
  // (segnalato da Marco come "Cronologia lenta" dopo M0-A: il
  // rallentamento non era la lettura del foglio — gia' mirata su una
  // sola riga tramite findRowById_/readJobFromRow_, non un readTable_
  // sull'intero foglio jobs come si sospettava — ma il doppio round-trip
  // introdotto proprio dall'anteprima aggiunta in M0-A). Chiamata
  // all'apertura della card (vedi openCardModal) e dopo ogni mutazione
  // dell'evento (submitActivityPayload_/confirmActivityDelete_); il
  // cambio tab si limita a ridisegnare da state.activityLog, nessuna
  // nuova chiamata.
  function loadActivityLogForModal_() {
    if (!state.activeJob) { return; }
    closeActivityForm_();
    document.getElementById('modal-activity-banner').hidden = true;
    document.getElementById('modal-activity-list').innerHTML = '<p class="activity-log-status">Caricamento cronologia...</p>';
    document.getElementById('modal-recent-activity').hidden = false;
    document.getElementById('modal-recent-activity-list').innerHTML = '<p class="activity-log-status">Caricamento...</p>';
    document.getElementById('modal-recent-activity-empty').hidden = true;
    callApi('getActivityLog', { job_id: state.activeJob.job_id }).then(function(data) {
      state.activityLog = data.log || [];
      renderActivityLog_(state.activityLog);
      renderRecentActivityPreview_(state.activityLog);
      renderCardPathSummary_(state.activityLog, state.activeJob);
    }).catch(function(error) {
      document.getElementById('modal-activity-list').innerHTML = '<p class="activity-log-status">Impossibile caricare la cronologia. Riprovare.</p>';
      document.getElementById('modal-recent-activity-list').innerHTML = '';
      var empty = document.getElementById('modal-recent-activity-empty');
      empty.hidden = false;
      empty.textContent = 'Impossibile caricare la cronologia.';
      document.getElementById('modal-path-summary').hidden = true;
      document.getElementById('modal-path-summary-bar').innerHTML = '';
      document.getElementById('modal-path-summary-legend').innerHTML = '';
      showError(error);
    });
  }

  function renderActivityLog_(events) {
    var list = document.getElementById('modal-activity-list');
    list.innerHTML = '';
    if (!events.length) {
      list.innerHTML = '<p class="activity-log-empty">Nessun evento registrato. Gli spostamenti futuri verranno registrati automaticamente.</p>';
      return;
    }
    events.forEach(function(logEvent) {
      list.appendChild(renderActivityLogRow_(logEvent));
    });
  }

  function renderActivityLogRow_(logEvent) {
    var row = document.createElement('div');
    row.className = 'activity-log-row';

    var ts = document.createElement('span');
    ts.className = 'activity-log-ts';
    ts.textContent = formatEventTimestamp_(logEvent.ts);
    row.appendChild(ts);

    var typeBadge = document.createElement('span');
    typeBadge.className = 'activity-log-badge activity-log-badge-type';
    typeBadge.textContent = ACTIVITY_TYPE_LABELS_[logEvent.type] || logEvent.type;
    row.appendChild(typeBadge);

    var sourceBadge = document.createElement('span');
    var isAuto = logEvent.source === 'auto';
    sourceBadge.className = 'activity-log-badge activity-log-badge-source ' + (isAuto ? 'activity-log-badge-auto' : 'activity-log-badge-manual');
    sourceBadge.textContent = isAuto ? 'AUTO' : 'MANUALE';
    row.appendChild(sourceBadge);

    var description = document.createElement('span');
    description.className = 'activity-log-description';
    description.textContent = activityEventDescription_(logEvent);
    row.appendChild(description);

    // Ogni evento si puo' correggere, auto o manuale: il diario deve poter
    // essere reso accurato dall'utente (bloccato lato server solo se il
    // tentativo arriva su un percorso non consentito). La cancellazione
    // resta invece riservata ai soli eventi manuali: cancellare un evento
    // auto cancellerebbe un pezzo di storia reale, non una correzione.
    var actions = document.createElement('span');
    actions.className = 'activity-log-actions';
    var editButton = document.createElement('button');
    editButton.type = 'button';
    editButton.className = 'activity-log-edit';
    editButton.setAttribute('aria-label', 'Modifica evento');
    editButton.innerHTML = '&#9998;';
    editButton.addEventListener('click', function() { openActivityForm_(logEvent); });
    actions.appendChild(editButton);
    if (!isAuto) {
      var deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'activity-log-delete';
      deleteButton.setAttribute('aria-label', 'Elimina evento');
      deleteButton.innerHTML = '&#128465;';
      deleteButton.addEventListener('click', function() {
        state.activityDeleteEventId = logEvent.id;
        document.getElementById('activity-delete-dialog').showModal();
      });
      actions.appendChild(deleteButton);
    }
    row.appendChild(actions);

    return row;
  }

  // --- Fase I: form di inserimento/modifica evento e dialog di warning ---

  function bindActivityForm_() {
    document.getElementById('modal-activity-add-button').addEventListener('click', function() { openActivityForm_(null); });
    document.getElementById('activity-form-type').addEventListener('change', updateActivityFormFieldsVisibility_);
    document.getElementById('activity-form-ts').addEventListener('input', validateActivityFormTs_);
    document.getElementById('activity-form-save').addEventListener('click', saveActivityForm_);
    document.getElementById('activity-form-cancel').addEventListener('click', closeActivityForm_);

    document.getElementById('activity-sequence-cancel').addEventListener('click', function() {
      document.getElementById('activity-sequence-dialog').close();
      state.activityPending = null;
    });
    document.getElementById('activity-sequence-confirm').addEventListener('click', function() {
      document.getElementById('activity-sequence-dialog').close();
      if (!state.activityPending) { return; }
      state.activityPending.payload.force = true;
      submitActivityPayload_(state.activityPending.payload, state.activityPending.mode);
    });

    document.getElementById('activity-delete-cancel').addEventListener('click', function() {
      document.getElementById('activity-delete-dialog').close();
      state.activityDeleteEventId = null;
    });
    document.getElementById('activity-delete-confirm').addEventListener('click', confirmActivityDelete_);
  }

  function fillActivityColumnSelect_() {
    var select = document.getElementById('activity-form-to');
    select.innerHTML = '';
    (state.columnMeta || []).forEach(function(column) {
      var option = document.createElement('option');
      option.value = column.id;
      option.textContent = column.label;
      select.appendChild(option);
    });
  }

  function updateActivityFormFieldsVisibility_() {
    var type = document.getElementById('activity-form-type').value;
    document.getElementById('activity-form-move-fields').hidden = type !== 'move';
    document.getElementById('activity-form-note-fields').hidden = type !== 'note';
    document.getElementById('activity-form-correction-fields').hidden = type !== 'correction';
  }

  function validateActivityFormTs_() {
    var value = document.getElementById('activity-form-ts').value;
    var errorEl = document.getElementById('modal-activity-form-error');
    var saveButton = document.getElementById('activity-form-save');
    if (value && new Date(value).getTime() > Date.now()) {
      errorEl.hidden = false;
      errorEl.textContent = 'La data non puo\' essere nel futuro.';
      saveButton.disabled = true;
    } else {
      errorEl.hidden = true;
      saveButton.disabled = false;
    }
  }

  function openActivityForm_(eventToEdit) {
    var isEdit = Boolean(eventToEdit);
    state.activityFormEditId = isEdit ? eventToEdit.id : null;
    document.getElementById('modal-activity-form-error').hidden = true;
    document.getElementById('activity-form-save').disabled = false;
    fillActivityColumnSelect_();

    var tsInput = document.getElementById('activity-form-ts');
    var typeSelect = document.getElementById('activity-form-type');
    if (isEdit) {
      tsInput.value = isoToDatetimeLocal_(eventToEdit.ts);
      typeSelect.value = eventToEdit.type;
      document.getElementById('activity-form-to').value = eventToEdit.type === 'move' ? (eventToEdit.to || '') : '';
      document.getElementById('activity-form-move-note').value = eventToEdit.type === 'move' ? (eventToEdit.note || '') : '';
      document.getElementById('activity-form-note-text').value = eventToEdit.type === 'note' ? (eventToEdit.note || '') : '';
      document.getElementById('activity-form-correction-field').value = eventToEdit.type === 'correction' ? (eventToEdit.field || 'arrival_ts') : 'arrival_ts';
      document.getElementById('activity-form-correction-new').value = eventToEdit.type === 'correction' ? isoToDatetimeLocal_(eventToEdit.new || '') : '';
      document.getElementById('activity-form-correction-reason').value = eventToEdit.type === 'correction' ? (eventToEdit.reason || '') : '';
    } else {
      tsInput.value = isoToDatetimeLocal_(new Date().toISOString());
      typeSelect.value = 'move';
      document.getElementById('activity-form-to').value = '';
      document.getElementById('activity-form-move-note').value = '';
      document.getElementById('activity-form-note-text').value = '';
      document.getElementById('activity-form-correction-field').value = 'arrival_ts';
      document.getElementById('activity-form-correction-new').value = '';
      document.getElementById('activity-form-correction-reason').value = '';
    }
    updateActivityFormFieldsVisibility_();
    document.getElementById('modal-activity-form').hidden = false;
    document.getElementById('modal-activity-add-button').hidden = true;
  }

  function closeActivityForm_() {
    var form = document.getElementById('modal-activity-form');
    if (form) { form.hidden = true; }
    var addButton = document.getElementById('modal-activity-add-button');
    if (addButton) { addButton.hidden = false; }
    state.activityFormEditId = null;
  }

  function buildActivityFormPayload_() {
    var payload = {
      job_id: state.activeJob.job_id,
      ts: document.getElementById('activity-form-ts').value,
      type: document.getElementById('activity-form-type').value
    };
    if (payload.type === 'move') {
      payload.to = document.getElementById('activity-form-to').value;
      var note = document.getElementById('activity-form-move-note').value.trim();
      if (note) { payload.note = note; }
    } else if (payload.type === 'note') {
      payload.note = document.getElementById('activity-form-note-text').value.trim();
    } else if (payload.type === 'correction') {
      payload.field = document.getElementById('activity-form-correction-field').value;
      payload.new = document.getElementById('activity-form-correction-new').value;
      payload.reason = document.getElementById('activity-form-correction-reason').value.trim();
    }
    if (state.activityFormEditId) {
      payload.event_id = state.activityFormEditId;
    }
    return payload;
  }

  function saveActivityForm_() {
    var errorEl = document.getElementById('modal-activity-form-error');
    errorEl.hidden = true;
    var type = document.getElementById('activity-form-type').value;

    if (!document.getElementById('activity-form-ts').value) {
      errorEl.hidden = false; errorEl.textContent = 'Inserisci data e ora.'; return;
    }
    if (type === 'move' && !document.getElementById('activity-form-to').value) {
      errorEl.hidden = false; errorEl.textContent = 'Seleziona la colonna di destinazione.'; return;
    }
    if (type === 'note' && !document.getElementById('activity-form-note-text').value.trim()) {
      errorEl.hidden = false; errorEl.textContent = 'Inserisci il testo della nota.'; return;
    }
    if (type === 'correction') {
      if (!document.getElementById('activity-form-correction-new').value) {
        errorEl.hidden = false; errorEl.textContent = 'Inserisci il nuovo valore.'; return;
      }
      if (!document.getElementById('activity-form-correction-reason').value.trim()) {
        errorEl.hidden = false; errorEl.textContent = 'Inserisci il motivo della correzione.'; return;
      }
    }

    var payload = buildActivityFormPayload_();
    var mode = state.activityFormEditId ? 'edit' : 'add';
    submitActivityPayload_(payload, mode);
  }

  function submitActivityPayload_(payload, mode) {
    var saveButton = document.getElementById('activity-form-save');
    saveButton.disabled = true;
    var action = mode === 'edit' ? 'updateActivityEvent' : 'addActivityEvent';
    callApi(action, payload).then(function(data) {
      if (data && data.ok === false) {
        handleActivityRejection_(data, payload, mode);
        return;
      }
      state.activityPending = null;
      closeActivityForm_();
      loadActivityLogForModal_();
      applyActivityJobUpdate_(data.job);
    }).catch(function(error) {
      var errorEl = document.getElementById('modal-activity-form-error');
      errorEl.hidden = false;
      errorEl.textContent = error.message;
    }).finally(function() {
      saveButton.disabled = false;
    });
  }

  function handleActivityRejection_(data, payload, mode) {
    if (data.hardErrors && data.hardErrors.length) {
      var errorEl = document.getElementById('modal-activity-form-error');
      errorEl.hidden = false;
      errorEl.textContent = data.hardErrors.map(function(code) {
        return HARD_ERROR_MESSAGES_[code] || code;
      }).join(' ');
      return;
    }
    if (data.requiresForce) {
      state.activityPending = { payload: payload, mode: mode };
      renderSequenceWarnings_(data.warnings || []);
      document.getElementById('activity-sequence-dialog').showModal();
    }
  }

  function renderSequenceWarnings_(warnings) {
    var root = document.getElementById('activity-sequence-warnings');
    root.innerHTML = '';
    warnings.forEach(function(warning) {
      var p = document.createElement('p');
      var describe = SEQUENCE_WARNING_MESSAGES_[warning.code];
      p.textContent = describe ? describe(warning) : warning.code;
      root.appendChild(p);
    });
  }

  function confirmActivityDelete_() {
    document.getElementById('activity-delete-dialog').close();
    var eventId = state.activityDeleteEventId;
    state.activityDeleteEventId = null;
    if (!eventId || !state.activeJob) { return; }
    callApi('deleteActivityEvent', { job_id: state.activeJob.job_id, event_id: eventId }).then(function(data) {
      loadActivityLogForModal_();
      applyActivityJobUpdate_(data.job);
    }).catch(showError);
  }

  // M2, fix del 2026-08-20 (segnalato da Marco: la board mostrava lo
  // stato aggiornato con 1-2 minuti di ritardo dopo una correzione in
  // Cronologia, poi "Cronologia lenta" - causa reale del secondo
  // sintomo: il primo tentativo di questo fix chiamava loadBoard(true)
  // dopo ogni salvataggio, un giro in piu' di lock GLOBALE di script
  // (withEnvironment_, preso da OGNI chiamata api() anche di sola
  // lettura) proprio nel percorso piu' battuto durante un collaudo).
  // addActivityEvent/updateActivityEvent/deleteActivityEvent
  // restituiscono ora il job gia' aggiornato (stesso contratto di
  // risposta di moveJob, M0-A2/M0-B): aggiorna la card in stato locale,
  // senza un'altra chiamata al server. removeCardEl_ prima di
  // placeCardInColumn_ perche' la card puo' essere cambiata di colonna
  // senza che il DOM lo sappia ancora - stesso motivo per cui anche
  // moveJob (drag-and-drop reale) fa lo stesso, dopo P6
  // (DESIGN_lock_ambiente.md §2.6): placeCardInColumn_ da sola rimuove
  // il nodo esistente solo dentro la colonna di ARRIVO, mai da quella
  // di provenienza.
  function applyActivityJobUpdate_(job) {
    if (!job) { return; }
    var fromStatus = removeJobLocally(job.job_id);
    if (!state.board[job.status]) { state.board[job.status] = []; }
    state.board[job.status].push(job);
    var found = false;
    state.jobs = (state.jobs || []).map(function(item) {
      if (item.job_id === job.job_id) { found = true; return job; }
      return item;
    });
    if (!found) { state.jobs.push(job); }

    removeCardEl_(job.job_id);
    placeCardInColumn_(job);
    if (fromStatus) { updateColumnCounters_(fromStatus); }
    updateColumnCounters_(job.status);

    // Cosi' se l'utente torna sulla tab Informazioni nella stessa
    // sessione del modale vede colonna/stato aggiornati, non quelli
    // letti all'apertura del modale.
    if (state.activeJob && state.activeJob.job_id === job.job_id) {
      state.activeJob = job;
    }
  }

  function moveJob(jobId, status) {
    if (!jobId) {
      return;
    }
    var previousBoard = cloneBoard();
    // M0-B: solo il nodo della card spostata + i badge delle due
    // colonne coinvolte (provenienza e arrivo), non l'intera board.
    var moveResult = moveJobLocally(jobId, status);
    if (moveResult) {
      // P6 (DESIGN_lock_ambiente.md §2.6): placeCardInColumn_ rimuove il
      // nodo esistente solo dentro la colonna di ARRIVO - un trascinamento
      // rapido puo' lasciare il vecchio nodo orfano nella colonna di
      // provenienza, visibile in entrambe finche' un renderBoard() completo
      // non lo ripulisce. removeCardEl_ (board-wide) prima, stesso pattern
      // gia' in uso in applyActivityJobUpdate_.
      removeCardEl_(moveResult.job.job_id);
      placeCardInColumn_(moveResult.job);
      updateColumnCounters_(moveResult.fromStatus);
      updateColumnCounters_(status);
    }
    // Nessun loadBoard(true) sul successo: lo stato locale e' gia'
    // aggiornato ottimisticamente (moveJobLocally), rileggere l'intera
    // board da capo (2 fogli, jobs+visite) per confermare un dato gia'
    // noto costa quanto un caricamento completo ad ogni singolo drag.
    // Sul fallimento invece serve ririallinearsi allo stato server vero,
    // non solo tornare indietro alla board precedente.
    callApi('moveJob', { job_id: jobId, status: status }).then(function(data) {
      // Bugfix M0-A2: senza questo il badge rientri (Rnn) restava fermo
      // al valore di prima della mossa fino al prossimo poll — l'update
      // ottimistico (moveJobLocally) sposta la card ma non porta con se'
      // visit_number/is_rework/rework_cause, ricalcolati solo lato
      // server. moveJob ora li restituisce gia' pronti nella risposta.
      if (data.job) {
        mergeJobIntoState(data.job);
        placeCardInColumn_(data.job);
        updateColumnCounters_(data.job.status);
      }
      updateLastUpdated();
    }).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
      loadBoard(true);
    });
  }

  function deleteJob(job) {
    // §4.2: conferma leggera (non quella pesante di una cancellazione
    // vera) - lo spostamento nel Cestino e' reversibile (Ripristina, N4).
    if (!confirm('La card "' + (job.title || job.job_id) + '" verra\' spostata nel Cestino. Potrai ripristinarla o eliminarla definitivamente in seguito.')) {
      return;
    }
    var previousBoard = cloneBoard();
    // M0-B: rimuove solo il nodo della card eliminata e aggiorna i
    // badge della sua colonna, non l'intera board.
    var fromStatus = removeJobLocally(job.job_id);
    removeCardEl_(job.job_id);
    updateColumnCounters_(fromStatus);
    callApi('deleteJob', { job_id: job.job_id }).then(function() {
      updateLastUpdated();
    }).catch(function(error) {
      state.board = previousBoard;
      renderBoard();
      showError(error);
      loadBoard(true);
    });
  }

  function startTouchDrag(event, job, card) {
    var touch = event.touches[0];
    state.touchStart = { x: touch.clientX, y: touch.clientY };
    window.clearTimeout(state.touchTimer);
    state.touchTimer = window.setTimeout(function() {
      state.touchJobId = job.job_id;
      state.touchGhost = card;
      card.classList.add('dragging');
    }, 280);
  }

  function moveTouchDrag(event) {
    if (!state.touchJobId) {
      var touch = event.touches[0];
      if (state.touchStart && (Math.abs(touch.clientX - state.touchStart.x) > 8 || Math.abs(touch.clientY - state.touchStart.y) > 8)) {
        window.clearTimeout(state.touchTimer);
      }
      return;
    }
    event.preventDefault();
    var touch = event.touches[0];
    document.querySelectorAll('.column.drop-target').forEach(function(column) {
      column.classList.remove('drop-target');
    });
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var column = target && target.closest('.column');
    if (column) {
      column.classList.add('drop-target');
    }
  }

  function endTouchDrag(event) {
    window.clearTimeout(state.touchTimer);
    if (!state.touchJobId) {
      state.touchStart = null;
      return;
    }
    var touch = event.changedTouches[0];
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var column = target && target.closest('.column');
    if (state.touchGhost) {
      state.touchGhost.classList.remove('dragging');
    }
    document.querySelectorAll('.column.drop-target').forEach(function(item) {
      item.classList.remove('drop-target');
    });
    if (column) {
      moveJob(state.touchJobId, column.dataset.status);
    }
    state.suppressCardClick = true;
    window.setTimeout(function() { state.suppressCardClick = false; }, 350);
    state.touchJobId = null;
    state.touchGhost = null;
    state.touchStart = null;
  }

  function cloneBoard() {
    return JSON.parse(JSON.stringify(state.board || {}));
  }

  function getColumns() {
    return state.columnMeta && state.columnMeta.length ? state.columnMeta : defaultColumns;
  }

  // Segnalato da Marco come "molto lento": salvare/spostare una colonna
  // chiamava updateColumn/addColumn/moveColumn e POI loadBoard(true) —
  // un secondo round-trip completo (getBoard, che rilegge jobs+visite
  // oltre alle colonne) solo per riottenere qualcosa che la risposta
  // del primo salvataggio conteneva gia' (data.columns). Su Apps
  // Script ogni round-trip costa un paio di secondi fissi (vedi M0-A):
  // raddoppiarlo per un salvataggio di colonna si sentiva parecchio.
  // Aggiorna solo state.columnMeta dalla risposta gia' in mano e
  // ridisegna in locale — redraw completo della board (non solo la
  // colonna toccata: resta fuori scope di M0-B, un cambio colonna puo'
  // riguardare l'intero layout), ma senza un secondo giro di rete.
  // writeColumns_ (Kanban.gs) non include "status" (solo "id") a
  // differenza di readColumns_ — qui si aggiunge sempre, cosi' il resto
  // del codice (che legge column.status ovunque) continua a funzionare
  // indipendentemente da quale delle due forme arriva.
  function applyColumnsResponse_(columns) {
    state.columnMeta = (columns || []).map(function(column) {
      return Object.assign({ status: column.id }, column);
    });
    renderBoard();
  }

  // Redraw completo lasciato volutamente qui (fuori dallo scope di
  // M0-B, che copre solo le operazioni su un singolo job): un cambio di
  // ordinamento puo' riposizionare TUTTE le card della colonna, non
  // una sola — un aggiornamento incrementale utile richiederebbe di
  // ridisegnare comunque l'intera colonna (non l'intera board: un
  // margine di ottimizzazione futura possibile, non necessario ora).
  function toggleColumnSort(columnId, mode) {
    state.sortModes[columnId] = state.sortModes[columnId] === mode ? '' : mode;
    renderBoard();
  }

  function moveColumn(columnId, direction) {
    callApi('moveColumn', { status: columnId, direction: direction }).then(function(data) {
      applyColumnsResponse_(data.columns);
    }).catch(showError);
  }

  function sortJobsForColumn(jobs, columnId) {
    var mode = state.sortModes[columnId];
    if (mode === 'priority') {
      var rank = { p3_critical: 4, p2_urgent: 3, p1_plan: 2, p4_assess: 1 };
      jobs.sort(function(a, b) {
        return (rank[b.priority_class] || 0) - (rank[a.priority_class] || 0)
          || Number(b.priority_score || 0) - Number(a.priority_score || 0);
      });
    } else if (mode === 'date') {
      jobs.sort(function(a, b) {
        if (!a.due_date) { return 1; }
        if (!b.due_date) { return -1; }
        return String(a.due_date).localeCompare(String(b.due_date));
      });
    }
    return jobs;
  }

  function mergeJobIntoState(job) {
    state.jobs = (state.jobs || []).map(function(item) {
      return item.job_id === job.job_id ? job : item;
    });
    Object.keys(state.board || {}).forEach(function(columnId) {
      state.board[columnId] = (state.board[columnId] || []).map(function(item) {
        return item.job_id === job.job_id ? job : item;
      });
    });
  }

  function addJobIntoState(job) {
    state.jobs.push(job);
    if (!state.board[job.status]) { state.board[job.status] = []; }
    state.board[job.status].push(job);
  }

  function updateOptionsFromJob(job) {
    [['assignees', job.assignee], ['ambassadors', job.ambassador], ['tags', job.tag]].forEach(function(pair) {
      if (pair[1] && state.options[pair[0]].indexOf(pair[1]) === -1) {
        state.options[pair[0]].push(pair[1]);
      }
    });
  }

  // M0-B: restituisce anche la colonna di provenienza (non solo un
  // booleano) — il chiamante ne ha bisogno per aggiornare i contatori
  // della colonna lasciata, oltre a quella di arrivo.
  function moveJobLocally(jobId, status) {
    var moved = null;
    var fromStatus = null;
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        if (job.job_id === jobId) {
          moved = job;
          fromStatus = column;
          return false;
        }
        return true;
      });
    });
    if (!moved) {
      return null;
    }
    moved.status = status;
    if (!state.board[status]) {
      state.board[status] = [];
    }
    state.board[status].push(moved);
    return { job: moved, fromStatus: fromStatus };
  }

  // M0-B: restituisce la colonna da cui il job e' stato tolto, serve al
  // chiamante per aggiornare i contatori di quella sola colonna.
  function removeJobLocally(jobId) {
    var fromStatus = null;
    Object.keys(state.board || {}).forEach(function(column) {
      state.board[column] = (state.board[column] || []).filter(function(job) {
        if (job.job_id === jobId) {
          fromStatus = column;
          return false;
        }
        return true;
      });
    });
    return fromStatus;
  }

  function matchesFilters(job) {
    return matchesSetFilter(state.filters.assignees, job.assignee)
      && matchesSetFilter(state.filters.tags, job.tag)
      && matchesSetFilter(state.filters.sizes, job.size_class)
      && (!state.filters.priority || String(job.priority_class || '').toLowerCase() === state.filters.priority.toLowerCase());
  }

  function matchesSetFilter(filter, value) {
    var keys = Object.keys(filter);
    if (!keys.length) {
      return true;
    }
    return Boolean(filter[String(value || '').toLowerCase()]);
  }

  // Pigra: getMetrics() e' un secondo round-trip completo (rilegge
  // jobs+visite da capo), inutile finche' nessuno guarda la Dashboard.
  // Caricata la prima volta che si apre la tab, poi tenuta in cache per
  // il resto della sessione — force=true (bottone dati demo TEST) la
  // invalida esplicitamente perche' i dati sono davvero cambiati.
  // N4 (DESIGN_archiviazione.md, §6): vista Archivio, sola lettura -
  // anagrafica + riepilogo cronologia, nessuna azione. Stesso pattern
  // pigro/con cache di loadMetrics (§ sopra): non ricaricare ad ogni
  // apertura del tab, solo la prima volta o su richiesta esplicita
  // (force), dato che "consultata molto raramente" (design, §6).
  function loadArchivio(force) {
    if (state.archivioLoaded && !force) {
      return;
    }
    callApi('getArchivio').then(function(data) {
      state.archivioLoaded = true;
      renderArchivioList_(data.items || []);
    }).catch(showError);
  }

  function renderArchivioList_(items) {
    var body = document.getElementById('archivio-table-body');
    var empty = document.getElementById('archivio-empty');
    body.innerHTML = '';
    empty.hidden = items.length > 0;
    items.forEach(function(item) {
      var row = document.createElement('tr');
      row.innerHTML =
        '<td>' + escapeHtml(item.title || item.job_id) + '</td>' +
        '<td>' + escapeHtml(item.client || '') + '</td>' +
        '<td>' + escapeHtml(item.assignee || '') + '</td>' +
        '<td>' + formatItalianDate(item.arrival_ts) + '</td>' +
        '<td>' + formatItalianDate(item.incarico_chiuso_ts) + '</td>' +
        '<td>' + formatItalianDate(item.archiviato_ts) + '</td>' +
        '<td>' + (item.total_visits || 0) + '</td>' +
        '<td class="row-actions">' +
          '<button type="button" class="secondary-button" data-action="duplica">Usa come nuovo caso</button>' +
        '</td>';
      row.querySelector('[data-action="duplica"]').addEventListener('click', function() {
        duplicaJobFromArchivio(item.job_id, item.title || item.job_id);
      });
      body.appendChild(row);
    });
  }

  // N5 (§7): "Usa come nuovo caso" (etichetta rivista su richiesta di
  // Marco il 2026-08-19: "Duplica" non rendeva l'idea che nasce una card
  // NUOVA e vuota, non una copia della cronologia) crea un caso NUOVO
  // attivo a partire da un caso archiviato - nessun dato storico
  // riportato (arrival_ts/incarico_chiuso_ts/status/visite/log ripartono
  // da zero, vedi duplicaJob_ lato server - nome interno invariato,
  // tocca solo l'etichetta rivolta all'utente). Conferma leggera: non
  // e' un'azione distruttiva, ne' sul caso archiviato (resta li'
  // invariato) ne' altrove.
  function duplicaJobFromArchivio(jobId, label) {
    if (!confirm('Creare un nuovo caso attivo sulla board a partire da "' + label + '"? Il nuovo caso riparte da zero: nessuna cronologia ne\' visita pregressa viene riportata.')) {
      return;
    }
    callApi('duplicaJob', { job_id: jobId }).then(function() {
      showMessage('Nuovo caso creato sulla board.');
    }).catch(showError);
  }

  // N4 (§6b): vista Cestino, stessa forma dell'Archivio (design: "stessa
  // forma della vista Archivio") + tre azioni. "Ripristina" ha conferma
  // leggera (azione reversibile); "Elimina definitivamente"/"Svuota
  // cestino" hanno conferma pesante, essendo l'unico punto di reale
  // perdita di dati in questo intero programma (§4.3).
  function loadCestino(force) {
    if (state.cestinoLoaded && !force) {
      return;
    }
    callApi('getCestino').then(function(data) {
      state.cestinoLoaded = true;
      renderCestinoList_(data.items || []);
    }).catch(showError);
  }

  function renderCestinoList_(items) {
    var body = document.getElementById('cestino-table-body');
    var empty = document.getElementById('cestino-empty');
    body.innerHTML = '';
    empty.hidden = items.length > 0;
    items.forEach(function(item) {
      var row = document.createElement('tr');
      var label = escapeHtml(item.title || item.job_id);
      row.innerHTML =
        '<td>' + label + '</td>' +
        '<td>' + escapeHtml(item.client || '') + '</td>' +
        '<td>' + escapeHtml(item.assignee || '') + '</td>' +
        '<td>' + formatItalianDate(item.arrival_ts) + '</td>' +
        '<td>' + formatItalianDate(item.cestinato_ts) + '</td>' +
        '<td>' + (item.total_visits || 0) + '</td>' +
        '<td class="row-actions">' +
          '<button type="button" class="secondary-button" data-action="ripristina">Ripristina</button>' +
          '<button type="button" class="danger-button" data-action="elimina">Elimina definitivamente</button>' +
        '</td>';
      row.querySelector('[data-action="ripristina"]').addEventListener('click', function() {
        ripristinaJobFromCestino(item.job_id, item.title || item.job_id);
      });
      row.querySelector('[data-action="elimina"]').addEventListener('click', function() {
        eliminaJobDefinitivamenteFromCestino(item.job_id, item.title || item.job_id);
      });
      body.appendChild(row);
    });
  }

  function ripristinaJobFromCestino(jobId, label) {
    if (!confirm('Ripristinare "' + label + '"? Il caso tornera\' attivo sulla board.')) {
      return;
    }
    callApi('ripristinaJob', { job_id: jobId }).then(function() {
      showMessage('Caso ripristinato.');
      loadCestino(true);
    }).catch(showError);
  }

  function eliminaJobDefinitivamenteFromCestino(jobId, label) {
    if (!confirm('Eliminare definitivamente "' + label + '"? L\'azione non e\' reversibile: il caso e tutte le sue visite andranno persi per sempre.')) {
      return;
    }
    callApi('eliminaJobDefinitivamente', { job_id: jobId }).then(function() {
      showMessage('Caso eliminato definitivamente.');
      loadCestino(true);
    }).catch(showError);
  }

  function bindCestinoToolbar() {
    var button = document.getElementById('svuota-cestino-button');
    if (!button) {
      return;
    }
    button.addEventListener('click', function() {
      if (!confirm('Svuotare completamente il Cestino? L\'azione non e\' reversibile: tutti i casi al suo interno e le loro visite andranno persi per sempre.')) {
        return;
      }
      callApi('svuotaCestino').then(function(data) {
        showMessage('Cestino svuotato (' + (data.deleted_count || 0) + ' casi eliminati).');
        loadCestino(true);
      }).catch(showError);
    });
  }

  function loadMetrics(force) {
    if (state.metricsLoaded && !force) {
      return;
    }
    callApi('getMetrics').then(function(metrics) {
      state.metricsLoaded = true;
      renderMetrics(metrics);
    }).catch(showError);
  }

  function renderMetrics(metrics) {
    var system = metrics.systemState;
    if (!system) {
      showError(new Error('La lettura operativa della dashboard non e disponibile. Aggiorna il deployment Apps Script.'));
      return;
    }

    var status = system.systemStatus || {};
    var statusEl = document.getElementById('general-status');
    statusEl.className = 'state-badge state-' + (status.code || 'unknown');
    statusEl.textContent = status.label || 'DATI INSUFFICIENTI';
    document.getElementById('general-message').textContent = status.message || '';
    document.getElementById('quick-system-status').textContent = status.label || 'DATI INSUFFICIENTI';
    document.getElementById('quick-system-status').className = 'quick-state state-' + (status.code || 'unknown');

    // R9.7: la soglia della fascia attuale, non tutte e tre insieme.
    var quality = system.dataQuality || {};
    var qualityEl = document.getElementById('data-quality-status');
    qualityEl.className = 'quality-badge quality-' + (quality.level || 'low');
    qualityEl.textContent = quality.label || 'BASSA';
    document.getElementById('data-quality-message').textContent = quality.message || '';
    var qualityThresholds = { low: 'sotto 10', medium: '10-30', good: 'oltre 30' };
    var qualityThreshold = qualityThresholds[quality.level] || qualityThresholds.low;
    document.getElementById('data-quality-sample').textContent = valueOrDash(quality.observed_initiatives) + ' lavori osservati (soglia ' + (quality.label || 'BASSA') + ': ' + qualityThreshold + '), ' + valueOrDash(quality.completed_samples) + ' completati utili.';
    document.getElementById('quick-data-quality').textContent = quality.label || 'BASSA';
    document.getElementById('quick-data-quality').className = 'quick-quality quality-' + (quality.level || 'low');

    // R9.5/R9.6 (addendum di collaudo): "Carico effettivo"/"Capacita'
    // disponibile" non sono piu' due gauge ad arco (potevano superare
    // il 100% o essere negativi) ma un solo numero di sovraccarico in
    // Vista rapida - il dettaglio (quota di capacita', margine, ecc.)
    // resta nel pannello "Rilavorazione"/"Margine di stabilita'".
    renderLoadIndicator_('quick-load-value', system.capacityMetrics.effective_load);

    var flow = system.flowMetrics || {};
    var points = system.pointsMetrics || {};
    // Consolidamento dashboard (segnalato da Marco: pannelli/tabelle
    // duplicate) - conteggio E punti nella stessa tabella invece di due
    // pannelli separati (card in "Flusso del lavoro", punti solo in
    // Vista rapida). "Aperte" non e' finestrata (istantanea di adesso,
    // come open_points/open_cards); "Aggiunte"/"Completate" sono sulla
    // finestra di osservazione, stessa fonte (pointsStatistics_) per
    // card E punti, cosi' i due numeri non rischiano di sembrare un
    // doppione con un numero leggermente diverso (era successo con
    // n_jobs_observed/new_initiatives_observed, corretto lo stesso
    // giorno).
    // R7: "Aperti (ora)" mescolava pipeline commerciale (stadio 0) e
    // lavoro impegnato (stadi 1-4) - due righe distinte, mai sommate.
    document.getElementById('flow-pipeline-cards').textContent = valueOrDash(points.pipeline_cards);
    document.getElementById('flow-pipeline-points').textContent = metricValue(points.pipeline_points, ' pt');
    document.getElementById('flow-committed-cards').textContent = valueOrDash(points.committed_cards);
    document.getElementById('flow-committed-points').textContent = metricValue(points.committed_points, ' pt');
