<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #17202a;
    --muted: #627184;
    --line: #d8dee8;
    --accent: #146c5f;
    --accent-ink: #ffffff;
    --warn: #b7791f;
    --danger: #b42318;
    --ok: #238636;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 Arial, sans-serif;
  }

  .topbar {
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 24px;
    justify-content: flex-start;
    padding: 14px 20px;
  }

  .main-nav {
    display: flex;
    gap: 8px;
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
  }

  h1 {
    font-size: 21px;
  }

  h3 {
    font-size: 13px;
    margin-bottom: 8px;
  }

  .topbar p {
    color: var(--muted);
    margin-top: 2px;
  }

  .environment-badge {
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-left: auto;
    padding: 6px 12px;
  }

  .environment-prod {
    background: #fdecec;
    color: var(--danger);
  }

  .environment-test {
    background: #e7f6ed;
    color: var(--ok);
  }

  main {
    padding: 14px;
  }

  button,
  input,
  select,
  textarea {
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font: inherit;
    min-height: 34px;
  }

  button {
    background: var(--surface);
    cursor: pointer;
    padding: 0 10px;
  }

  button:disabled {
    cursor: default;
    opacity: 0.45;
  }

  input,
  select,
  textarea {
    background: var(--surface);
    padding: 0 10px;
  }

  textarea {
    min-height: 120px;
    padding: 10px;
    resize: vertical;
  }

  .primary-button,
  .nav-button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .board-toolbar {
    align-items: end;
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    position: sticky;
    top: 0;
    z-index: 8;
    background: var(--bg);
    padding-top: 6px;
  }

  .toolbar-group {
    display: grid;
    gap: 4px;
  }

  .toolbar-label,
  .toolbar-select {
    color: var(--muted);
    font-size: 12px;
  }

  .pill-row {
    display: flex;
    gap: 6px;
    min-height: 34px;
  }

  .filter-pill {
    background: #e8edf3;
    border-color: transparent;
    border-radius: 999px;
    color: #344154;
    min-height: 30px;
    padding: 0 10px;
    white-space: nowrap;
  }

  .filter-pill.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .last-updated {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
    white-space: nowrap;
  }

  .board-scroll-controls,
  .column-header-actions {
    display: flex;
    gap: 4px;
  }

  .board-scroll-controls button,
  .column-header-actions button {
    min-width: 34px;
    padding: 0 8px;
  }

  .column-header-actions button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .kanban-board {
    display: grid;
    gap: 12px;
    grid-auto-columns: minmax(260px, 1fr);
    grid-auto-flow: column;
    grid-template-columns: repeat(8, minmax(260px, 1fr));
    overflow-x: auto;
    padding-bottom: 12px;
  }

  .column {
    background: #eef2f6;
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 560px;
    overflow: hidden;
  }

  .column.drop-target {
    background: #e5f4ef;
    border-color: var(--accent);
  }

  .column-color-bar {
    background: var(--column-color, #e8e8e8);
    height: 4px;
    width: 100%;
  }

  .column-header {
    align-items: flex-start;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    padding: 10px 10px 8px;
  }

  .column h2 {
    color: #263446;
    font-size: 12px;
    letter-spacing: 0;
    margin: 0 0 7px;
    text-transform: uppercase;
  }

  .column-badges,
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .column-badge,
  .badge,
  .priority-badge {
    align-items: center;
    border-radius: 999px;
    display: inline-flex;
    font-size: 11px;
    min-height: 21px;
    padding: 2px 7px;
  }

  .column-badge,
  .badge {
    background: #e8edf3;
    color: #344154;
  }

  .stale-badge,
  .badge.rework {
    background: #fdecec;
    color: var(--danger);
  }

  .column-menu-button {
    min-height: 28px;
    padding: 0 8px;
  }

  .cards {
    min-height: 360px;
    padding: 0 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    margin-bottom: 9px;
    padding: 10px;
    transition: opacity 120ms ease, transform 120ms ease, border-color 120ms ease;
  }

  .card:hover {
    border-color: #b7c2d0;
  }

  .card.dragging {
    opacity: 0.55;
    transform: scale(0.98);
  }

  .card.filtered-out {
    opacity: 0.2;
  }

  .card.stale-card {
    border-left: 4px solid var(--danger);
  }

  .card-title {
    font-weight: 500;
    margin-bottom: 3px;
  }

  .card-client {
    color: var(--muted);
    font-size: 12px;
    min-height: 17px;
    margin-bottom: 8px;
  }

  .card-footer {
    align-items: center;
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }

  .avatar {
    align-items: center;
    background: #dbe5ef;
    border-radius: 50%;
    color: #263446;
    display: inline-flex;
    font-size: 11px;
    font-weight: 700;
    height: 24px;
    justify-content: center;
    width: 24px;
  }

  .due-date {
    color: var(--muted);
    font-size: 12px;
  }

  .due-date.late {
    color: var(--danger);
    font-weight: 700;
  }

  .description-icon {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }

  .card-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .delete-card-button {
    color: var(--danger);
    min-height: 28px;
  }

  .open-composer-button {
    color: var(--muted);
    margin: 2px 8px 10px;
    width: calc(100% - 16px);
  }

  .quick-card-form {
    display: grid;
    gap: 8px;
    margin: 2px 8px 10px;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .card-modal {
    border: 0;
    border-radius: 8px;
    max-width: 980px;
    padding: 0;
    width: min(980px, calc(100vw - 28px));
  }

  .card-modal::backdrop {
    background: rgba(15, 23, 42, 0.42);
  }

  .modal-shell {
    display: grid;
    grid-template-columns: minmax(0, 65%) minmax(260px, 35%);
    min-height: 560px;
    position: relative;
  }

  .modal-close {
    position: absolute;
    right: 12px;
    top: 12px;
    z-index: 1;
  }

  .modal-main,
  .modal-sidebar {
    display: grid;
    gap: 12px;
    padding: 24px;
  }

  .modal-sidebar {
    background: #f6f8fa;
    border-left: 1px solid var(--line);
    align-content: start;
  }

  .modal-title-input {
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    font-size: 20px;
    font-weight: 700;
    padding-left: 0;
  }

  .priority-editor,
  .activity-panel,
  .rework-history {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .priority-editor label {
    grid-template-columns: 1fr auto;
    align-items: center;
  }

  .priority-editor input[type="range"] {
    grid-column: 1 / -1;
    padding: 0;
    width: 100%;
  }

  .priority-editor output {
    font-weight: 700;
  }

  .priority-heading {
    align-items: center;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .checkbox-line {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  .checkbox-line input {
    min-height: auto;
  }

  .archive-button {
    color: var(--muted);
  }

  .toast {
    background: var(--danger);
    border-radius: 8px;
    bottom: 18px;
    color: #fff;
    opacity: 0;
    padding: 10px 14px;
    pointer-events: none;
    position: fixed;
    right: 18px;
    transform: translateY(10px);
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
  }

  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .toast-info {
    background: #344154;
  }

  .column-settings-modal {
    border: 0;
    border-radius: 8px;
    padding: 0;
    width: min(430px, calc(100vw - 28px));
  }

  .column-settings-modal::backdrop {
    background: rgba(15, 23, 42, 0.42);
  }

  .column-settings-form {
    display: grid;
    gap: 14px;
    padding: 22px;
  }

  .system-explanation {
    color: var(--muted);
    margin-top: 10px;
  }

  .metrics-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
  }

  .dashboard-grid {
    grid-template-columns: repeat(2, minmax(300px, 1fr));
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }

  .panel.wide {
    grid-column: 1 / -1;
  }

  .status-panel {
    border-top: 4px solid var(--accent);
  }

  .status-summary {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 10px 0;
  }

  .panel-message,
  .panel-note,
  .secondary-text {
    color: var(--muted);
    margin-top: 10px;
  }

  .panel-note {
    border-top: 1px solid var(--line);
    font-size: 12px;
    padding-top: 10px;
  }

  .quality-badge {
    border-radius: 999px;
    display: inline-flex;
    font-weight: 700;
    margin-top: 10px;
    padding: 5px 10px;
  }

  .quality-low,
  .state-unknown {
    background: #e8edf3;
    color: #344154;
  }

  .quality-medium,
  .state-attention {
    background: #fff1cc;
    color: #7a5200;
  }

  .quality-good {
    background: #e7f6ed;
    color: var(--ok);
  }

  .scenario-list {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    margin-top: 12px;
  }

  .scenario-item {
    background: #f6f8fa;
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid;
    gap: 4px;
    padding: 12px;
  }

  .scenario-item span {
    color: var(--muted);
    font-size: 12px;
  }

  dl {
    display: grid;
    gap: 8px 16px;
    grid-template-columns: 1fr auto;
    margin: 0;
  }

  dt {
    color: var(--muted);
  }

  dd {
    font-weight: 700;
    margin: 0;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 8px;
    text-align: left;
  }

  .state-badge {
    border-radius: 999px;
    color: white;
    display: inline-flex;
    font-weight: 700;
    padding: 4px 10px;
  }

  .state-stable {
    background: var(--ok);
  }

  .state-stressed {
    background: var(--warn);
  }

  .state-critical,
  .state-unstable {
    background: var(--danger);
  }

  .rho-track {
    background: linear-gradient(90deg, #2f9e44 0 70%, #f2c94c 70% 85%, #d92d20 85% 100%);
    border-radius: 999px;
    height: 16px;
    position: relative;
  }

  .rho-marker {
    background: #111827;
    border-radius: 2px;
    height: 24px;
    left: 0;
    position: absolute;
    top: -4px;
    width: 4px;
  }

  @media (max-width: 760px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .environment-badge {
      margin-left: 0;
    }

    .board-toolbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .kanban-board {
      grid-template-columns: repeat(8, 270px);
    }

    .modal-shell {
      grid-template-columns: 1fr;
    }

    .modal-sidebar {
      border-left: 0;
      border-top: 1px solid var(--line);
    }

    .metrics-grid {
      grid-template-columns: 1fr;
    }

    .scenario-list {
      grid-template-columns: 1fr;
    }
  }
</style>
