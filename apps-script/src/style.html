<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #17202a;
    --muted: #627184;
    --line: #d8dee8;
    --accent: #146c5f;
    --accent-ink: #ffffff;
    --warn: #b7791f;
    --danger: #b42318;
    --ok: #238636;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 Arial, sans-serif;
  }

  .topbar {
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 24px;
    justify-content: flex-start;
    padding: 14px 20px;
  }

  .main-nav {
    display: flex;
    gap: 8px;
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
  }

  h1 {
    font-size: 21px;
  }

  h3 {
    font-size: 13px;
    margin-bottom: 8px;
  }

  .topbar p {
    color: var(--muted);
    margin-top: 2px;
  }

  .environment-badge {
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-left: auto;
    padding: 6px 12px;
  }

  .environment-prod {
    background: #fdecec;
    color: var(--danger);
  }

  .environment-test {
    background: #e7f6ed;
    color: var(--ok);
  }

  main {
    padding: 14px;
  }

  button,
  input,
  select,
  textarea {
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font: inherit;
    min-height: 34px;
  }

  button {
    background: var(--surface);
    cursor: pointer;
    padding: 0 10px;
  }

  button:disabled {
    cursor: default;
    opacity: 0.45;
  }

  input,
  select,
  textarea {
    background: var(--surface);
    padding: 0 10px;
  }

  textarea {
    min-height: 120px;
    padding: 10px;
    resize: vertical;
  }

  .primary-button,
  .nav-button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .board-toolbar {
    align-items: end;
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    position: sticky;
    top: 0;
    z-index: 8;
    background: var(--bg);
    padding-top: 6px;
  }

  .toolbar-group {
    display: grid;
    gap: 4px;
  }

  .toolbar-label,
  .toolbar-select {
    color: var(--muted);
    font-size: 12px;
  }

  .pill-row {
    display: flex;
    gap: 6px;
    min-height: 34px;
  }

  .filter-pill {
    background: #e8edf3;
    border-color: transparent;
    border-radius: 999px;
    color: #344154;
    min-height: 30px;
    padding: 0 10px;
    white-space: nowrap;
  }

  .filter-pill.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .last-updated {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
    white-space: nowrap;
  }

  .column-header-actions {
    display: flex;
    gap: 4px;
  }

  .column-header-actions button {
    min-width: 34px;
    padding: 0 8px;
  }

  .column-header-actions button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .kanban-board {
    display: grid;
    gap: 12px;
    grid-auto-columns: minmax(260px, 1fr);
    grid-auto-flow: column;
    grid-template-columns: repeat(8, minmax(260px, 1fr));
    overflow-x: auto;
    overscroll-behavior-x: contain;
    padding: 0 52px 12px;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
  }

  .board-stage {
    position: relative;
  }

  .board-edge-button {
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid #aeb9c8;
    box-shadow: 0 2px 8px rgba(23, 32, 42, 0.14);
    font-size: 34px;
    height: 52px;
    min-width: 48px;
    padding: 0;
    position: fixed;
    top: 50vh;
    transform: translateY(-50%);
    z-index: 12;
  }

  .board-edge-left { left: 4px; }
  .board-edge-right { right: 4px; }

  .column {
    scroll-snap-align: start;
  }

  .column {
    background: #eef2f6;
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    height: clamp(480px, calc(100vh - 175px), 760px);
    overflow: hidden;
  }

  .column.drop-target {
    background: #e5f4ef;
    border-color: var(--accent);
  }

  .column-color-bar {
    background: var(--column-color, #e8e8e8);
    height: 4px;
    width: 100%;
    flex: 0 0 auto;
  }

  .column-header {
    display: grid;
    gap: 9px;
    min-height: 112px;
    flex: 0 0 auto;
    padding: 10px 10px 8px;
  }

  .column-summary-row {
    align-items: center;
    display: grid;
    gap: 6px;
    grid-template-columns: minmax(58px, auto) minmax(0, 1fr) minmax(52px, auto);
  }

  .column-summary-row .column-title {
    margin: 0;
    overflow-wrap: anywhere;
    text-align: center;
  }

  .column-summary-row .points-badge { justify-self: end; }

  .column h2 {
    color: #263446;
    font-size: 12px;
    letter-spacing: 0;
    margin: 0 0 7px;
    text-transform: uppercase;
  }

  .column-badges,
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .column-badge,
  .badge,
  .priority-badge {
    align-items: center;
    border-radius: 999px;
    display: inline-flex;
    font-size: 11px;
    min-height: 21px;
    padding: 2px 7px;
  }

  .column-badge,
  .badge {
    background: #e8edf3;
    color: #344154;
  }

  .stale-badge,
  .badge.rework {
    background: #fdecec;
    color: var(--danger);
  }

  .column-menu-button {
    min-height: 28px;
    padding: 0 8px;
  }

  .column-header-actions {
    justify-content: center;
  }

  .column-header-actions button {
    min-height: 36px;
  }

  .cards {
    flex: 1 1 auto;
    min-height: 0;
    overscroll-behavior-y: contain;
    overflow-y: auto;
    padding: 0 6px;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    margin-bottom: 6px;
    padding: 7px 8px;
    position: relative;
    transition: opacity 120ms ease, transform 120ms ease, border-color 120ms ease;
  }

  .card.custom-card-color {
    border-top: 3px solid var(--card-color);
  }

  .card:hover {
    border-color: #b7c2d0;
  }

  .card.dragging {
    opacity: 0.55;
    transform: scale(0.98);
  }

  .card.filtered-out {
    opacity: 0.2;
  }

  .card.stale-card {
    border-left: 4px solid var(--danger);
  }

  .card-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 1px;
    padding-right: 22px;
  }

  .card-client {
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 1px;
    min-height: 0;
  }

  .card-footer {
    align-items: center;
    display: flex;
    gap: 5px;
    margin-top: 5px;
  }

  .avatar {
    align-items: center;
    background: #dbe5ef;
    border-radius: 50%;
    color: #263446;
    display: inline-flex;
    font-size: 10px;
    font-weight: 700;
    height: 20px;
    justify-content: center;
    width: 20px;
  }

  .ambassador {
    background: #f5e6c8;
    border-radius: 10px;
    color: #634b1f;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 6px;
  }

  .due-date {
    color: var(--muted);
    font-size: 12px;
  }

  .due-date.late {
    color: var(--danger);
    font-weight: 700;
  }

  .description-icon {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }

  .card-actions {
    position: absolute;
    right: 4px;
    top: 4px;
  }

  .delete-card-button {
    background: transparent;
    border-color: transparent;
    color: var(--danger);
    font-size: 16px;
    min-height: 24px;
    min-width: 24px;
    opacity: 0;
    padding: 0;
  }

  .card:hover .delete-card-button,
  .delete-card-button:focus-visible { opacity: 1; }

  .card .badge,
  .card .priority-badge {
    font-size: 10px;
    min-height: 18px;
    padding: 1px 5px;
  }

  .open-composer-button {
    color: var(--accent);
    font-size: 21px;
    font-weight: 700;
    min-height: 36px;
    min-width: 40px;
    padding: 0;
  }

  .quick-card-form {
    display: grid;
    gap: 8px;
    margin: 2px 8px 10px;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .card-modal {
    border: 0;
    border-radius: 8px;
    max-width: 980px;
    padding: 0;
    width: min(980px, calc(100vw - 28px));
  }

  .card-modal::backdrop {
    background: rgba(15, 23, 42, 0.42);
  }

  .modal-shell {
    display: grid;
    grid-template-columns: minmax(0, 65%) minmax(260px, 35%);
    min-height: 560px;
    position: relative;
    /* Senza questo, le righe implicite della grid (tab nav, colonna
       principale/laterale, pannello cronologia) si distendono per
       riempire i 560px di min-height, spingendo tutto verso il basso
       e facendo gonfiare a dismisura la barra dei tab. */
    align-content: start;
  }

  .modal-close {
    position: absolute;
    right: 12px;
    top: 12px;
    z-index: 1;
  }

  .modal-main,
  .modal-sidebar {
    display: grid;
    gap: 12px;
    padding: 24px;
    /* Idem: senza questo i campi si distendono per riempire l'altezza
       imposta dalla colonna piu' alta, invece di restare compatti in
       cima con lo spazio in eccesso lasciato in fondo. */
    align-content: start;
  }

  .modal-sidebar {
    background: #f6f8fa;
    border-left: 1px solid var(--line);
  }

  .modal-title-input {
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    color: var(--muted);
    font-size: 16px;
    font-weight: 500;
    padding-left: 0;
  }

  .modal-client-input {
    border: 0;
    border-bottom: 2px solid var(--line);
    border-radius: 0;
    font-size: 24px;
    font-weight: 700;
    padding-left: 0;
  }

  #modal-description { min-height: 220px; resize: vertical; }

  .recent-activity-panel {
    background: #f6f8fa;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
  }

  .recent-activity-heading {
    align-items: center;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    margin: 0 0 8px;
  }

  .recent-activity-panel h3 {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    text-transform: uppercase;
  }

  .recent-activity-row {
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 10px;
    grid-template-columns: auto 1fr;
    padding: 6px 0;
  }

  .recent-activity-row:last-child {
    border-bottom: none;
  }

  /* P4 (DESIGN_lock_ambiente.md §2.4): riepilogo visivo del percorso
     della card, tab Informazioni — stesso linguaggio visivo del
     riquadro "Cronologia recente" subito sotto. */
  .path-summary-panel {
    background: #f6f8fa;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 0 0 16px;
    padding: 12px 16px;
  }

  .path-summary-panel h3 {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  .path-summary-bar {
    border-radius: 4px;
    display: flex;
    height: 14px;
    overflow: hidden;
    width: 100%;
  }

  .path-summary-segment {
    height: 100%;
    min-width: 2px;
  }

  .path-summary-segment-current {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 4px, transparent 4px, transparent 8px);
  }

  .path-summary-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-top: 10px;
  }

  .path-summary-legend-item {
    align-items: center;
    color: var(--muted);
    display: inline-flex;
    font-size: 12px;
    gap: 6px;
  }

  .path-summary-legend-dot {
    border-radius: 50%;
    flex: none;
    height: 10px;
    width: 10px;
  }

  .modal-context {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
  }

  .custom-value-field[hidden] {
    display: none;
  }

  .priority-editor {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .rework-history-note {
    color: var(--muted);
    font-size: 0.9em;
    margin: 0 0 12px;
  }

  .secondary-button {
    background: transparent;
    border: 1px solid var(--line);
    color: inherit;
  }

  .modal-tabs {
    display: flex;
    gap: 8px;
    grid-column: 1 / -1;
    padding: 16px 24px 0;
  }

  .modal-activity-panel {
    grid-column: 1 / -1;
    max-height: 70vh;
    overflow-y: auto;
    padding: 24px;
  }

  .activity-log-status,
  .activity-log-empty {
    color: var(--muted);
  }

  .activity-log-row {
    align-items: center;
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 10px;
    grid-template-columns: auto auto auto 1fr auto;
    padding: 10px 0;
  }

  .activity-log-ts {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .activity-log-badge {
    align-items: center;
    border-radius: 999px;
    display: inline-flex;
    font-size: 11px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  .activity-log-badge-type {
    background: #eef1f5;
    color: var(--muted);
  }

  .activity-log-badge-auto {
    background: #eef1f5;
    color: var(--muted);
  }

  .activity-log-badge-manual {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .activity-log-actions button {
    min-height: 28px;
    padding: 2px 8px;
  }

  .activity-log-banner {
    background: #fff1cc;
    border-radius: 8px;
    color: #7a5200;
    margin-bottom: 12px;
    padding: 10px 12px;
  }

  .activity-log-banner p {
    margin: 0;
  }

  .activity-log-banner p + p {
    margin-top: 4px;
  }

  #modal-activity-add-button {
    margin-top: 14px;
  }

  .activity-event-form {
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid;
    gap: 12px;
    margin-top: 14px;
    padding: 14px;
  }

  .activity-form-error {
    background: #fdecec;
    border-radius: 6px;
    color: var(--danger);
    padding: 8px 10px;
  }

  .activity-form-fields {
    display: grid;
    gap: 12px;
  }

  .activity-warning-list p,
  .activity-alignment-list {
    margin: 0 0 10px;
  }

  .activity-alignment-row {
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid;
    gap: 4px;
    margin-bottom: 10px;
    padding: 10px;
  }

  .activity-alignment-row label {
    align-items: center;
    display: inline-flex;
    gap: 6px;
    margin-right: 16px;
    min-height: auto;
  }

  .priority-editor label {
    grid-template-columns: 1fr auto;
    align-items: center;
  }

  .priority-editor .range-field {
    display: grid;
    grid-template-columns: 1fr auto;
    margin-bottom: 8px;
  }

  .priority-editor input[type="range"] {
    grid-column: 1 / -1;
    padding: 0;
    width: 100%;
  }

  .priority-editor output {
    font-weight: 700;
  }

  .priority-heading {
    align-items: center;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .checkbox-line {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  .checkbox-line input {
    min-height: auto;
  }

  .archive-button {
    color: var(--muted);
  }

  /* N4 (DESIGN_archiviazione.md, §6/§6b): viste Archivio/Cestino */
  .archive-panel {
    margin-bottom: 16px;
  }

  .archive-table td,
  .archive-table th {
    vertical-align: top;
  }

  .row-actions {
    display: flex;
    gap: 6px;
  }

  .danger-button {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .toast {
    background: var(--danger);
    border-radius: 8px;
    bottom: 18px;
    color: #fff;
    opacity: 0;
    padding: 10px 14px;
    pointer-events: none;
    position: fixed;
    right: 18px;
    transform: translateY(10px);
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
  }

  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .toast-info {
    background: #344154;
  }

  .column-settings-modal {
    border: 0;
    border-radius: 8px;
    padding: 0;
    width: min(430px, calc(100vw - 28px));
  }

  .column-settings-modal::backdrop {
    background: rgba(15, 23, 42, 0.42);
  }

  .column-settings-form {
    display: grid;
    gap: 14px;
    padding: 22px;
  }

  .field-hint {
    color: var(--muted);
    font-size: 12px;
    margin: -8px 0 0;
  }

  .options-manager-list {
    border: 1px solid var(--line);
    border-radius: 6px;
    display: grid;
    max-height: 280px;
    overflow-y: auto;
  }

  .option-manager-row {
    align-items: center;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    min-height: 44px;
    padding: 5px 7px 5px 10px;
  }

  .option-manager-row:last-child { border-bottom: 0; }
  .option-manager-row button { min-height: 34px; min-width: 34px; padding: 0; }

  .dashboard-quick {
    display: grid;
    gap: 14px;
    margin-bottom: 16px;
  }

  .dashboard-v3 {
    display: grid;
    gap: 18px;
    margin-bottom: 24px;
  }

  .v3-heading,
  .v3-section-heading,
  .v3-status-main,
  .v3-detail-dialog header {
    align-items: center;
    display: flex;
    gap: 16px;
    justify-content: space-between;
  }

  .v3-heading h1,
  .v3-heading p,
  .v3-section-heading h2,
  .v3-section-heading p,
  .v3-status-main h2,
  .v3-status-main p,
  .v3-detail-dialog h2,
  .v3-detail-dialog p {
    margin: 0;
  }

  .v3-heading p,
  .v3-section-heading p,
  .v3-updated-at,
  .v3-card-detail,
  .v3-card-note,
  .v3-card-action,
  .v3-diagnostics p,
  .v3-detail-dialog header p {
    color: var(--muted);
  }

  .v3-heading h1 { font-size: clamp(24px, 4vw, 34px); }
  .v3-updated-at { font-size: 12px; white-space: nowrap; }

  .v3-loading-state {
    align-items: center;
    background: #eef5fb;
    border: 1px solid #bfd5e8;
    border-radius: 12px;
    color: #24445e;
    display: flex;
    flex-direction: column;
    gap: 7px;
    justify-content: center;
    min-height: 118px;
    padding: 20px;
    text-align: center;
  }

  .v3-loading-state strong { font-size: clamp(20px, 3vw, 27px); }
  .v3-loading-state > span:last-child { color: var(--muted); font-size: 14px; }
  .v3-loading-spinner {
    animation: v3-loading-spin .85s linear infinite;
    border: 4px solid #cbddea;
    border-radius: 50%;
    border-top-color: #246b9b;
    height: 30px;
    width: 30px;
  }

  @keyframes v3-loading-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .v3-loading-spinner { animation: none; border-top-color: #cbddea; }
  }

  .v3-flow-status {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 8px solid #7b8796;
    border-radius: 12px;
    padding: 22px;
  }

  .v3-status-kicker {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .v3-status-main { justify-content: flex-start; margin-top: 10px; }
  .v3-status-main h2 { font-size: clamp(24px, 4vw, 36px); }
  .v3-status-main p { font-size: 16px; margin-top: 5px; }
  .v3-status-icon {
