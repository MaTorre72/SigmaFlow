<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #17202a;
    --muted: #627184;
    --line: #d8dee8;
    --accent: #146c5f;
    --accent-ink: #ffffff;
    --warn: #b7791f;
    --danger: #b42318;
    --ok: #238636;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 Arial, sans-serif;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 18px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  h1,
  h2,
  p {
    margin: 0;
  }

  h1 {
    font-size: 22px;
  }

  h2 {
    font-size: 15px;
    margin-bottom: 12px;
  }

  .topbar p {
    color: var(--muted);
    margin-top: 2px;
  }

  .environment-badge {
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
  }

  .environment-prod {
    background: #fdecec;
    color: var(--danger);
  }

  .environment-test {
    background: #e7f6ed;
    color: var(--ok);
  }

  main {
    padding: 20px;
  }

  button,
  input,
  select {
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    min-height: 36px;
  }

  button {
    background: var(--surface);
    cursor: pointer;
    padding: 0 12px;
  }

  .primary-button,
  .nav-button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .toolbar,
  .job-form {
    display: flex;
    align-items: end;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .job-form {
    align-items: end;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .form-title {
    font-weight: 700;
    min-height: 36px;
    display: flex;
    align-items: center;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  label {
    color: var(--muted);
    display: grid;
    gap: 4px;
    font-size: 12px;
  }

  input,
  select {
    background: var(--surface);
    color: var(--ink);
    padding: 0 10px;
  }

  .kanban-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(220px, 1fr));
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .column {
    background: #eef2f6;
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 420px;
    padding: 10px;
    transition: border-color 120ms ease, background 120ms ease;
  }

  .column.drop-target {
    background: #e5f4ef;
    border-color: var(--accent);
  }

  .column-header {
    align-items: flex-start;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .column h2 {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 2px;
  }

  .column-stats {
    color: var(--muted);
    font-size: 12px;
  }

  .rename-column-button {
    font-size: 12px;
    min-height: 28px;
    padding: 0 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: opacity 120ms ease, transform 120ms ease;
  }

  .card.dragging {
    opacity: 0.55;
    transform: scale(0.98);
  }

  .card-title {
    font-weight: 700;
    margin-bottom: 8px;
  }

  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge {
    background: #e8edf3;
    border-radius: 999px;
    color: #344154;
    font-size: 12px;
    padding: 2px 8px;
  }

  .badge.rework {
    background: #fdecec;
    color: var(--danger);
  }

  .card-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .delete-card-button {
    color: var(--danger);
    min-height: 30px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
    gap: 14px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }

  .panel.wide {
    grid-column: 1 / -1;
  }

  dl {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 16px;
    margin: 0;
  }

  dt {
    color: var(--muted);
  }

  dd {
    margin: 0;
    font-weight: 700;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 8px;
    text-align: left;
  }

  .state-badge {
    border-radius: 999px;
    color: white;
    display: inline-flex;
    font-weight: 700;
    padding: 4px 10px;
  }

  .state-stable {
    background: var(--ok);
  }

  .state-stressed {
    background: var(--warn);
  }

  .state-critical,
  .state-unstable {
    background: var(--danger);
  }

  .rho-track {
    background: linear-gradient(90deg, #2f9e44 0 70%, #f2c94c 70% 85%, #d92d20 85% 100%);
    border-radius: 999px;
    height: 16px;
    position: relative;
  }

  .rho-marker {
    background: #111827;
    border-radius: 2px;
    height: 24px;
    left: 0;
    position: absolute;
    top: -4px;
    width: 4px;
  }

  @media (max-width: 760px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .kanban-board {
      grid-template-columns: repeat(5, 260px);
    }

    .metrics-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
