<section class="toolbar">
  <button id="add-job-button" class="primary-button">+ Aggiungi job</button>
  <label>
    Assegnatario
    <input id="filter-assignee" type="search" placeholder="Tutti">
  </label>
  <label>
    Tag
    <input id="filter-tag" type="search" placeholder="Tutti">
  </label>
  <label>
    Taglia
    <select id="filter-size">
      <option value="">Tutte</option>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
    </select>
  </label>
</section>

<form id="job-form" class="job-form" hidden>
  <div class="form-title">Nuovo job</div>
  <label>
    Titolo
    <input name="title" required placeholder="Es. Sopralluogo Rossi">
  </label>
  <label>
    Assegnatario
    <input name="assignee" placeholder="Nome o email">
  </label>
  <label>
    Tag
    <input name="tag" placeholder="Es. urgente">
  </label>
  <label>
    Taglia
    <select name="size_class">
      <option>S</option>
      <option selected>M</option>
      <option>L</option>
      <option>XL</option>
    </select>
  </label>
  <div class="form-actions">
    <button type="submit" class="primary-button">Crea job</button>
    <button type="button" id="cancel-job-button">Annulla</button>
  </div>
</form>

<section id="kanban-board" class="kanban-board" aria-live="polite"></section>
