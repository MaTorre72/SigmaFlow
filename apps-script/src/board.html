<section class="board-toolbar">
  <div class="toolbar-group">
    <span class="toolbar-label">Team</span>
    <div id="assignee-filter-pills" class="pill-row"></div>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Tag</span>
    <div id="tag-filter-pills" class="pill-row"></div>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Taglia</span>
    <div id="size-filter-pills" class="pill-row">
      <button type="button" class="filter-pill" data-filter="size" data-value="XS">XS</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="S">S</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="M">M</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="L">L</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="XL">XL</button>
    </div>
  </div>
  <label class="toolbar-select">
    Priorita'
    <select id="filter-priority">
      <option value="">Tutte</option>
    </select>
  </label>
  <button id="reset-filters-button" type="button">Reset filtri</button>
  <button id="add-column-button" type="button">+ Colonna</button>
  <button id="manage-options-button" type="button">Gestisci menu</button>
  <button id="show-hidden-columns-button" type="button">Mostra nascoste</button>
  <span id="last-updated" class="last-updated">-</span>
</section>

<datalist id="assignee-options"></datalist>
<datalist id="tag-options"></datalist>

<div class="board-stage">
  <button id="scroll-board-left" class="board-edge-button board-edge-left" type="button" title="Colonne precedenti" aria-label="Scorri la lavagna a sinistra">&#8249;</button>
  <section id="kanban-board" class="kanban-board" aria-live="polite"></section>
  <button id="scroll-board-right" class="board-edge-button board-edge-right" type="button" title="Colonne successive" aria-label="Scorri la lavagna a destra">&#8250;</button>
</div>

<dialog id="card-modal" class="card-modal">
  <form method="dialog" class="modal-shell">
    <button type="button" id="modal-close-button" class="modal-close" aria-label="Chiudi">x</button>
    <nav class="modal-tabs">
      <button type="button" class="nav-button active" data-modal-tab="info">Informazioni</button>
      <button type="button" class="nav-button" data-modal-tab="activity">Cronologia</button>
    </nav>
    <section class="modal-main" id="modal-tab-info-main">
      <h2 id="card-modal-context" class="modal-context">Modifica card</h2>
      <input id="modal-client" class="modal-client-input" name="client" placeholder="Nome cliente">
      <input id="modal-title" class="modal-title-input" name="title" placeholder="Nome progetto">
      <textarea id="modal-description" name="description" rows="12" placeholder="Aggiungi note operative..."></textarea>
    </section>
    <aside class="modal-sidebar" id="modal-tab-info-sidebar">
      <label>Assegnatario
        <select id="modal-assignee" name="assignee"></select>
      </label>
      <label id="modal-assignee-custom-wrap" class="custom-value-field" hidden>Nuovo assegnatario
        <input id="modal-assignee-custom" autocomplete="off">
      </label>
      <label>Ambasciatore
        <select id="modal-ambassador" name="ambassador"></select>
      </label>
      <label id="modal-ambassador-custom-wrap" class="custom-value-field" hidden>Nuovo ambasciatore
        <input id="modal-ambassador-custom" autocomplete="off">
      </label>
      <label>Tag
        <select id="modal-tag" name="tag"></select>
      </label>
      <label id="modal-tag-custom-wrap" class="custom-value-field" hidden>Nuovo tag
        <input id="modal-tag-custom" autocomplete="off">
      </label>
      <label>Taglia
        <select id="modal-size" name="size_class">
          <option value="XS">XS - 3 pt</option>
          <option value="S">S - 5 pt</option>
          <option value="M">M - 8 pt</option>
          <option value="L">L - 13 pt</option>
          <option value="XL">XL - 20 pt</option>
        </select>
      </label>
      <div class="priority-editor">
        <div class="priority-heading">
          <span>Priorita'</span>
          <span id="modal-priority-badge" class="priority-badge">-</span>
        </div>
        <label class="range-field"><span>Impatto</span>
          <output id="modal-impact-value">1</output>
          <input id="modal-impact" name="impact" type="range" min="1" max="5" step="0.5">
        </label>
        <label class="range-field"><span>Gestibilita'</span>
          <output id="modal-manageability-value">1</output>
          <input id="modal-manageability" name="manageability" type="range" min="1" max="5" step="0.5">
        </label>
        <label>Classe
          <select id="modal-priority-class" name="priority_class"></select>
        </label>
      </div>
      <label>Scadenza
        <input id="modal-due-date" name="due_date" type="date">
      </label>
      <label>Colore card
        <select id="modal-card-color" name="card_color">
          <option value="">Predefinito</option>
          <option value="#DDEBF7">Azzurro chiaro</option>
          <option value="#E2F0D9">Verde chiaro</option>
          <option value="#FFF2CC">Giallo chiaro</option>
          <option value="#FCE4D6">Arancio chiaro</option>
          <option value="#E4DFEC">Viola chiaro</option>
          <option value="#F4CCCC">Rosso chiaro</option>
        </select>
      </label>
      <label class="checkbox-line">
        <input id="modal-invoiced" name="invoiced" type="checkbox">
        Fatturato
      </label>
      <section id="modal-rework-history" class="rework-history" hidden></section>
      <details id="modal-timestamp-correction" class="timestamp-correction" hidden>
        <summary>Correggi timestamp</summary>
        <label>Arrivo
          <input id="modal-correct-arrival" type="datetime-local">
        </label>
        <label>Inizio
          <input id="modal-correct-start" type="datetime-local">
        </label>
        <label>Completamento
          <input id="modal-correct-done" type="datetime-local">
        </label>
        <label>Motivo
          <input id="modal-correct-reason" type="text" placeholder="Motivo della correzione (obbligatorio)">
        </label>
        <button type="button" id="modal-correct-apply" class="secondary-button">Applica correzione</button>
      </details>
      <button type="button" id="modal-create-button" class="primary-button">Salva e chiudi</button>
      <button type="button" class="archive-button" disabled>Archivia</button>
    </aside>
    <section id="modal-tab-activity" class="modal-activity-panel" hidden>
      <div id="modal-activity-banner" class="activity-log-banner" hidden></div>
      <div id="modal-activity-list" class="activity-log-list"></div>
      <button type="button" id="modal-activity-add-button" class="secondary-button">Aggiungi evento</button>
      <form id="modal-activity-form" class="activity-event-form" hidden>
        <div id="modal-activity-form-error" class="activity-form-error" hidden></div>
        <label>Data e ora
          <input id="activity-form-ts" type="datetime-local">
        </label>
        <label>Tipo evento
          <select id="activity-form-type">
            <option value="move">Spostamento</option>
            <option value="note">Nota</option>
            <option value="correction">Correzione timestamp</option>
          </select>
        </label>
        <div id="activity-form-move-fields" class="activity-form-fields">
          <label>Verso colonna
            <select id="activity-form-to"></select>
          </label>
          <label>Nota opzionale
            <input id="activity-form-move-note" type="text" placeholder="Aggiungi una nota...">
          </label>
        </div>
        <div id="activity-form-note-fields" class="activity-form-fields" hidden>
          <label>Testo
            <textarea id="activity-form-note-text" rows="3"></textarea>
          </label>
        </div>
        <div id="activity-form-correction-fields" class="activity-form-fields" hidden>
          <label>Campo da correggere
            <select id="activity-form-correction-field">
              <option value="arrival_ts">Data creazione (arrival_ts)</option>
              <option value="start_ts">Data inizio (start_ts)</option>
              <option value="done_ts">Data completamento (done_ts)</option>
            </select>
          </label>
          <label>Nuovo valore
            <input id="activity-form-correction-new" type="datetime-local">
          </label>
          <label>Motivo
            <input id="activity-form-correction-reason" type="text" placeholder="Motivo della correzione">
          </label>
        </div>
        <div class="form-actions">
          <button type="button" id="activity-form-save" class="primary-button">Salva evento</button>
          <button type="button" id="activity-form-cancel" class="secondary-button">Annulla</button>
        </div>
      </form>
    </section>
  </form>
</dialog>

<dialog id="activity-sequence-dialog" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Attenzione — la cronologia cambia</h2>
    <div id="activity-sequence-warnings" class="activity-warning-list"></div>
    <p>Vuoi procedere comunque?</p>
    <div class="form-actions">
      <button type="button" id="activity-sequence-cancel">Annulla</button>
      <button type="button" id="activity-sequence-confirm" class="primary-button">Si, inserisci uguale</button>
    </div>
  </form>
</dialog>

<dialog id="activity-alignment-dialog" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Allinea i campi strutturati</h2>
    <div id="activity-alignment-list" class="activity-alignment-list"></div>
    <div class="form-actions">
      <button type="button" id="activity-alignment-cancel">Annulla tutto</button>
      <button type="button" id="activity-alignment-confirm" class="primary-button">Conferma</button>
    </div>
  </form>
</dialog>

<dialog id="activity-delete-dialog" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Eliminare questo evento dalla cronologia?</h2>
    <p>L'operazione non puo' essere annullata.</p>
    <div class="form-actions">
      <button type="button" id="activity-delete-cancel">Annulla</button>
      <button type="button" id="activity-delete-confirm" class="primary-button">Elimina</button>
    </div>
  </form>
</dialog>

<dialog id="options-manager-modal" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Gestisci menu</h2>
    <label>Elenco
      <select id="options-manager-kind">
        <option value="assignees">Assegnatari</option>
        <option value="ambassadors">Ambasciatori</option>
        <option value="tags">Tag</option>
      </select>
    </label>
    <div id="options-manager-list" class="options-manager-list"></div>
    <label>Nuovo valore
      <input id="options-manager-new" autocomplete="off">
    </label>
    <div class="form-actions">
      <button id="options-manager-add" type="button" class="primary-button">Aggiungi</button>
      <button id="options-manager-close" type="button">Chiudi</button>
    </div>
  </form>
</dialog>

<dialog id="column-settings-modal" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Impostazioni colonna</h2>
    <label>Nome
      <input id="column-settings-label" required>
    </label>
    <label>Colore
      <input id="column-settings-color" type="color">
    </label>
    <label>Tipo di colonna
      <select id="column-settings-role">
        <option value="neutral">Generica</option>
        <option value="backlog">Lavoro pronto</option>
        <option value="wip">Lavoro in corso</option>
        <option value="stand_by">Attesa</option>
        <option value="done">Concluso</option>
      </select>
    </label>
    <label>Posizione
      <select id="column-settings-position"></select>
    </label>
    <label class="checkbox-line">
      <input id="column-settings-visible" type="checkbox">
      Colonna visibile
    </label>
    <div class="form-actions">
      <button id="column-settings-save" type="button" class="primary-button">Salva</button>
      <button id="column-settings-cancel" type="button">Annulla</button>
    </div>
  </form>
</dialog>
