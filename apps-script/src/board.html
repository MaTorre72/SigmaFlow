<section class="board-toolbar">
  <div class="toolbar-group">
    <span class="toolbar-label">Team</span>
    <div id="assignee-filter-pills" class="pill-row"></div>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Tag</span>
    <div id="tag-filter-pills" class="pill-row"></div>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Taglia</span>
    <div id="size-filter-pills" class="pill-row">
      <button type="button" class="filter-pill" data-filter="size" data-value="XS">XS</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="S">S</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="M">M</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="L">L</button>
      <button type="button" class="filter-pill" data-filter="size" data-value="XL">XL</button>
    </div>
  </div>
  <label class="toolbar-select">
    Priorita'
    <select id="filter-priority">
      <option value="">Tutte</option>
    </select>
  </label>
  <button id="reset-filters-button" type="button">Reset filtri</button>
  <button id="add-column-button" type="button">+ Colonna</button>
  <button id="manage-options-button" type="button">Gestisci menu</button>
  <button id="show-hidden-columns-button" type="button">Mostra nascoste</button>
  <span id="last-updated" class="last-updated">-</span>
</section>

<datalist id="assignee-options"></datalist>
<datalist id="tag-options"></datalist>

<div class="board-stage">
  <button id="scroll-board-left" class="board-edge-button board-edge-left" type="button" title="Colonne precedenti" aria-label="Scorri la lavagna a sinistra">&#8249;</button>
  <section id="kanban-board" class="kanban-board" aria-live="polite"></section>
  <button id="scroll-board-right" class="board-edge-button board-edge-right" type="button" title="Colonne successive" aria-label="Scorri la lavagna a destra">&#8250;</button>
</div>

<dialog id="card-modal" class="card-modal">
  <form method="dialog" class="modal-shell">
    <button type="button" id="modal-close-button" class="modal-close" aria-label="Chiudi">x</button>
    <section class="modal-main">
      <h2 id="card-modal-context" class="modal-context">Modifica card</h2>
      <input id="modal-title" class="modal-title-input" name="title" placeholder="Titolo job">
      <input id="modal-client" name="client" placeholder="Cliente">
      <textarea id="modal-description" name="description" rows="8" placeholder="Aggiungi descrizione o note operative..."></textarea>
      <section class="activity-panel">
        <h3>Attivita'</h3>
        <p>Checklist e cronologia saranno aggiunte nella fase successiva.</p>
      </section>
    </section>
    <aside class="modal-sidebar">
      <label>Assegnatario
        <select id="modal-assignee" name="assignee"></select>
      </label>
      <label id="modal-assignee-custom-wrap" class="custom-value-field" hidden>Nuovo assegnatario
        <input id="modal-assignee-custom" autocomplete="off">
      </label>
      <label>Tag
        <select id="modal-tag" name="tag"></select>
      </label>
      <label id="modal-tag-custom-wrap" class="custom-value-field" hidden>Nuovo tag
        <input id="modal-tag-custom" autocomplete="off">
      </label>
      <label>Taglia
        <select id="modal-size" name="size_class">
          <option value="XS">XS - 3 pt</option>
          <option value="S">S - 5 pt</option>
          <option value="M">M - 8 pt</option>
          <option value="L">L - 13 pt</option>
          <option value="XL">XL - 20 pt</option>
        </select>
      </label>
      <div class="priority-editor">
        <div class="priority-heading">
          <span>Priorita'</span>
          <span id="modal-priority-badge" class="priority-badge">-</span>
        </div>
        <label class="range-field"><span>Impatto</span>
          <output id="modal-impact-value">1</output>
          <input id="modal-impact" name="impact" type="range" min="1" max="5" step="0.5">
        </label>
        <label class="range-field"><span>Gestibilita'</span>
          <output id="modal-manageability-value">1</output>
          <input id="modal-manageability" name="manageability" type="range" min="1" max="5" step="0.5">
        </label>
        <label>Classe
          <select id="modal-priority-class" name="priority_class"></select>
        </label>
      </div>
      <label>Scadenza
        <input id="modal-due-date" name="due_date" type="date">
      </label>
      <label>Colore card
        <select id="modal-card-color" name="card_color">
          <option value="">Predefinito</option>
          <option value="#DDEBF7">Azzurro chiaro</option>
          <option value="#E2F0D9">Verde chiaro</option>
          <option value="#FFF2CC">Giallo chiaro</option>
          <option value="#FCE4D6">Arancio chiaro</option>
          <option value="#E4DFEC">Viola chiaro</option>
          <option value="#F4CCCC">Rosso chiaro</option>
        </select>
      </label>
      <label class="checkbox-line">
        <input id="modal-invoiced" name="invoiced" type="checkbox">
        Fatturato
      </label>
      <section id="modal-rework-history" class="rework-history" hidden></section>
      <button type="button" id="modal-create-button" class="primary-button">Salva</button>
      <button type="button" class="archive-button" disabled>Archivia</button>
    </aside>
  </form>
</dialog>

<dialog id="options-manager-modal" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Gestisci menu</h2>
    <label>Elenco
      <select id="options-manager-kind">
        <option value="assignees">Assegnatari</option>
        <option value="tags">Tag</option>
      </select>
    </label>
    <div id="options-manager-list" class="options-manager-list"></div>
    <label>Nuovo valore
      <input id="options-manager-new" autocomplete="off">
    </label>
    <div class="form-actions">
      <button id="options-manager-add" type="button" class="primary-button">Aggiungi</button>
      <button id="options-manager-close" type="button">Chiudi</button>
    </div>
  </form>
</dialog>

<dialog id="column-settings-modal" class="column-settings-modal">
  <form method="dialog" class="column-settings-form">
    <h2>Impostazioni colonna</h2>
    <label>Nome
      <input id="column-settings-label" required>
    </label>
    <label>Colore
      <input id="column-settings-color" type="color">
    </label>
    <label>Tipo di colonna
      <select id="column-settings-role">
        <option value="neutral">Generica</option>
        <option value="backlog">Lavoro pronto</option>
        <option value="wip">Lavoro in corso</option>
        <option value="stand_by">Attesa</option>
        <option value="done">Concluso</option>
      </select>
    </label>
    <label>Posizione
      <select id="column-settings-position"></select>
    </label>
    <label class="checkbox-line">
      <input id="column-settings-visible" type="checkbox">
      Colonna visibile
    </label>
    <div class="form-actions">
      <button id="column-settings-save" type="button" class="primary-button">Salva</button>
      <button id="column-settings-cancel" type="button">Annulla</button>
    </div>
  </form>
</dialog>
