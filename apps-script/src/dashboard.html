<section id="metrics-grid" class="metrics-grid" aria-live="polite">
  <article class="panel">
    <h2>Stato del lavoro</h2>
    <div id="system-state" class="state-badge">-</div>
    <p id="rho-effective">Carico stimato: -</p>
    <p id="system-explanation" class="system-explanation"></p>
  </article>

  <article class="panel">
    <h2>Indicatori del flusso</h2>
    <dl id="empirical-metrics"></dl>
  </article>

  <article class="panel wide">
    <h2>Tempi e carico stimati</h2>
    <table id="queue-table"></table>
  </article>

  <article class="panel">
    <h2>Rientri e rilavorazioni</h2>
    <dl id="rework-metrics"></dl>
  </article>

  <article class="panel">
    <h2>Capacita' disponibile</h2>
    <div class="rho-track">
      <div id="rho-marker" class="rho-marker"></div>
    </div>
  </article>
</section>
